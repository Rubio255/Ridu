<style>
/* Layout: phone-first app shell; sticky header with role switch, tab bar, one column of cards (two columns on desktop for owner) */
:root{

}

  --ok:#6fd49c; --ok-bg:#163526; --warn:#f0c062; --warn-bg:#3a2e10; --bad:#f2958c; --bad-bg:#3d1916; --info:#8dbcf0; --info-bg:#172a40; color-scheme:dark}}

  --bg:#0e1514; --surface:#162120; --surface-2:#1f2d2b; --fg:#e6efed; --muted:#9db0ac; --line:#2c3d3a;
  --brand:#5fc2b4; --brand-fg:#062420; --accent:#f5c53a; --accent-fg:#1e1a00;
  --ok:#6fd49c; --ok-bg:#163526; --warn:#f0c062; --warn-bg:#3a2e10; --bad:#f2958c; --bad-bg:#3d1916; --info:#8dbcf0; --info-bg:#172a40; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.role select{font:inherit;font-size:.9rem;padding:6px 8px;border-radius:8px;border:0;background:var(--brand-fg);color:var(--brand);max-width:100%}
.demo-note{background:var(--accent);color:var(--accent-fg);font-size:.82rem}

  const q=quote(st.pricing,{k,wait:t.wait,extra:t.extra,peak:isPeak(t.at),handover:ho,day:dayType(t.at)});
  st.trips.push({id:"t"+(st.seq++),...t,km:k,drive:minutes(k),handover:ho,min:minutes(k)+ho+(t.wait||0),price:q.total,fromLabel:f.label,toLabel:to.label});
}
// Darbo laikas dienai: kelionė su vaiku + palyda + laukimas + tuščias privažiavimas (~tiek pat kiek kelionė)
function tripWork(t){return (t.min||0)+S.pricing.deadhead_min+S.pricing.gap_min}
const ACTIVE=["requested","confirmed","picked_up","delivered"];
function dayTrips(date,d){const d0=startOfDay(date).getTime();return S.trips.filter(t=>(!d||t.driver===d)&&ACTIVE.includes(t.status)&&startOfDay(new Date(t.at)).getTime()===d0)}
function dayLoad(date,extraMin=0,d){const ts=dayTrips(date,d);
  return ts.reduce((a,t)=>a+tripWork(t),0)+extraMin+((ts.length||extraMin)?S.pricing.break_min:0)}
// Ar naujai kelionei [start, start+min] užtenka laiko: pertrauka ir tarpas tarp kelionių
function slotProblem(start,min,ignoreId,d){
  const p=S.pricing, s=start.getTime(), e=s+min*6e4;
  const b0=new Date(start);b0.setHours(0,0,0,0);b0.setMinutes(p.break_start_h*60);const bs=b0.getTime(),be=bs+p.break_min*6e4;
  if(s<be&&bs<e) return `Šiuo metu vairuotojo pertrauka (${fmtTime(new Date(bs))}–${fmtTime(new Date(be))}).`;
  const gap=p.gap_min*6e4, pre=minutes(5)*6e4; // privažiavimas iki paėmimo
  const clash=dayTrips(start,d).find(t=>t.id!==ignoreId&&(()=>{const os=new Date(t.at).getTime(),oe=os+t.min*6e4;return s-pre<oe+gap&&os<e+gap})());
  if(clash) return `Šis laikas užimtas (kita kelionė ${fmtTime(new Date(clash.at))}). Tarp kelionių reikia bent ${p.gap_min} min.`;
  return "";
}

function substitutes(t){const iso=dayIso(t.at),wd=new Date(t.at).getDay()||7;
  const need=t.min+S.pricing.deadhead_min+S.pricing.gap_min, lim=S.pricing.day_limit_h*60, tried=t.offer?.tried||[];
  return S.drivers.filter(d=>d.id!==t.driver&&!tried.includes(d.id)&&d.active&&canCarry(d,t.child)&&!d.docs.some(x=>docState(x)==="bad")&&d.days.includes(wd)&&!absenceOn(d,iso)
      &&!slotProblem(new Date(t.at),t.min,t.id,d.id)&&dayLoad(new Date(t.at),need,d.id)<=lim)

  if(!nd){t.offer={to:null,tried,failed:true};return null}
  const exp=Math.min(Date.now()+OFFER_H*36e5,new Date(t.at).getTime()-36e5);
  t.offer={to:nd,tried,sent:new Date().toISOString(),expires:new Date(exp).toISOString()};return nd}

    const box=$("#quoteBox");
    if(!f||!t||f.id===t.id){box.innerHTML=`<h2>Kaina</h2><p class="muted">Pasirinkite skirtingas paėmimo ir nuvežimo vietas.</p>`;return}
    const k=km(f,t), at=new Date($("#bDate").value+"T"+$("#bTime").value);
    const ho=handoverFor(S.pricing,child($("#bChild")?.value)?.type), wait=+$("#bWait").value||0, dt=dayType(at);
    const q=quote(S.pricing,{k,wait,extra:+$("#bExtra").value||0,peak:isPeak(at),handover:ho,day:dt});
    const wds=[...document.querySelectorAll('input[name=wd]:checked')].length;
    const need=minutes(k)+ho+wait+S.pricing.deadhead_min+S.pricing.gap_min, over=!isNaN(at)&&dayLoad(at,need)>S.pricing.day_limit_h*60;
    const hhmm=$("#bTime").value||"00:00";
    const prob=isNaN(at)?"":(!isMorning(hhmm)&&!inAfternoon(hhmm))?`Vairuotojas dirba ${windowsText()}.`:slotProblem(at,minutes(k)+ho+wait);
    const full=over||!!prob;
    box.dataset.full=full?"1":"";
    const surNote=dt!=="workday"&&!S.pricing.surcharge_approved?`<div class="warnbox">${dt==="holiday"?"Šventinė diena":"Savaitgalis"}: kaina bus patikslinta, kai vairuotojas patvirtins priemoką.</div>`:"";
    box.innerHTML=`<h2>Kaina</h2>

      <div class="small muted"><a href="${mapsUrl(f,t)}" target="_blank" rel="noopener">Žiūrėti maršrutą žemėlapyje</a></div>
      ${over?`<div class="warnbox" style="background:var(--bad-bg);color:var(--bad)">Šią dieną vairuotojo grafikas pilnas. Pasirinkite kitą dieną.</div>`:prob?`<div class="warnbox" style="background:var(--bad-bg);color:var(--bad)">${esc(prob)} Pasirinkite kitą laiką.</div>`:""}${surNote}
      <div class="quote">

  };
  v.querySelectorAll("select,input").forEach(el=>el.addEventListener("input",upd));upd();
  $("#bookForm").addEventListener("submit",e=>{
    e.preventDefault();
    const from=$("#bFrom").value,to=$("#bTo").value;
    if(from===to){toast("Paėmimo ir nuvežimo vietos turi skirtis");return}
    if($("#quoteBox").dataset.full==="1"){toast("Šis laikas negalimas. Pasirinkite kitą.");return}
    const base={child:$("#bChild").value,from,to,by:role,payer:role,status:"requested",wait:+$("#bWait").value||0,extra:+$("#bExtra").value||0,note:$("#bNote").value.trim()};
    const wds=[...document.querySelectorAll('input[name=wd]:checked')].map(x=>+x.value);
    const first=new Date($("#bDate").value+"T"+$("#bTime").value);
    if(isNaN(first)){toast("Įveskite datą ir laiką");return}
    let n=0;
    base.driver=activeDrivers().slice().sort((a,b)=>dayLoad(first,0,a.id)-dayLoad(first,0,b.id))[0]?.id||"d1";
    if(!wds.length){addTrip(S,{...base,at:first.toISOString()});n=1}
    else{const sid="s"+Date.now();for(let i=0;i<28;i++){const d=new Date(first);d.setDate(d.getDate()+i);const wd=d.getDay()||7;if(wds.includes(wd)){addTrip(S,{...base,series:sid,at:d.toISOString()});n++}}}
    save();tab="trips";render();toast(n>1?`Pateikta ${n} kelionių. Laukia patvirtinimo.`:"Užsakymas pateiktas. Laukia patvirtinimo.");
  });
}

function quickCalc(P,{km,tpw,type,hourValue}){const n=tpw*52/12,drive=Math.round(km*2.75),extra=6;
  const trip=(P.minute_rate*(drive+handoverFor(P,type)+P.deadhead_min+P.gap_min)+P.km_rate*(km+P.empty_km))*(1-P.commit3_pct/100);
  const sub=Math.round(trip*n+P.platform_fee), hours=Math.round(((km+extra)*2.75+15+5)*n/60*10)/10;
  const car=Math.round((km+extra)*n*0.30+1*n), time=Math.round(hours*hourValue);return {sub,car,time,self:car+time,hours}}

function monthTrips(){const n=new Date(),m=n.getMonth(),y=n.getFullYear();
  return S.trips.filter(t=>{const d=new Date(t.at);return d.getMonth()===m&&d.getFullYear()===y})}
function billable(t){return ["confirmed","picked_up","delivered"].includes(t.status)}

// Platformos mokestis: 9,90 €/mėn. šeimai su PVM. Skaičiuojamas proporcingai sutarties dienoms,
// nebeskaičiuojamas nuo sutarties pabaigos ir neimamas, jei visas to mėnesio keliones atšaukė teikėjas.
const famKey=cid=>[...(child(cid)?.guardians||[])].sort().join("+");
function feeFamilies(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),dim=new Date(y,m+1,0).getDate(),ym=`${y}-${String(m+1).padStart(2,"0")}`;
  const ms=ym+"-01", me=ym+"-"+String(dim).padStart(2,"0"), fam={}, mt=monthTrips();
  S.subs.filter(s=>["active","ended"].includes(s.status)&&s.start).forEach(s=>{
    const a=s.start>ms?s.start:ms, b=s.status==="ended"&&s.end&&s.end<me?s.end:me;if(a>b)return;
    const k=famKey(s.child), f=fam[k]=fam[k]||{key:k,days:new Array(dim).fill(false),payers:new Set(),subs:new Set()};
    for(let d=+a.slice(8);d<=+b.slice(8);d++)f.days[d-1]=true;f.payers.add(s.payer);f.subs.add(s.id)});
  return Object.values(fam).map(f=>{const ts=mt.filter(t=>f.subs.has(t.series)), provider=ts.length>0&&!ts.some(billable)&&ts.some(t=>t.credit);
    const days=f.days.filter(Boolean).length, fee=provider?0:r2(S.pricing.platform_fee*days/dim);
    return {key:f.key,days,dim,provider,fee,payers:[...f.payers],share:r2(fee/f.payers.size)}})}
const feeFor=uid=>r2(feeFamilies().filter(f=>f.payers.includes(uid)).reduce((a,f)=>a+f.share,0));
const famPaysFee=cid=>S.subs.some(s=>s.status==="active"&&famKey(s.child)===famKey(cid));

function initPrices(P){
  var MIN_RATE=P.minute_rate, KM_RATE=P.km_rate, HANDOVER=P.handover_min, DEADHEAD=P.deadhead_min, BREAK_MIN=P.gap_min, EMPTY_KM=P.empty_km;
  var WEEKEND=P.weekend_pct/100, BASE=P.base_fee, INCL_KM=8, EXTRA_KM=1.2, MIN_PER_KM=2.75;
  var SHARE={1:1,2:P.share2/100,3:P.share3/100,4:P.share4/100}, PLATFORM_FEE=P.platform_fee;
  var feeEl=document.getElementById('pp-fee'); if(feeEl) feeEl.textContent=eur(PLATFORM_FEE,2);
  function eur(v,dec){return v.toLocaleString('lt-LT',{minimumFractionDigits:dec,maximumFractionDigits:dec})+' €';}
  function num(id,def){var v=parseFloat(document.getElementById(id).value);return isFinite(v)&&v>0?v:def;}
  function calc(){
    var km=num('km',8), kids=parseInt(document.getElementById('kids').value,10)||1, tpw=num('tpw',1);
    var mult=parseFloat(document.getElementById('slot').value), disc=parseFloat(document.getElementById('term').value);
    var wk=document.getElementById('wk').checked;
    var ho=handoverFor(P,document.getElementById('ptype').value);
    var drive=Math.round(km*MIN_PER_KM);
    var car=(MIN_RATE*(drive+ho+DEADHEAD+BREAK_MIN)+KM_RATE*(km+EMPTY_KM))*(wk?1+WEEKEND:1);
    var child=car*SHARE[Math.min(kids,4)];
    var trip=child*mult*(1-disc);
    var n=tpw*52/12;
    var single=(BASE+Math.max(0,km-INCL_KM)*EXTRA_KM)*(wk?1+WEEKEND:1);
    var sub=Math.round(trip*n+PLATFORM_FEE);
    document.getElementById('out-trip').textContent=eur(trip,2);
    var extra=parseFloat(document.getElementById('extra').value)||0;
    var carkm=parseFloat(document.getElementById('carkm').value)||0;
    var park=parseFloat(document.getElementById('park').value)||0;
    var wage=parseFloat(document.getElementById('wage').value)||0;
    var hour=wage/168*parseFloat(document.getElementById('method').value);
    var waitMin=parseFloat(document.getElementById('wait').value)||0;
    var hours=((km+extra)*MIN_PER_KM+15+waitMin)*n/60;
    var cCar=(km+extra)*n*carkm, cPark=park*n, cTime=hours*hour, total=Math.round(cCar+cPark+cTime);
    var hrs=hours.toLocaleString('lt-LT',{maximumFractionDigits:1});
    document.getElementById('a-sub').textContent=eur(sub,0);
    document.getElementById('a-self').textContent=eur(total,0);
    document.getElementById('a-hours').textContent=hrs+' val.';
    var mx=Math.max(sub,total,1);
    document.getElementById('b-sub').style.width=(sub/mx*100)+'%';
    document.getElementById('b-self').style.width=(total/mx*100)+'%';
    document.getElementById('self-car').textContent=eur(Math.round(cCar),0);
    document.getElementById('self-park').textContent=eur(Math.round(cPark),0);
    document.getElementById('self-time').textContent=eur(Math.round(cTime),0)+' ('+hrs+' val.)';
    function set(id,t){document.getElementById(id).textContent=t;}
    function h(v){return v.toLocaleString('lt-LT',{maximumFractionDigits:1})+' val.';}
    function k(v){return Math.round(v).toLocaleString('lt-LT')+' km';}
    var kmM=(km+extra)*n, saved=cCar+cPark+cTime;
    [[1,'1'],[9,'9']].forEach(function(m){var f=m[0],x=m[1];
      set('g-h'+x,h(hours*f)); set('g-k'+x,k(kmM*f)); set('g-c'+x,eur(Math.round(cCar*f),0));
      set('g-p'+x,eur(Math.round(cPark*f),0)); set('g-t'+x,eur(Math.round(cTime*f),0));
      set('g-s'+x,eur(Math.round(saved*f),0)); set('g-a'+x,eur(sub*f,0));
      var r=Math.round(saved*f-sub*f); set('g-r'+x,(r>=0?'+':'−')+eur(Math.abs(r),0));});
    var res=document.querySelector('.gain-t tr.res');
    if(saved>=sub){res.classList.add('plus');set('g-rl','Jūs sutaupote');}else{res.classList.remove('plus');set('g-rl','Jūs primokate');}
    var diff=sub-total, v=document.getElementById('verdict');
    if(diff<=0){
      v.classList.remove('warn');
      document.getElementById('v-badge').textContent='Apsimoka';
      document.getElementById('v-text').textContent='Abonementas pigesnis '+eur(-diff,0)+' per mėnesį, ir dar atgaunate '+hrs+' val. laiko.';
    } else {
      v.classList.add('warn');
      document.getElementById('v-badge').textContent='+'+eur(diff,0)+' /mėn.';
      document.getElementById('v-text').textContent='Tiek daugiau kainuoja abonementas, bet atgaunate '+hrs+' val. per mėnesį: tai '+eur(diff/hours,2)+' už kiekvieną valandą be vairavimo.';
    }
  }
  ['ptype','km','kids','tpw','slot','term','wk','extra','carkm','park','wage','method','wait'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',calc);el.addEventListener('change',calc);});
  calc();
}

/* ---------- Abonementai ---------- */
const SUB_ON=["active","pending"];
// Automobilio minutės, kurias užima viena abonemento kelionė
function carMin(k,type){const p=S.pricing;return minutes(k)+handoverFor(p,type)+p.deadhead_min+p.gap_min}
function subCarMin(s){const f=S.places.find(x=>x.id===s.from),t=S.places.find(x=>x.id===s.to);return carMin(km(f,t),child(s.child)?.type)}
// Užimtumas: parduotos automobilio minutės savaitės dienos valandos lange / 60 min
function winOcc(wd,hour,ignore,d){return S.subs.filter(s=>s.id!==ignore&&(!d||s.driver===d)&&SUB_ON.includes(s.status)&&s.weekdays.includes(wd)&&+s.time.slice(0,2)===hour).reduce((a,s)=>a+subCarMin(s),0)/60}
function occMult(o){const p=S.pricing;return o>=0.95?p.occ_m4:o>=0.8?p.occ_m3:o>=0.5?p.occ_m2:p.occ_m1}
function capacityMonth(){return 0}
function subscribedMonth(){return 0}
const hToMin=h=>Math.round(h*60), tToMin=t=>{const [a,b]=t.split(":");return +a*60+ +b};
const hmT=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function isMorning(time){const p=S.pricing,m=tToMin(time);return m>=hToMin(p.morning_start_h)&&m<hToMin(p.morning_end_h)}
function inAfternoon(time){const p=S.pricing,m=tToMin(time);return m>=hToMin(p.afternoon_start_h)&&m<hToMin(p.afternoon_end_h)}
function windowsText(){const p=S.pricing;return `rytais ${hmT(hToMin(p.morning_start_h))}–${hmT(hToMin(p.morning_end_h))} ir po pietų ${hmT(hToMin(p.afternoon_start_h))}–${hmT(hToMin(p.afternoon_end_h))}`}
function morningKids(wd,ignore,d){return S.subs.filter(s=>s.id!==ignore&&(!d||s.driver===d)&&SUB_ON.includes(s.status)&&s.weekdays.includes(wd)&&isMorning(s.time)).reduce((a,s)=>a+1+(s.extra||0),0)}
function afternoonTrips(wd,ignore,d){return S.subs.filter(s=>s.id!==ignore&&(!d||s.driver===d)&&SUB_ON.includes(s.status)&&s.weekdays.includes(wd)&&inAfternoon(s.time)).length}
function subQuote({from,to,weekdays,time,extra=0,months=1,child:cid},ignore,onlyDriver){
  const p=S.pricing, f=S.places.find(x=>x.id===from), t=S.places.find(x=>x.id===to);
  if(!f||!t||f.id===t.id||!weekdays.length) return null;
  const k=km(f,t), cm=carMin(k,child(cid)?.type), hour=+time.slice(0,2), kids=Math.min(4,1+extra);
  const carTrip=p.minute_rate*cm+p.km_rate*(k+p.empty_km);
  const share=kids===1?1:p["share"+kids]/100, childTrip=carTrip*share;
  const morning=isMorning(time), outside=!morning&&!inAfternoon(time);
  // Kiekvienam vairuotojui, kuris dirba tomis dienomis, skaičiuojamas užimtumas; parenkamas laisviausias
  const evalD=d=>{let occ,full;
    if(morning){occ=Math.max(...weekdays.map(w=>morningKids(w,ignore,d)))/p.morning_max_kids;full=Math.max(...weekdays.map(w=>morningKids(w,ignore,d)+kids))>p.morning_max_kids}
    else{occ=Math.max(...weekdays.map(w=>winOcc(w,hour,ignore,d)));const occAfter=Math.max(...weekdays.map(w=>winOcc(w,hour,ignore,d)+cm/60));
      full=occ>0.95||occAfter>1||Math.max(...weekdays.map(w=>afternoonTrips(w,ignore,d)))>=p.afternoon_max_trips}
    return {d,occ,full}};
  const cands=(onlyDriver?[drv(onlyDriver)].filter(Boolean):activeDrivers().filter(d=>weekdays.every(w=>d.days.includes(w))&&!d.docs.some(x=>docState(x)==="bad")&&canCarry(d,cid))).map(d=>evalD(d.id)).sort((a,b)=>(a.full-b.full)||(a.occ-b.occ));
  const best=cands[0]||{d:null,occ:1,full:true}, occ=best.occ, full=best.full, driver=best.d;
  const mult=full?p.occ_m4:occMult(occ);
  const commit=months>=9?p.commit9_pct:months>=3?p.commit3_pct:0;
  const perWeek=weekdays.length, n=Math.round(perWeek*52/12);
  const perChild=Math.round(childTrip*mult*(1-commit/100)*perWeek*52/12);
  return {k,cm,carTrip,childTrip,kids,share,occ,mult,commit,n,perWeek,perChild,monthly:perChild*kids,perTrip:r2(perChild/(perWeek*52/12)),full,morning,outside,f,t,driver};
}

// Patvirtinti ilgalaikiai užsakymai automatiškai sukuria keliones 14 dienų į priekį
function syncSubTrips(){
  const today=startOfDay(new Date());
  S.subs.filter(x=>x.status==="active").forEach(sb=>{
    for(let i=0;i<14;i++){const d=new Date(today);d.setDate(d.getDate()+i);const wd=d.getDay()||7;if(!sb.weekdays.includes(wd))continue;
      const [h,m]=sb.time.split(":");d.setHours(+h,+m,0,0);
      if(d<new Date())continue;
      if(S.trips.some(t=>(t.series===sb.id&&startOfDay(new Date(t.at)).getTime()===startOfDay(d).getTime())||(t.child===sb.child&&new Date(t.at).getTime()===d.getTime()&&ACTIVE.includes(t.status))))continue;
      addTrip(S,{child:sb.child,from:sb.from,to:sb.to,at:d.toISOString(),by:sb.payer,payer:sb.payer,status:"confirmed",wait:0,extra:sb.extra||0,note:"",series:sb.id,long:true,driver:sb.driver});
      S.trips[S.trips.length-1].price=sb.perTrip;}
  });
}

    <div class="small muted">${esc(S.places.find(p=>p.id===s.from).label)} → ${esc(S.places.find(p=>p.id===s.to).label)}</div>
    <div class="small">${eur(s.monthly)} / mėn.${s.months>1?` · ${s.months} mėn.`:""}${s.bid?" · jūsų pasiūlymas":""}</div></div>`).join("")||'<div class="empty">Ilgalaikių užsakymų dar nėra.</div>'}
    <p class="small muted" style="margin:0">Galiojantys užsakymai pratęsiami ta pačia kaina.</p></div></div>`;
  if(pl.length>4){$("#sFrom").selectedIndex=3;$("#sTo").selectedIndex=4}else if(pl.length>1){$("#sFrom").selectedIndex=pl.length-2;$("#sTo").selectedIndex=pl.length-1}

function activateSub(s){s.start=s.start||isoAdd(0);s.months=s.months||1;if(s.months>1)s.end=addMonthsIso(s.start,s.months);s.no=s.no||("S-"+new Date().getFullYear()+"-"+String(S.subs.filter(x=>x.no).length+1).padStart(3,"0"))}
function contractState(s){if(s.status==="ended")return "ended";if(s.status==="active"&&s.end&&s.end<isoAdd(0))return "renew";return s.status}
function hasReq(u){const c=S.consents[u]||{};return CONSENTS.filter(x=>reqFor(x,u)).every(x=>c[x.key]?.granted&&c[x.key].version===TERMS_VERSION)}
function consentTxt(u){if(!hasReq(u))return "Dar nesutiko su sąlygomis";const c=S.consents[u],at=CONSENTS.map(x=>c[x.key]?.at).filter(Boolean).sort().pop();
  return `Sutiko ${new Date(at).toLocaleDateString("lt-LT")}: ${CONSENTS.filter(x=>c[x.key]?.granted).map(x=>SHORT[x.key]).join(", ")}`}
const termsHtml=()=>`<div class="card"><h2>Paslaugų teikimo sąlygos</h2><ol style="margin:0;padding-left:20px;display:grid;gap:8px">${TERMS.map(([t,b])=>`<li><b>${esc(t)}.</b> ${esc(b)}</li>`).join("")}</ol>
  <p class="small muted" style="margin:0">Sąlygų versija ${TERMS_VERSION}. <a href="${FULL_TERMS}" target="_blank" rel="noopener">Pilnos taisyklės ir privatumo politika</a></p></div>`;
const consentForm=(submit)=>{const c=S.consents[role]||{};return `<form class="card" id="consentForm"><h2>Sutikimai</h2>${CONSENTS.map(x=>`<label class="row" for="cs_${x.key}" style="align-items:flex-start;flex-wrap:nowrap"><input type="checkbox" id="cs_${x.key}" name="${x.key}" ${c[x.key]?.granted&&c[x.key].version===TERMS_VERSION?"checked":""} ${reqFor(x,role)?"required":""} style="width:20px;height:20px;flex:none;margin-top:2px"><span>${esc(x.label)} <span class="small ${reqFor(x,role)?"":"muted"}" style="${reqFor(x,role)?"color:var(--bad)":""}">${reqFor(x,role)?"privaloma":x.key==="guardian"?"jei vežame vaiką":"savanoriška"}</span></span></label>`).join("")}
  <p class="small muted" style="margin:0">Savanoriškus sutikimus galite bet kada pakeisti skiltyje „Sąlygos“.</p><button class="btn primary" type="submit">${submit}</button></form>`};
function bindConsent(msg){$("#consentForm").addEventListener("submit",e=>{e.preventDefault();const cur=S.consents[role]||{},now=new Date().toISOString();
  S.consents[role]=Object.fromEntries(CONSENTS.map(x=>{const g=$("#cs_"+x.key).checked,o=cur[x.key];return [x.key,o&&o.granted===g&&o.version===TERMS_VERSION?o:{granted:g,version:TERMS_VERSION,at:now}]}));save();render();toast(msg)})}
function vGate(v){v.innerHTML=`<div class="card"><h2>Sveiki, ${esc(users[role]?.name||"")}!</h2><p style="margin:0">Prieš užsakydami keliones, perskaitykite sąlygas ir pažymėkite sutikimus.</p></div>${termsHtml()}${consentForm("Sutinku ir tęsiu")}`;bindConsent("Ačiū! Sutikimai išsaugoti.")}
function vTerms(v){v.innerHTML=termsHtml()+consentForm("Išsaugoti sutikimus");bindConsent("Sutikimai išsaugoti")}
function vContracts(v){
  const own=isOwner(), mineKids=own?[]:myChildren().map(c=>c.id);
  const list=SB().filter(s=>["active","ended"].includes(s.status)&&(own||s.payer===role||mineKids.includes(s.child)));
  const shown=list.filter(s=>contractFilter==="all"||(contractFilter==="active")===(s.status==="active")).sort((a,b)=>(b.start||"").localeCompare(a.start||""));
  const act=list.filter(s=>s.status==="active"), ended=list.filter(s=>s.status==="ended");
  const term=s=>s.months>1?`${s.months} mėn.`:"Kas mėnesį pratęsiama";
  const period=s=>s.end?`${fmtD(s.start)} – ${fmtD(s.end)}`:`nuo ${fmtD(s.start)}, neterminuota`;
  const row=s=>`<div class="child"><div class="spread"><b>${s.no?esc(s.no)+" · ":""}${esc(child(s.child).name)} · ${s.weekdays.map(w=>DAYS[w-1]).join(", ")} ${s.time}</b><span class="pill ${s.status==="active"?"s-confirmed":"s-rejected"}">${s.status==="active"?"Galioja":"Pasibaigusi"}</span></div>
    <div class="small muted">${isMB()?"Vairuotojas "+esc(drvName(s.driver))+" · ":""}${own?esc(users[s.payer]?.name||s.payer)+" · ":s.payer!==role?"Moka "+esc(users[s.payer]?.name||s.payer)+" · ":""}${esc(S.places.find(x=>x.id===s.from).label)} → ${esc(S.places.find(x=>x.id===s.to).label)}</div>
    <div class="small"><b>${eur(s.monthly)} / mėn.</b> · ${term(s)} · ${period(s)}${s.endReason?` · ${esc(s.endReason)}`:""}</div>
    ${isMB()&&s.status==="active"?`<div class="row"><button class="btn bad" data-end="${s.id}">Nutraukti sutartį</button></div>`:""}</div>`;
  v.innerHTML=`<div class="stats">
    <div class="stat"><span class="small muted">Galiojančios sutartys</span><b>${act.length}</b></div>
    <div class="stat"><span class="small muted">${isDriver()?"Sutarčių vertė per mėnesį":own?"Mėnesio pajamos":"Mokate per mėnesį"}</span><b>${eur(act.filter(s=>own||s.payer===role).reduce((a,s)=>a+s.monthly,0)+(own||isDriver()?0:feeFor(role)))}</b>${own||isDriver()?"":`<span class="small muted">su platformos mokesčiu ${eur(feeFor(role))}</span>`}</div>
    <div class="stat"><span class="small muted">Pasibaigusios</span><b>${ended.length}</b></div></div>
  <div class="card"><div class="spread"><h2>Sutartys</h2><div class="row" role="group" aria-label="Rodyti sutartis">${[["active","Galiojančios"],["ended","Pasibaigusios"],["all","Visos"]].map(([k,l])=>`<button type="button" class="btn ${contractFilter===k?"primary":""}" data-cfilter="${k}">${l}</button>`).join("")}</div></div>
  ${shown.map(row).join("")||`<div class="empty">${contractFilter==="ended"?"Pasibaigusių sutarčių nėra.":"Sutarčių nėra."}</div>`}
  <p class="small muted" style="margin:0">${isDriver()?"Sutartis sudaro ir nutraukia MB.":own?"Nutraukus sutartį, būsimos jos kelionės atšaukiamos ir tėvams išsiunčiamas pranešimas.":"Norėdami nutraukti sutartį, susisiekite su vairuotoju."}</p></div>`;

function activeDriversAll(){return S.drivers}
// Vairuotojo mėnuo: vienos dienos kelionės + galiojančių sutarčių mėnesio kaina; išmoka = % nuo sumos be PVM
function driverMonth(d){const p=S.pricing,mt=monthTrips().filter(t=>t.driver===d.id&&billable(t)&&!t.long);
  const singles=mt.reduce((a,t)=>a+t.price,0), subs=S.subs.filter(x=>x.driver===d.id&&x.status==="active"), subSum=subs.reduce((a,x)=>a+x.monthly,0);
  const credit=monthTrips().filter(t=>t.driver===d.id&&t.credit).reduce((a,t)=>a+t.price,0);
  const gross=Math.max(0,singles+subSum-credit), net=gross/(1+p.vat_pct/100), pct=drvPct(d), payout=r2(net*pct/100);
  const kms=mt.reduce((a,t)=>a+t.km*2,0)+subs.reduce((a,x)=>a+Math.round(x.weekdays.length*52/12)*(km(S.places.find(q=>q.id===x.from),S.places.find(q=>q.id===x.to))+p.empty_km),0);
  return {trips:mt.length,subs:subs.length,gross,net,pct,payout,mb:r2(net-payout),kms,fuel:r2(kms*FUEL_L_100/100*FUEL_PRICE),car:p.cost_insurance+p.cost_wash+p.cost_service}}
function bestDriverFor(s){const q=subQuote({...s,months:s.months||1},s.id);return q&&q.driver}
function absenceBlock(){const aff=affectedTrips();const abs=S.drivers.flatMap(d=>(d.absences||[]).filter(a=>a.to>=isoAdd(0)).map(a=>({d,a})));
  if(!abs.length)return "";
  return `<div class="card"><div class="spread"><h2>Liga ir remontas</h2>${aff.some(t=>!t.offer?.to&&substitutes(t).length)?`<button class="btn primary" data-subauto="1">Siųsti pasiūlymus visoms</button>`:""}</div>
  ${abs.map(({d,a})=>`<div class="small"><b>${esc(d.name)}</b>: ${ABS[a.reason]} ${fmtD(a.from)} – ${fmtD(a.to)}${a.note?` · ${esc(a.note)}`:""} <button class="btn" data-absdel="${d.id}:${a.id}">Panaikinti</button></div>`).join("")}
  ${aff.length?aff.sort((x,y)=>x.at<y.at?-1:1).map(t=>{const subs=substitutes(t),dt=new Date(t.at);return `<div class="child"><div class="spread"><b>${fmtDay(dt)} ${fmtTime(dt)} · ${esc(child(t.child).name)}</b><span class="small muted">${esc(drvName(t.driver))}</span></div>
    <div class="small muted">${esc(t.fromLabel)} → ${esc(t.toLabel)}</div>
    ${t.offer?`<div class="small"><span class="pill ${t.offer.to?"s-requested":"s-rejected"}">${t.offer.to?"Pasiūlyta":"Nepriimta"}</span> ${esc(offerState(t))}${t.offer.tried?.length?` · atsisakė ar neatsakė: ${t.offer.tried.map(drvName).map(esc).join(", ")}`:""}</div>`:""}
    <div class="row">${t.offer?.to?"":subs.length?`<label class="small" for="sub_${t.id}">Siūlyti</label><select id="sub_${t.id}">${subs.map(d=>`<option value="${d.id}">${esc(d.name)} (dienos darbas ${hm(dayLoad(new Date(t.at),0,d.id))})</option>`).join("")}</select><button class="btn ok" data-subst="${t.id}">Siųsti pasiūlymą</button>`:`<span class="small">Laisvo vairuotojo tuo metu nėra.</span>`}
    <button class="btn bad" data-abscancel="${t.id}">Atšaukti be mokesčio</button></div></div>`}).join(""):`<div class="empty">Paveiktų kelionių nėra.</div>`}
  <p class="small muted" style="margin:0">Siūloma tik tiems vairuotojams, kurie tuo metu laisvi ir neviršys ${S.pricing.day_limit_h} val. darbo dienos. Vairuotojas pasiūlymą priima arba atsisako savo aplikacijoje; neatsakius per ${OFFER_H} val., siūloma kitam. Priėmus, tėvams pranešama apie kitą vairuotoją. Jei pakaitos nėra, kelionė atšaukiama be mokesčio, o jos kaina įskaitoma į kito mėnesio sąskaitą.</p></div>`}

  const reqTrips=S.trips.filter(t=>t.status==="requested"&&new Date(t.at)>new Date());

  v.innerHTML=`<div class="stats">
    <div class="stat"><span class="small muted">Laukia paskirstymo</span><b>${pend.length}</b></div>
    <div class="stat"><span class="small muted">Vienos dienos prašymai</span><b>${reqTrips.length}</b></div>

    <div class="stat"><span class="small muted">Kelionės be vairuotojo (liga, remontas)</span><b>${affectedTrips().length}</b></div></div>
  ${visitsBlock()}${absenceBlock()}
  ${warn.length?`<div class="warnbox">${warn.map(d=>`${esc(d.name)}: ${driverDocIssues(d).map(x=>`${esc(x.name)} ${docState(x)==="bad"?"pasibaigė":"baigiasi"} ${fmtD(x.until)}`).join(", ")}`).join("<br>")}</div>`:""}
  <div class="grid2"><div class="card"><div class="spread"><h2>Nauji ilgalaikiai užsakymai</h2>${pend.length?`<button class="btn" data-auto="1">Paskirstyti automatiškai</button>`:""}</div>
    <p class="small muted" style="margin:0">Pasiūlytas laisviausias vairuotojas, kuris dirba tomis dienomis. Galite pakeisti prieš patvirtindami.</p>
    ${pend.map(s=>{const best=bestDriverFor(s);return `<div class="child"><div class="spread"><b>${esc(users[s.payer]?.name||s.payer)} · ${esc(child(s.child).name)} · ${s.weekdays.map(w=>DAYS[w-1]).join(", ")} ${s.time}</b><span class="price">${eur(s.monthly)}/mėn.</span></div>
      <div class="small muted">${esc(S.places.find(x=>x.id===s.from).label)} → ${esc(S.places.find(x=>x.id===s.to).label)}${s.bid?" · <b>aukciono pasiūlymas</b>":""}${best?` · siūlomas ${esc(drvName(best))}`:" · nėra laisvo vairuotojo"}</div>
      <div class="row"><label class="small" for="as_${s.id}">Vairuotojas</label><select id="as_${s.id}">${activeDrivers().map(d=>`<option value="${d.id}" ${d.id===(s.driver||best)?"selected":""}>${esc(d.name)}</option>`).join("")}</select>
      <button class="btn ok" data-sub="active" data-id="${s.id}">Patvirtinti</button><button class="btn bad" data-sub="rejected" data-id="${s.id}">Atmesti</button></div></div>`}).join("")||'<div class="empty">Naujų užsakymų nėra.</div>'}</div>
  <div class="card"><h2>Vairuotojų užimtumas šią savaitę</h2><div class="scroll"><table><thead><tr><th>Vairuotojas</th>${DAYS.slice(0,5).map(d=>`<th class="num">${d}</th>`).join("")}</tr></thead><tbody>
    ${S.drivers.map(d=>`<tr><td>${esc(d.name)}${d.active?"":" <span class=\"tag\">neaktyvus</span>"}</td>${[1,2,3,4,5].map(w=>{if(!d.days.includes(w))return `<td class="num muted">–</td>`;const dt=new Date(today);dt.setDate(dt.getDate()+((w-(dt.getDay()||7)+7)%7));const m=dayLoad(dt,0,d.id),lim=S.pricing.day_limit_h*60;return `<td class="num"><span class="pill ${m>lim?"s-rejected":m>lim*0.7?"s-requested":"s-delivered"}">${hm(m)}</span></td>`}).join("")}</tr>`).join("")}
    </tbody></table></div><p class="small muted" style="margin:0">Darbo laikas pagal patvirtintas keliones. Riba ${S.pricing.day_limit_h} val. per dieną.</p></div></div>
  ${reqTrips.length?`<div class="card"><h2>Vienos dienos prašymai</h2>${reqTrips.map(t=>tripRow(t,{owner:true,conflict:hasConflict(t)})).join("")}</div>`:""}`;
}
function vDrivers(v){
  const p=S.pricing;

    <div class="days">${DAYS.slice(0,5).map((x,i)=>`<label><input type="checkbox" data-myday="${i+1}" id="myd${i+1}" ${d.days.includes(i+1)?"checked":""}><span>${x}</span></label>`).join("")}</div></div></div>`;

function vSubsOwner(v){
  const p=S.pricing;
  const OD=isDriver()?role:occDrv||S.drivers[0].id;
  const act=SB().filter(s=>s.status==="active"), pend=SB().filter(s=>s.status==="pending").sort((a,b)=>(b.bid?1:0)-(a.bid?1:0)||b.monthly-a.monthly);
  const hours=[13,14,15,16,17,18];
  const subRow=s=>`<div class="child"><div class="spread"><b>${esc(users[s.payer].name)} · ${esc(child(s.child).name)} · ${s.weekdays.map(w=>DAYS[w-1]).join(", ")} ${s.time}</b><span class="price">${eur(s.monthly)}/mėn.</span></div>
    <div class="small muted">${esc(S.places.find(x=>x.id===s.from).label)} → ${esc(S.places.find(x=>x.id===s.to).label)}${s.months>1?` · ${s.months} mėn.`:""}${s.bid?" · <b>aukciono pasiūlymas</b>":""}</div>
    ${s.status==="pending"?(isMB()?`<div class="row"><label class="small" for="as_${s.id}">Vairuotojas</label><select id="as_${s.id}">${S.drivers.filter(d=>d.active).map(d=>`<option value="${d.id}" ${d.id===s.driver?"selected":""}>${esc(d.name)}</option>`).join("")}</select><button class="btn ok" data-sub="active" data-id="${s.id}">Patvirtinti</button><button class="btn bad" data-sub="rejected" data-id="${s.id}">Atmesti</button></div>`:`<div class="small muted">Laukia MB patvirtinimo</div>`):isMB()?`<div class="small muted">Vairuotojas: ${esc(drvName(s.driver))}</div>`:""}</div>`;
  v.innerHTML=`<div class="stats">
    <div class="stat"><span class="small muted">Galiojantys abonementai</span><b>${act.length}</b></div>
    <div class="stat"><span class="small muted">Abonementų pajamos / mėn.</span><b>${eur(act.reduce((a,s)=>a+s.monthly,0))}</b></div>
    <div class="stat"><span class="small muted">Klientų su abonementu</span><b>${new Set(act.map(s=>s.payer)).size}</b></div>
    <div class="stat"><span class="small muted">Aukcionas baigiasi</span><b>${p.bid_close_day} d.</b></div></div>
  <div class="grid2"><div class="card"><h2>Laukia sprendimo</h2><p class="small muted" style="margin:0">Aukciono pasiūlymai viršuje, surikiuoti nuo didžiausio.</p>${pend.map(subRow).join("")||'<div class="empty">Naujų prašymų nėra.</div>'}</div>
  <div class="card"><h2>${isDriver()?"Mano užimtumas":"Užimtumas pagal valandas"}</h2>${isMB()?`<div class="field"><label for="occDrv">Vairuotojas</label><select id="occDrv">${S.drivers.map(d=>`<option value="${d.id}" ${d.id===OD?"selected":""}>${esc(d.name)}</option>`).join("")}</select></div>`:""}<div class="scroll"><table><thead><tr><th>Val.</th>${DAYS.slice(0,5).map(d=>`<th class="num">${d}</th>`).join("")}</tr></thead>
  <tbody><tr><td>Rytas, vaikai</td>${[1,2,3,4,5].map(w=>{const n=morningKids(w,null,OD);return `<td class="num"><span class="pill ${n>=p.morning_max_kids?"s-rejected":n?"s-requested":"s-delivered"}">${n}/${p.morning_max_kids}</span></td>`}).join("")}</tr>
  <tr><td>Popietė, kelionės</td>${[1,2,3,4,5].map(w=>{const n=afternoonTrips(w,null,OD);return `<td class="num"><span class="pill ${n>=p.afternoon_max_trips?"s-rejected":n?"s-requested":"s-delivered"}">${n}/${p.afternoon_max_trips}</span></td>`}).join("")}</tr>
  ${hours.map(h=>`<tr><td>${String(h).padStart(2,"0")}:00</td>${[1,2,3,4,5].map(w=>{const o=winOcc(w,h,null,OD);return `<td class="num"><span class="pill ${o>0.95?"s-rejected":o>=0.5?"s-requested":"s-delivered"}">${Math.round(o*100)}%</span></td>`}).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="small muted" style="margin:0">Užimta automobilio laiko dalis kiekvienoje valandoje. Virš 95% laikas parduodamas aukcionu.</p></div></div>
  <div class="card"><h2>Galiojantys</h2>${act.map(subRow).join("")||'<div class="empty">Dar nėra.</div>'}</div>`;
}

document.addEventListener("click",e=>{
  const sb=e.target.closest("[data-sub]");if(sb){const s=S.subs.find(x=>x.id===sb.dataset.id);if(s){const sel=$("#as_"+s.id);if(sel)s.driver=sel.value;s.status=sb.dataset.sub;if(s.status==="active"){activateSub(s);syncSubTrips()}save();render();toast(s.status==="active"?"Abonementas patvirtintas":"Abonementas atmestas")}return}
  const so=e.target.closest("[data-subst]");if(so){const t=S.trips.find(x=>x.id===so.dataset.subst),nd=$("#sub_"+t.id).value;sendOffer(t,nd);save();render();toast(`Pasiūlymas išsiųstas ${drvName(nd)}. Laukiama atsakymo.`);return}
  const sa=e.target.closest("[data-subauto]");if(sa){let n=0,c=0;affectedTrips().sort((x,y)=>x.at<y.at?-1:1).filter(t=>!t.offer?.to).forEach(t=>{sendOffer(t)?n++:c++});save();render();toast(`Išsiųsta pasiūlymų: ${n}.${c?` ${c} kel. neturi laisvo vairuotojo.`:""}`);return}
  const of=e.target.closest("[data-offer]");if(of){const t=S.trips.find(x=>x.id===of.dataset.offer);if(!t||t.offer?.to!==role){render();return}
    if(of.dataset.ans==="yes"){if(slotProblem(new Date(t.at),t.min,t.id,role)){toast("Šis laikas jums jau užimtas");return}
      t.driver=role;t.subNote=`Kelionę atliks kitas vairuotojas: ${drvName(role)}`;t.offer=null;save();render();toast("Priimta. Kelionė jūsų kalendoriuje, tėvams ir MB pranešta.")}
    else{t.offer.tried=[...(t.offer.tried||[]),role];t.offer.to=null;const nx=sendOffer(t);save();render();toast(nx?"Atsisakyta. Pasiūlyta kitam vairuotojui.":"Atsisakyta. MB pranešta.")}return}
  const ac=e.target.closest("[data-abscancel]");if(ac){if(ac.dataset.sure!=="1"){ac.dataset.sure="1";ac.textContent="Tikrai atšaukti?";return}
    const t=S.trips.find(x=>x.id===ac.dataset.abscancel);const a=absenceOn(drv(t.driver),dayIso(t.at));t.status="cancelled";t.fee=0;t.credit=true;t.subNote=`Atšaukta dėl vairuotojo: ${ABS[a?.reason||"other"].toLowerCase()}. Mokestis netaikomas, kaina įskaitoma į sąskaitą.`;save();render();toast("Atšaukta be mokesčio. Tėvams išsiųstas pranešimas.");return}
  const ad=e.target.closest("[data-absdel]");if(ad){const [di,ai]=ad.dataset.absdel.split(":"),d=drv(di);d.absences=d.absences.filter(a=>a.id!==ai);save();render();toast("Įrašas panaikintas");return}
  const au=e.target.closest("[data-auto]");if(au){let n=0;S.subs.filter(x=>x.status==="pending").forEach(x=>{const b=bestDriverFor(x);if(b){x.driver=b;n++}});save();render();toast(n?`Pasiūlyti vairuotojai ${n} užsakymams. Patvirtinkite.`:"Laisvų vairuotojų nėra");return}
  const pc=e.target.closest("[data-pct]");if(pc){const d=drv(pc.dataset.pct),x=parseFloat($("#pct_"+d.id).value);if(!isNaN(x)){d.pct=x;save();render();toast(`${d.name}: ${x}%`)}return}
  const da=e.target.closest("[data-dactive]");if(da){const d=drv(da.dataset.dactive);d.active=!d.active;save();render();toast(d.active?"Vairuotojas įjungtas":"Vairuotojas išjungtas. Nauji užsakymai jam neskiriami.");return}
  const cf=e.target.closest("[data-cfilter]");if(cf){contractFilter=cf.dataset.cfilter;render();return}
  const en=e.target.closest("[data-end]");if(en){if(en.dataset.sure!=="1"){en.dataset.sure="1";en.textContent="Tikrai nutraukti?";return}
    const s=S.subs.find(x=>x.id===en.dataset.end);if(s){s.status="ended";s.end=isoAdd(0);s.endReason="Nutraukta";const now=new Date();S.trips.forEach(t=>{if(t.series===s.id&&new Date(t.at)>now&&ACTIVE.includes(t.status))t.status="cancelled"});save();render();toast("Sutartis nutraukta. Tėvams išsiųstas pranešimas.")}return}
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const vb=e.target.closest("[data-visit]");if(vb){const x=S.visits.find(y=>y.id===vb.dataset.id);if(x){x.status=vb.dataset.visit;save();render();toast(x.status==="confirmed"?`Patvirtinta. ${x.name} ir ${drvName(x.driver)} gaus pranešimą.`:x.status==="done"?"Pažymėta, kad pokalbis įvyko":"Pokalbis atšauktas, klientui pranešta")}return}
  const fl=e.target.closest("[data-filter]");if(fl){tripFilter=fl.dataset.filter;render();return}
  const go=e.target.closest("[data-go]");if(go){e.preventDefault();tab=go.dataset.go;render();return}
  const mv=e.target.closest("[data-move]");if(mv){moving=mv.dataset.move;render();return}
  if(e.target.closest("[data-move-cancel]")){moving=null;render();return}
  const ms=e.target.closest("[data-move-save]");if(ms){const t=S.trips.find(x=>x.id===ms.dataset.moveSave),v=$("#mv_"+ms.dataset.moveSave).value;const d=new Date(v);
    if(t&&!isNaN(d)){const prob=slotProblem(d,t.min,t.id,t.driver);t.at=d.toISOString();moving=null;save();render();toast(prob?"Perkelta, bet: "+prob:"Kelionė perkelta. Tėvams išsiųstas pranešimas.")}return}
  const a=e.target.closest("[data-act]");
  if(a){const t=S.trips.find(x=>x.id===a.dataset.id);if(!t)return;
    if(a.dataset.act==="cancelled"&&a.dataset.sure!=="1"){a.dataset.sure="1";a.textContent="Tikrai atšaukti?";a.classList.add("bad");return}
    t.status=a.dataset.act;save();render();
    toast({confirmed:"Patvirtinta. Tėvams išsiųstas pranešimas.",rejected:"Atmesta. Tėvams išsiųstas pranešimas.",picked_up:"Tėvams pranešta, kad vaikas paimtas.",delivered:"Tėvams pranešta, kad vaikas nuvežtas.",cancelled:"Kelionė atšaukta. Tėvams išsiųstas pranešimas.",no_show:"Pažymėta, kad vaikas neatvyko."}[t.status])}
});
$("#roleSel").addEventListener("change",e=>{role=e.target.value;tab=null;save();render()});
$("#resetBtn").addEventListener("click",e=>{const b=e.currentTarget;if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tikrai atkurti?";return}
  b.dataset.sure="";b.textContent="Atkurti pavyzdžius";S=seed();save();render();toast("Pavyzdžiai atkurti")});
{const todo=S.subs.filter(s=>!s.monthly),st=todo.map(s=>s.status);todo.forEach(s=>s.status="x");
 todo.forEach((s,i)=>{const q=subQuote({...s,extra:0,months:1},s.id,s.driver);s.monthly=q.monthly;s.perTrip=q.perTrip;s.months=s.seedMonths||1;if(s.start&&s.months>1)s.end=addMonthsIso(s.start,s.months);s.status=st[i]});}
syncSubTrips();save();
render();
})();
</script>
