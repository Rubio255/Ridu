// Lietuvos valstybinės šventės (fiksuotos) + Velykos ir antroji Velykų diena
const FIXED_HOLIDAYS=["01-01","02-16","03-11","05-01","06-24","07-06","08-15","11-01","11-02","12-24","12-25","12-26"];
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
function dayType(d){d=new Date(d);const md=String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const e=easter(d.getFullYear()),e2=new Date(e);e2.setDate(e.getDate()+1);
  if(FIXED_HOLIDAYS.includes(md)||[e,e2].some(x=>x.toDateString()===d.toDateString()))return "holiday";

function tripsPerMonth(wds){return Math.round(wds.length*4.33)}
function pkgPctP(p,n){return n>=p.pkg2_from?p.pkg2_pct:n>=p.pkg1_from?p.pkg1_pct:0}
function mapsUrl(a,b){return `https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=driving`}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function km(a,b){const R=6371,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return Math.max(1,Math.round(2*R*Math.asin(Math.sqrt(h))*1.35*10)/10)}
function minutes(k){return Math.max(5,Math.round(k/22*60))}
const r2 = n=>Math.round(n*100)/100;
const eur = n=>n.toLocaleString("lt-LT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
function isPeak(iso){const d=new Date(iso),h=d.getHours()+d.getMinutes()/60,wd=d.getDay();return wd>=1&&wd<=5&&((h>=7&&h<9)||(h>=15&&h<18))}

function handoverMin(p,kind){return kind?0:0}
function quote(p,{k,wait=0,extra=0,peak=false,handover=0,day="workday"}){
  const lines=[[`Kelionė iki ${p.included_km} km, palyda iki durų, ${p.included_wait_min} min laukimo`,p.base_fee]];
  const overKm=Math.max(0,r2(k-p.included_km)); if(overKm>0) lines.push([`Papildomi ${overKm.toFixed(1)} km × ${eur(p.per_km)}`,r2(overKm*p.per_km)]);
  const pw=Math.max(0,wait-p.included_wait_min); if(pw>0) lines.push([`Laukimas virš ${p.included_wait_min} min: ${pw} min`,r2(pw*p.per_wait_min)]);
  if(extra>0) lines.push([`Brolis ar sesuo toje pačioje kelionėje (${extra})`,r2(extra*p.extra_child_fee)]);
  let s=lines.reduce((a,l)=>a+l[1],0);
  const sp=day==="holiday"?p.holiday_pct:day==="weekend"?p.weekend_pct:0;
  if(sp>0&&p.surcharge_approved){const x=r2(s*sp/100);lines.push([`${day==="holiday"?"Šventinė diena":"Savaitgalis"} +${sp}%`,x]);s+=x}
  else if(peak&&day==="workday"&&p.peak_pct>0){const x=r2(s*p.peak_pct/100);lines.push([`Piko valandos +${p.peak_pct}%`,x]);s+=x}
  if(s<p.min_price){lines.push(["Iki minimalios kainos",r2(p.min_price-s)]);s=p.min_price}
  return {total:r2(s),lines};
}

function addTrip(st,t){
  const f=st.places.find(p=>p.id===t.from), to=st.places.find(p=>p.id===t.to);
  const k=km(f,to), ho=st.pricing.handover_min;
  const q=quote(st.pricing,{k,wait:t.wait,extra:t.extra,peak:isPeak(t.at),handover:ho,day:dayType(t.at)});
  st.trips.push({id:"t"+(st.seq++),...t,km:k,drive:minutes(k),handover:ho,min:minutes(k)+ho+(t.wait||0),price:q.total,fromLabel:f.label,toLabel:to.label});
}
// Darbo laikas dienai: kelionė su vaiku + palyda + laukimas + tuščias privažiavimas (~tiek pat kiek kelionė)
function tripWork(t){return (t.min||0)+S.pricing.deadhead_min+S.pricing.gap_min}
const ACTIVE=["requested","confirmed","picked_up","delivered"];
function dayTrips(date){const d0=startOfDay(date).getTime();return S.trips.filter(t=>ACTIVE.includes(t.status)&&startOfDay(new Date(t.at)).getTime()===d0)}
function dayLoad(date,extraMin=0){const ts=dayTrips(date);
  return ts.reduce((a,t)=>a+tripWork(t),0)+extraMin+((ts.length||extraMin)?S.pricing.break_min:0)}
// Ar naujai kelionei [start, start+min] užtenka laiko: pertrauka ir tarpas tarp kelionių
function slotProblem(start,min,ignoreId){
  const p=S.pricing, s=start.getTime(), e=s+min*6e4;
  const b0=new Date(start);b0.setHours(0,0,0,0);b0.setMinutes(p.break_start_h*60);const bs=b0.getTime(),be=bs+p.break_min*6e4;
  if(s<be&&bs<e) return `Šiuo metu vairuotojo pertrauka (${fmtTime(new Date(bs))}–${fmtTime(new Date(be))}).`;
  const gap=p.gap_min*6e4, pre=minutes(5)*6e4; // privažiavimas iki paėmimo
  const clash=dayTrips(start).find(t=>t.id!==ignoreId&&(()=>{const os=new Date(t.at).getTime(),oe=os+t.min*6e4;return s-pre<oe+gap&&os<e+gap})());
  if(clash) return `Šis laikas užimtas (kita kelionė ${fmtTime(new Date(clash.at))}). Tarp kelionių reikia bent ${p.gap_min} min.`;
  return "";
}
const hm=m=>`${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,"0")} min`;
function loadBar(used){const lim=S.pricing.day_limit_h*60,pct=Math.min(100,used/lim*100);
  return `<div class="spread small"><span>Darbo laikas ${hm(used)} iš ${hm(lim)}</span>${used>lim?'<span class="pill s-rejected">Viršyta</span>':""}</div><div class="bar"><i style="width:${pct}%;${used>lim?"background:var(--bad)":""}"></i></div>`}

function tripRow(t,{owner=false,conflict=false}={}){
  const d=new Date(t.at), c=child(t.child);
  const by=users[t.by]?.name||t.by, payer=users[t.payer]?.name||t.payer;
  let actions="";
  if(owner){
    if(t.status==="requested") actions=`<button class="btn ok" data-act="confirmed" data-id="${t.id}">Patvirtinti</button><button class="btn bad" data-act="rejected" data-id="${t.id}">Atmesti</button>`;
    else if(t.status==="confirmed") actions=`<button class="btn primary" data-act="picked_up" data-id="${t.id}">Vaikas paimtas</button><button class="btn" data-act="no_show" data-id="${t.id}">Neatvyko</button>`;
    else if(t.status==="picked_up") actions=`<button class="btn ok" data-act="delivered" data-id="${t.id}">Nuvežtas</button>`;
    if(["requested","confirmed"].includes(t.status)){
      if(moving===t.id) actions=`<label class="small" for="mv_${t.id}">Naujas laikas</label><input type="datetime-local" id="mv_${t.id}" value="${toLocalInput(t.at)}" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)"><button class="btn primary" data-move-save="${t.id}">Išsaugoti</button><button class="btn" data-move-cancel="1">Atšaukti keitimą</button>`;
      else actions+=`<button class="btn" data-move="${t.id}">Perkelti</button><button class="btn bad" data-act="cancelled" data-id="${t.id}">Atšaukti kelionę</button>`;
    }
  } else if((t.status==="requested"||t.status==="confirmed")&&d>new Date()){
    const fee=cancelFeePct(t);
    actions=`<button class="btn" data-act="cancelled" data-id="${t.id}">Atšaukti${fee?` (mokestis ${fee}%)`:""}</button>`;
  }
  return `<div class="trip">
    <div class="time">${fmtTime(d)}${owner?`<small>${t.min} min</small>`:""}</div>
    <div class="body">
      <div class="spread"><span class="row"><b>${esc(c.name)}</b><span class="pill s-${t.status}">${STATUS[t.status]}</span><span class="tag">${t.long?"Ilgalaikis":"Vienos dienos"}</span></span><span class="price">${eur(t.price)}</span></div>
      <div class="route">${esc(t.fromLabel)} <span class="arrow">→</span> ${esc(t.toLabel)}</div>
      <div class="small muted">${owner?`${t.km.toFixed(1)} km${t.handover?` · palyda ${t.handover} min`:""} · `:""}užsakė ${esc(by)} · moka ${esc(payer)}${owner&&t.wait?` · laukimas ${t.wait} min`:""}${t.extra?` · +${t.extra} vaik.`:""}</div>
      ${t.note?`<div class="small">Pastaba: ${esc(t.note)}</div>`:""}
      ${conflict?`<div class="warnbox">${esc(slotProblem(new Date(t.at),t.min,t.id))}</div>`:""}
      ${owner?`<a class="small" href="${mapsUrl(S.places.find(p=>p.id===t.from)||{},S.places.find(p=>p.id===t.to)||{})}" target="_blank" rel="noopener">Maršrutas Google Maps</a>`:""}
      ${actions?`<div class="row">${actions}</div>`:""}
    </div></div>`;
}

function filterBar(){const o=[["all","Visos"],["long","Ilgalaikiai"],["single","Vienos dienos"]];
  return `<div class="row" role="group" aria-label="Rodyti">${o.map(([k,l])=>`<button type="button" class="btn ${tripFilter===k?"primary":""}" data-filter="${k}">${l}</button>`).join("")}</div>`}
const byFilter=t=>!S.pricing.single_enabled&&!isOwner()||tripFilter==="all"||(tripFilter==="long")===!!t.long;
function groupByDay(list,opts){list=list.filter(byFilter);
  const g={};list.forEach(t=>{const k=startOfDay(new Date(t.at)).toISOString();(g[k]=g[k]||[]).push(t)});
  return Object.keys(g).sort().map(k=>{const dt=dayType(k);return `<div class="daygroup card"><h3>${fmtDay(new Date(k))}${dt!=="workday"?` <span class="tag">${dt==="holiday"?"šventinė diena":"savaitgalis"}</span>`:""}</h3>${opts.owner?loadBar(dayLoad(new Date(k))):""}<div>${g[k].sort((a,b)=>a.at<b.at?-1:1).map(t=>tripRow(t,{...opts,conflict:opts.owner&&hasConflict(t)})).join("")}</div></div>`}).join("");
}
function cancelFeePct(t){const h=(new Date(t.at)-new Date())/36e5,p=S.pricing;
  return h<p.very_late_hours?p.very_late_pct:h<p.cancel_hours?p.late_cancel_pct:0}
// Mėnesio paketo nuolaida pagal kliento (mokėtojo) kelionių skaičių
function pkgPct(n){const p=S.pricing;return n>=p.pkg2_from?p.pkg2_pct:n>=p.pkg1_from?p.pkg1_pct:0}
function hasConflict(t){
  if(!["requested","confirmed"].includes(t.status))return false;
  return !!slotProblem(new Date(t.at),t.min,t.id);
}

}

  };

  $("#bookForm").addEventListener("submit",e=>{
    e.preventDefault();
    const from=$("#bFrom").value,to=$("#bTo").value;
    if(from===to){toast("Paėmimo ir nuvežimo vietos turi skirtis");return}
    if($("#quoteBox").dataset.full==="1"){toast("Šis laikas negalimas. Pasirinkite kitą.");return}
    const base={child:$("#bChild").value,from,to,by:role,payer:role,status:"requested",wait:+$("#bWait").value||0,extra:+$("#bExtra").value||0,note:$("#bNote").value.trim()};
    const wds=[...document.querySelectorAll('input[name=wd]:checked')].map(x=>+x.value);
    const first=new Date($("#bDate").value+"T"+$("#bTime").value);
    if(isNaN(first)){toast("Įveskite datą ir laiką");return}
    let n=0;
    if(!wds.length){addTrip(S,{...base,at:first.toISOString()});n=1}
    else{const sid="s"+Date.now();for(let i=0;i<28;i++){const d=new Date(first);d.setDate(d.getDate()+i);const wd=d.getDay()||7;if(wds.includes(wd)){addTrip(S,{...base,series:sid,at:d.toISOString()});n++}}}

  });
}

function vDay(v){

function monthTrips(){const n=new Date(),m=n.getMonth(),y=n.getFullYear();
  return S.trips.filter(t=>{const d=new Date(t.at);return d.getMonth()===m&&d.getFullYear()===y})}
function billable(t){return ["confirmed","picked_up","delivered"].includes(t.status)}

function vIncome(v){
  const p=S.pricing, mt=monthTrips().filter(t=>billable(t)&&!t.long);
  const gross=Object.keys(users).reduce((a,u)=>{const ts=mt.filter(t=>t.payer===u),s=ts.reduce((x,t)=>x+t.price,0);return a+s*(1-pkgPct(ts.length)/100)},0);
  const actSubs=S.subs.filter(x=>x.status==="active"), subRev=actSubs.reduce((a,x)=>a+x.monthly,0);
  const subKm=actSubs.reduce((a,x)=>a+Math.round(x.weekdays.length*52/12)*(km(S.places.find(q=>q.id===x.from),S.places.find(q=>q.id===x.to))+p.empty_km),0);
  const gross2=gross+subRev, vat=gross2-gross2/(1+p.vat_pct/100), rev=gross2-vat, kms=mt.reduce((a,t)=>a+t.km,0)*(1+DEADHEAD)+subKm;
  const fuel=kms*FUEL_L_100/100*FUEL_PRICE, fixed=p.cost_insurance+p.cost_wash+p.cost_service;
  const profit=rev-fuel-fixed, tax=Math.max(0,profit*p.tax_pct/100), left=profit-tax, pct=Math.min(100,left/p.target*100);
  const groups=[
    ["Kelionės kaina su PVM",[["base_fee","Bazinė kaina vienam vaikui, €"],["included_km","Įskaičiuota km"],["per_km","Kiekvienas papildomas km, €"],["included_wait_min","Įskaičiuotas laukimas, min"],["per_wait_min","Papildoma laukimo minutė, €"],["extra_child_fee","Brolis ar sesuo toje pačioje kelionėje, €"]]],

    ["Savaitgaliai ir šventės",[["weekend_pct","Savaitgalio priemoka, %"],["holiday_pct","Švenčių dienų priemoka, %"]]],
    ["Abonementų kaina",[["minute_rate","Automobilio minutė, €"],["km_rate","Kilometras, €"],["empty_km","Tušti km iki paėmimo"],["share2","Vaiko dalis, kai vežami 2, %"],["share3","Vaiko dalis, kai vežami 3, %"],["share4","Vaiko dalis, kai vežami 4, %"],["commit3_pct","Nuolaida įsipareigojus 3 mėn., %"],["commit9_pct","Nuolaida įsipareigojus 9 mėn., %"]]],
    ["Paklausa ir aukcionas",[["occ_m1","Koeficientas, kai valanda užimta iki 50%"],["occ_m2","50–80%"],["occ_m3","80–95%"],["occ_m4","Virš 95% (aukciono minimumas)"],["bid_step_pct","Mažiausias pasiūlymo žingsnis, %"],["bid_close_day","Pasiūlymai baigiasi mėnesio dieną"]]],
    ["Grafikas ir atšaukimas",[["day_limit_h","Darbo laikas per dieną, val."],["morning_start_h","Rytinio maršruto pradžia, val. (7.25 = 07:15)"],["morning_end_h","Rytinio maršruto pabaiga, val."],["morning_deliver_h","Visi nuvežti iki, val."],["morning_max_kids","Vaikų rytiniame maršrute"],["afternoon_start_h","Popietės pradžia, val."],["afternoon_end_h","Popietės pabaiga, val."],["afternoon_max_trips","Kelionių po pietų"],["cancel_hours","Vėlyvas atšaukimas, likus mažiau nei val."],["late_cancel_pct","Vėlyvo atšaukimo mokestis, %"],["very_late_hours","Labai vėlyvas, likus mažiau nei val."],["very_late_pct","Labai vėlyvo ar neatvykus mokestis, %"]]],
    ["Pastovios išlaidos per mėnesį ir tikslas",[["cost_insurance","Draudimas, €"],["cost_wash","Plovimas, €"],["cost_service","Priežiūra, €"],["vat_pct","PVM, %"],["tax_pct","Mokesčiai MB, % nuo pelno"],["target","Tikslas į rankas, €"]]]
  ];

    <div class="stat"><span class="small muted">Pastovios išlaidos</span><b>${eur(fixed)}</b></div>

    <span class="small muted">Naujos kainos taikomos naujiems užsakymams. Jau pateiktų kaina nesikeičia.</span></form></div>`;
  $("#priceForm").addEventListener("submit",e=>{e.preventDefault();fields.forEach(([k])=>{const x=parseFloat($("#pr_"+k).value);if(!isNaN(x))p[k]=x});p.surcharge_approved=$("#pr_approved").checked;p.single_enabled=$("#pr_single").checked;save();render();toast("Nustatymai išsaugoti")});
}

function initPrices(P){
  var MIN_RATE=P.minute_rate, KM_RATE=P.km_rate, HANDOVER=P.handover_min, DEADHEAD=P.deadhead_min, BREAK_MIN=P.gap_min, EMPTY_KM=P.empty_km;
  var WEEKEND=P.weekend_pct/100, BASE=P.base_fee, INCL_KM=8, EXTRA_KM=1.2, MIN_PER_KM=2.75;
  var SHARE={1:1,2:P.share2/100,3:P.share3/100,4:P.share4/100};
  function eur(v,dec){return v.toLocaleString('lt-LT',{minimumFractionDigits:dec,maximumFractionDigits:dec})+' €';}
  function num(id,def){var v=parseFloat(document.getElementById(id).value);return isFinite(v)&&v>0?v:def;}
  function calc(){
    var km=num('km',8), kids=parseInt(document.getElementById('kids').value,10)||1, tpw=num('tpw',1);
    var mult=parseFloat(document.getElementById('slot').value), disc=parseFloat(document.getElementById('term').value);
    var wk=document.getElementById('wk').checked;
    var drive=Math.round(km*MIN_PER_KM);
    var car=(MIN_RATE*(drive+HANDOVER+DEADHEAD+BREAK_MIN)+KM_RATE*(km+EMPTY_KM))*(wk?1+WEEKEND:1);
    var child=car*SHARE[Math.min(kids,4)];
    var trip=child*mult*(1-disc);
    var n=tpw*52/12;
    var single=(BASE+Math.max(0,km-INCL_KM)*EXTRA_KM)*(wk?1+WEEKEND:1);
    var sub=Math.round(trip*n);
    document.getElementById('out-trip').textContent=eur(trip,2);
    var extra=parseFloat(document.getElementById('extra').value)||0;
    var carkm=parseFloat(document.getElementById('carkm').value)||0;
    var park=parseFloat(document.getElementById('park').value)||0;
    var wage=parseFloat(document.getElementById('wage').value)||0;
    var hour=wage/168*parseFloat(document.getElementById('method').value);
    var waitMin=parseFloat(document.getElementById('wait').value)||0;
    var hours=((km+extra)*MIN_PER_KM+15+waitMin)*n/60;
    var cCar=(km+extra)*n*carkm, cPark=park*n, cTime=hours*hour, total=Math.round(cCar+cPark+cTime);
    var hrs=hours.toLocaleString('lt-LT',{maximumFractionDigits:1});
    document.getElementById('a-sub').textContent=eur(sub,0);
    document.getElementById('a-self').textContent=eur(total,0);
    document.getElementById('a-hours').textContent=hrs+' val.';
    var mx=Math.max(sub,total,1);
    document.getElementById('b-sub').style.width=(sub/mx*100)+'%';
    document.getElementById('b-self').style.width=(total/mx*100)+'%';
    document.getElementById('self-car').textContent=eur(Math.round(cCar),0);
    document.getElementById('self-park').textContent=eur(Math.round(cPark),0);
    document.getElementById('self-time').textContent=eur(Math.round(cTime),0)+' ('+hrs+' val.)';
    function set(id,t){document.getElementById(id).textContent=t;}
    function h(v){return v.toLocaleString('lt-LT',{maximumFractionDigits:1})+' val.';}
    function k(v){return Math.round(v).toLocaleString('lt-LT')+' km';}
    var kmM=(km+extra)*n, saved=cCar+cPark+cTime;
    [[1,'1'],[9,'9']].forEach(function(m){var f=m[0],x=m[1];
      set('g-h'+x,h(hours*f)); set('g-k'+x,k(kmM*f)); set('g-c'+x,eur(Math.round(cCar*f),0));
      set('g-p'+x,eur(Math.round(cPark*f),0)); set('g-t'+x,eur(Math.round(cTime*f),0));
      set('g-s'+x,eur(Math.round(saved*f),0)); set('g-a'+x,eur(sub*f,0));
      var r=Math.round(saved*f-sub*f); set('g-r'+x,(r>=0?'+':'−')+eur(Math.abs(r),0));});
    var res=document.querySelector('.gain-t tr.res');
    if(saved>=sub){res.classList.add('plus');set('g-rl','Jūs sutaupote');}else{res.classList.remove('plus');set('g-rl','Jūs primokate');}
    var diff=sub-total, v=document.getElementById('verdict');
    if(diff<=0){
      v.classList.remove('warn');
      document.getElementById('v-badge').textContent='Apsimoka';
      document.getElementById('v-text').textContent='Abonementas pigesnis '+eur(-diff,0)+' per mėnesį, ir dar atgaunate '+hrs+' val. laiko.';
    } else {
      v.classList.add('warn');
      document.getElementById('v-badge').textContent='+'+eur(diff,0)+' /mėn.';
      document.getElementById('v-text').textContent='Tiek daugiau kainuoja abonementas, bet atgaunate '+hrs+' val. per mėnesį: tai '+eur(diff/hours,2)+' už kiekvieną valandą be vairavimo.';
    }
  }
  ['km','kids','tpw','slot','term','wk','extra','carkm','park','wage','method','wait'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',calc);el.addEventListener('change',calc);});
  calc();
}

/* ---------- Abonementai ---------- */
const SUB_ON=["active","pending"];
// Automobilio minutės, kurias užima viena abonemento kelionė
function carMin(k){const p=S.pricing;return minutes(k)+p.handover_min+p.deadhead_min+p.gap_min}
function subCarMin(s){const f=S.places.find(x=>x.id===s.from),t=S.places.find(x=>x.id===s.to);return carMin(km(f,t))}
// Užimtumas: parduotos automobilio minutės savaitės dienos valandos lange / 60 min
function winOcc(wd,hour,ignore){return S.subs.filter(s=>s.id!==ignore&&SUB_ON.includes(s.status)&&s.weekdays.includes(wd)&&+s.time.slice(0,2)===hour).reduce((a,s)=>a+subCarMin(s),0)/60}
function occMult(o){const p=S.pricing;return o>=0.95?p.occ_m4:o>=0.8?p.occ_m3:o>=0.5?p.occ_m2:p.occ_m1}
function capacityMonth(){return 0}
function subscribedMonth(){return 0}
const hToMin=h=>Math.round(h*60), tToMin=t=>{const [a,b]=t.split(":");return +a*60+ +b};
const hmT=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function isMorning(time){const p=S.pricing,m=tToMin(time);return m>=hToMin(p.morning_start_h)&&m<hToMin(p.morning_end_h)}
function inAfternoon(time){const p=S.pricing,m=tToMin(time);return m>=hToMin(p.afternoon_start_h)&&m<hToMin(p.afternoon_end_h)}
function windowsText(){const p=S.pricing;return `rytais ${hmT(hToMin(p.morning_start_h))}–${hmT(hToMin(p.morning_end_h))} ir po pietų ${hmT(hToMin(p.afternoon_start_h))}–${hmT(hToMin(p.afternoon_end_h))}`}
function morningKids(wd,ignore){return S.subs.filter(s=>s.id!==ignore&&SUB_ON.includes(s.status)&&s.weekdays.includes(wd)&&isMorning(s.time)).reduce((a,s)=>a+1+(s.extra||0),0)}
function afternoonTrips(wd,ignore){return S.subs.filter(s=>s.id!==ignore&&SUB_ON.includes(s.status)&&s.weekdays.includes(wd)&&inAfternoon(s.time)).length}
function subQuote({from,to,weekdays,time,extra=0,months=1}){
  const p=S.pricing, f=S.places.find(x=>x.id===from), t=S.places.find(x=>x.id===to);
  if(!f||!t||f.id===t.id||!weekdays.length) return null;
  const k=km(f,t), cm=carMin(k), hour=+time.slice(0,2), kids=Math.min(4,1+extra);
  const carTrip=p.minute_rate*cm+p.km_rate*(k+p.empty_km);
  const share=kids===1?1:p["share"+kids]/100, childTrip=carTrip*share;
  const morning=isMorning(time), outside=!morning&&!inAfternoon(time);
  let occ,full;
  if(morning){occ=Math.max(...weekdays.map(w=>morningKids(w)))/p.morning_max_kids;full=Math.max(...weekdays.map(w=>morningKids(w)+kids))>p.morning_max_kids}
  else{occ=Math.max(...weekdays.map(w=>winOcc(w,hour)));const occAfter=Math.max(...weekdays.map(w=>winOcc(w,hour)+cm/60));
    full=occ>0.95||occAfter>1||Math.max(...weekdays.map(w=>afternoonTrips(w)))>=p.afternoon_max_trips}
  const mult=full?p.occ_m4:occMult(occ);
  const commit=months>=9?p.commit9_pct:months>=3?p.commit3_pct:0;
  const perWeek=weekdays.length, n=Math.round(perWeek*52/12);
  const perChild=Math.round(childTrip*mult*(1-commit/100)*perWeek*52/12);
  return {k,cm,carTrip,childTrip,kids,share,occ,mult,commit,n,perWeek,perChild,monthly:perChild*kids,perTrip:r2(perChild/(perWeek*52/12)),full,morning,outside,f,t};
}

// Patvirtinti ilgalaikiai užsakymai automatiškai sukuria keliones 14 dienų į priekį
function syncSubTrips(){
  const today=startOfDay(new Date());
  S.subs.filter(x=>x.status==="active").forEach(sb=>{
    for(let i=0;i<14;i++){const d=new Date(today);d.setDate(d.getDate()+i);const wd=d.getDay()||7;if(!sb.weekdays.includes(wd))continue;
      const [h,m]=sb.time.split(":");d.setHours(+h,+m,0,0);
      if(d<new Date())continue;
      if(S.trips.some(t=>(t.series===sb.id&&startOfDay(new Date(t.at)).getTime()===startOfDay(d).getTime())||(t.child===sb.child&&new Date(t.at).getTime()===d.getTime()&&ACTIVE.includes(t.status))))continue;
      addTrip(S,{child:sb.child,from:sb.from,to:sb.to,at:d.toISOString(),by:sb.payer,payer:sb.payer,status:"confirmed",wait:0,extra:sb.extra||0,note:"",series:sb.id,long:true});
      S.trips[S.trips.length-1].price=sb.perTrip;}
  });
}

  <div class="card"><h2>Mano ilgalaikiai užsakymai</h2>${mine.map(s=>`<div class="child"><div class="spread"><b>${esc(child(s.child).name)} · ${s.weekdays.map(w=>DAYS[w-1]).join(", ")} ${s.time}</b><span class="pill s-${s.status==="active"?"confirmed":s.status==="pending"?"requested":"rejected"}">${SS[s.status]}</span></div>
    <div class="small muted">${esc(S.places.find(p=>p.id===s.from).label)} → ${esc(S.places.find(p=>p.id===s.to).label)}</div>
    <div class="small">${eur(s.monthly)} / mėn.${s.months>1?` · ${s.months} mėn.`:""}${s.bid?" · jūsų pasiūlymas":""}</div></div>`).join("")||'<div class="empty">Ilgalaikių užsakymų dar nėra.</div>'}
    <p class="small muted" style="margin:0">Galiojantys užsakymai pratęsiami ta pačia kaina.</p></div></div>`;
  if(pl.length>4){$("#sFrom").selectedIndex=3;$("#sTo").selectedIndex=4}else if(pl.length>1){$("#sFrom").selectedIndex=pl.length-2;$("#sTo").selectedIndex=pl.length-1}
  const read=()=>({child:$("#sChild").value,from:$("#sFrom").value,to:$("#sTo").value,time:$("#sPeriod").value==="am"?hmT(hToMin(P.morning_start_h)):($("#sTime").value||"14:00"),extra:+$("#sExtra").value||0,months:+$("#sMonths").value,weekdays:[...document.querySelectorAll('input[name=swd]:checked')].map(x=>+x.value)});
  const upd=()=>{$("#sTimeField").hidden=$("#sPeriod").value==="am";const q=subQuote(read()),box=$("#subQuote");
    if(!q){box.innerHTML=`<p class="muted">Pasirinkite skirtingas vietas ir bent vieną dieną.</p>`;return}
    if(q.outside){box.innerHTML=`<div class="warnbox">Vairuotojas dirba ${windowsText()}. Pasirinkite laiką šiame intervale.</div>`;return}
    const minBid=q.monthly, occTxt=Math.round(q.occ*100);
    box.innerHTML=`<div class="quote">
      <div class="line"><span>${q.perWeek} k./sav., apie ${q.n} kelionės per mėnesį</span><span>${eur(q.perTrip)} / kel.</span></div>
      <div class="line total"><span>Per mėnesį${q.kids>1?` (${q.kids} vaikai)`:""}</span><span class="price">${eur(q.monthly)}</span></div></div>
      <a class="small" href="${mapsUrl(q.f,q.t)}" target="_blank" rel="noopener">Žiūrėti maršrutą Google Maps</a>
      ${q.morning?`<p class="small muted" style="margin:0">Rytinis maršrutas bendras keliems vaikams. Tikslų paėmimo laiką nurodys vairuotojas.</p>`:""}
      ${q.full?`<div class="warnbox">${q.morning?"Rytinis maršrutas šiomis dienomis pilnas.":"Šis laikas užimtas."} Galite pateikti pasiūlymą kitam mėnesiui iki ${P.bid_close_day} d., ir vairuotojas su jumis susisieks.</div>
        <div class="field"><label for="sBid">Jūsų mėnesio kaina, € (ne mažiau ${eur(minBid)})</label><input type="number" id="sBid" step="1" min="${minBid}" value="${minBid}"></div>
        <button class="btn primary" type="submit">Pateikti pasiūlymą</button>`
      :`<button class="btn primary" type="submit">Užsakyti už ${eur(q.monthly)} / mėn.</button>`}
      <span class="small muted">Kaina nesikeičia visą įsipareigojimo laikotarpį.</span>`;
  };
  $("#subForm").addEventListener("input",e=>{if(e.target.id!=="sBid")upd()});upd();
  $("#subForm").addEventListener("submit",e=>{e.preventDefault();const r=read(),q=subQuote(r);if(!q||q.outside)return;
    let bid=null,monthly=q.monthly;
    if(q.full){bid=+$("#sBid").value;if(!(bid>=q.monthly)){toast(`Pasiūlymas turi būti bent ${eur(q.monthly)}`);return}monthly=bid}
    S.subs.push({id:"a"+Date.now(),payer:role,...r,status:"pending",perTrip:r2(monthly/q.kids/(q.perWeek*52/12)),monthly,bid});
    save();render();toast(bid?"Pasiūlymas pateiktas":"Abonementas pateiktas. Laukia patvirtinimo.")});
}

function vSubsOwner(v){
  const p=S.pricing;
  const act=S.subs.filter(s=>s.status==="active"), pend=S.subs.filter(s=>s.status==="pending").sort((a,b)=>(b.bid?1:0)-(a.bid?1:0)||b.monthly-a.monthly);
  const hours=[13,14,15,16,17,18];
  const subRow=s=>`<div class="child"><div class="spread"><b>${esc(users[s.payer].name)} · ${esc(child(s.child).name)} · ${s.weekdays.map(w=>DAYS[w-1]).join(", ")} ${s.time}</b><span class="price">${eur(s.monthly)}/mėn.</span></div>
    <div class="small muted">${esc(S.places.find(x=>x.id===s.from).label)} → ${esc(S.places.find(x=>x.id===s.to).label)}${s.months>1?` · ${s.months} mėn.`:""}${s.bid?" · <b>aukciono pasiūlymas</b>":""}</div>
    ${s.status==="pending"?`<div class="row"><button class="btn ok" data-sub="active" data-id="${s.id}">Patvirtinti</button><button class="btn bad" data-sub="rejected" data-id="${s.id}">Atmesti</button></div>`:""}</div>`;
  v.innerHTML=`<div class="stats">
    <div class="stat"><span class="small muted">Galiojantys abonementai</span><b>${act.length}</b></div>
    <div class="stat"><span class="small muted">Abonementų pajamos / mėn.</span><b>${eur(act.reduce((a,s)=>a+s.monthly,0))}</b></div>
    <div class="stat"><span class="small muted">Klientų su abonementu</span><b>${new Set(act.map(s=>s.payer)).size}</b></div>
    <div class="stat"><span class="small muted">Aukcionas baigiasi</span><b>${p.bid_close_day} d.</b></div></div>
  <div class="grid2"><div class="card"><h2>Laukia sprendimo</h2><p class="small muted" style="margin:0">Aukciono pasiūlymai viršuje, surikiuoti nuo didžiausio.</p>${pend.map(subRow).join("")||'<div class="empty">Naujų prašymų nėra.</div>'}</div>
  <div class="card"><h2>Užimtumas pagal valandas</h2><div class="scroll"><table><thead><tr><th>Val.</th>${DAYS.slice(0,5).map(d=>`<th class="num">${d}</th>`).join("")}</tr></thead>
  <tbody><tr><td>Rytas, vaikai</td>${[1,2,3,4,5].map(w=>{const n=morningKids(w);return `<td class="num"><span class="pill ${n>=p.morning_max_kids?"s-rejected":n?"s-requested":"s-delivered"}">${n}/${p.morning_max_kids}</span></td>`}).join("")}</tr>
  <tr><td>Popietė, kelionės</td>${[1,2,3,4,5].map(w=>{const n=afternoonTrips(w);return `<td class="num"><span class="pill ${n>=p.afternoon_max_trips?"s-rejected":n?"s-requested":"s-delivered"}">${n}/${p.afternoon_max_trips}</span></td>`}).join("")}</tr>
  ${hours.map(h=>`<tr><td>${String(h).padStart(2,"0")}:00</td>${[1,2,3,4,5].map(w=>{const o=winOcc(w,h);return `<td class="num"><span class="pill ${o>0.95?"s-rejected":o>=0.5?"s-requested":"s-delivered"}">${Math.round(o*100)}%</span></td>`}).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="small muted" style="margin:0">Užimta automobilio laiko dalis kiekvienoje valandoje. Virš 95% laikas parduodamas aukcionu.</p></div></div>
  <div class="card"><h2>Galiojantys</h2>${act.map(subRow).join("")||'<div class="empty">Dar nėra.</div>'}</div>`;
}

document.addEventListener("click",e=>{
  const sb=e.target.closest("[data-sub]");if(sb){const s=S.subs.find(x=>x.id===sb.dataset.id);if(s){s.status=sb.dataset.sub;if(s.status==="active")syncSubTrips();save();render();toast(s.status==="active"?"Abonementas patvirtintas":"Abonementas atmestas")}return}
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;render();return}
  const fl=e.target.closest("[data-filter]");if(fl){tripFilter=fl.dataset.filter;render();return}
  const go=e.target.closest("[data-go]");if(go){e.preventDefault();tab=go.dataset.go;render();return}
  const mv=e.target.closest("[data-move]");if(mv){moving=mv.dataset.move;render();return}
  if(e.target.closest("[data-move-cancel]")){moving=null;render();return}
  const ms=e.target.closest("[data-move-save]");if(ms){const t=S.trips.find(x=>x.id===ms.dataset.moveSave),v=$("#mv_"+ms.dataset.moveSave).value;const d=new Date(v);
    if(t&&!isNaN(d)){const prob=slotProblem(d,t.min,t.id);t.at=d.toISOString();moving=null;save();render();toast(prob?"Perkelta, bet: "+prob:"Kelionė perkelta. Tėvams išsiųstas pranešimas.")}return}
  const a=e.target.closest("[data-act]");
  if(a){const t=S.trips.find(x=>x.id===a.dataset.id);if(!t)return;
    if(a.dataset.act==="cancelled"&&a.dataset.sure!=="1"){a.dataset.sure="1";a.textContent="Tikrai atšaukti?";a.classList.add("bad");return}
    t.status=a.dataset.act;save();render();
    toast({confirmed:"Patvirtinta. Tėvams išsiųstas pranešimas.",rejected:"Atmesta. Tėvams išsiųstas pranešimas.",picked_up:"Tėvams pranešta, kad vaikas paimtas.",delivered:"Tėvams pranešta, kad vaikas nuvežtas.",cancelled:"Kelionė atšaukta. Tėvams išsiųstas pranešimas.",no_show:"Pažymėta, kad vaikas neatvyko."}[t.status])}
});
$("#roleSel").addEventListener("change",e=>{role=e.target.value;tab=null;save();render()});
$("#resetBtn").addEventListener("click",e=>{const b=e.currentTarget;if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tikrai atkurti?";return}
  b.dataset.sure="";b.textContent="Atkurti pavyzdžius";S=seed();save();render();toast("Pavyzdžiai atkurti")});
{const todo=S.subs.filter(s=>!s.monthly),st=todo.map(s=>s.status);todo.forEach(s=>s.status="x");
 todo.forEach((s,i)=>{const q=subQuote({...s,extra:0,months:1});s.monthly=q.monthly;s.perTrip=q.perTrip;s.months=1;s.status=st[i]});}
syncSubTrips();save();
render();
})();
</script>
