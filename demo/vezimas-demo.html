<title>Vaikų pavėžėjimas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell; sticky header with role switch, tab bar, one column of cards (two columns on desktop for owner) */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e8eeec; --fg:#14211f; --muted:#5b6b68; --line:#d5dedb;
  --brand:#0f4c45; --brand-fg:#ffffff; --accent:#f2b705; --accent-fg:#1e1a00;
  --ok:#1f7a4d; --ok-bg:#dcf2e6; --warn:#9a6300; --warn-bg:#fdf0cf; --bad:#b3261e; --bad-bg:#fbe1de; --info:#1d5b9a; --info-bg:#dde9f7;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --surface-2:#1f2d2b; --fg:#e6efed; --muted:#9db0ac; --line:#2c3d3a;
  --brand:#5fc2b4; --brand-fg:#062420; --accent:#f5c53a; --accent-fg:#1e1a00;
  --ok:#6fd49c; --ok-bg:#163526; --warn:#f0c062; --warn-bg:#3a2e10; --bad:#f2958c; --bad-bg:#3d1916; --info:#8dbcf0; --info-bg:#172a40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1f2d2b; --fg:#e6efed; --muted:#9db0ac; --line:#2c3d3a;
  --brand:#5fc2b4; --brand-fg:#062420; --accent:#f5c53a; --accent-fg:#1e1a00;
  --ok:#6fd49c; --ok-bg:#163526; --warn:#f0c062; --warn-bg:#3a2e10; --bad:#f2958c; --bad-bg:#3d1916; --info:#8dbcf0; --info-bg:#172a40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-fg)}
header .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px}
.logo{display:flex;gap:10px;align-items:center}
.logo .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.logo h1{font-size:1.1rem}
.logo small{display:block;opacity:.8;font-size:.75rem;font-family:var(--body)}
.role{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.role label{font-size:.75rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.role select{font:inherit;font-size:.9rem;padding:6px 8px;border-radius:8px;border:0;background:var(--brand-fg);color:var(--brand);max-width:100%}
.demo-note{background:var(--accent);color:var(--accent-fg);font-size:.82rem}
.demo-note .wrap{padding-block:6px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.demo-note button{font:inherit;font-size:.8rem;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px;cursor:pointer}
nav.tabs{border-bottom:1px solid var(--line);background:var(--surface)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
main .wrap{padding-block:20px 48px;display:grid;gap:16px}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:820px){.grid2{grid-template-columns:1.2fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.trip{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.trip:first-child{border-top:0;padding-top:0}
.trip .time{font-family:var(--display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.trip .time small{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--muted)}
.trip .body{min-width:0;display:grid;gap:4px}
.route{font-weight:600;overflow-wrap:anywhere}
.route .arrow{color:var(--muted);font-weight:400}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.s-requested{background:var(--warn-bg);color:var(--warn)}
.s-confirmed{background:var(--info-bg);color:var(--info)}
.s-picked_up{background:var(--accent);color:var(--accent-fg)}
.s-delivered{background:var(--ok-bg);color:var(--ok)}
.s-rejected,.s-cancelled{background:var(--bad-bg);color:var(--bad)}
.tag{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.price{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:.88rem;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn:focus-visible,select:focus-visible,input:focus-visible,nav.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
form{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;justify-content:center;width:42px;height:36px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;background:var(--bg)}
.days input{position:absolute;opacity:0;pointer-events:none}
.days input:checked+span{color:var(--brand-fg)}
.days label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.days label:has(input:focus-visible){outline:3px solid var(--accent)}
.quote{background:var(--surface-2);border-radius:10px;padding:12px;display:grid;gap:6px}
.quote .line{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-variant-numeric:tabular-nums}
.quote .total{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.quote .total .price{font-size:1.4rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:.82rem;font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.daygroup h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.child{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.child:first-of-type{border-top:0}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="logo"><div class="mark">V</div><div><h1>Vaikų pavėžėjimas</h1><small>Vilnius · pagal sutartį</small></div></div>
    <div class="role">
      <label for="roleSel">Žiūriu kaip</label>
      <select id="roleSel">
        <option value="rasa">Rasa (Ugnės ir Jono mama)</option>
        <option value="tomas">Tomas (Ugnės ir Jono tėtis)</option>
        <option value="egle">Eglė (Mato mama)</option>
        <option value="owner">Savininkas (vairuotojas)</option>
      </select>
    </div>
  </div>
</header>
<div class="demo-note"><div class="wrap"><span>Demo versija: duomenys pavyzdiniai ir saugomi tik šioje naršyklėje.</span><button type="button" id="resetBtn">Atkurti pavyzdžius</button></div></div>
<nav class="tabs" aria-label="Skiltys"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const FUEL_L_100 = 4.8, FUEL_PRICE = 1.8; // Corolla Touring 2.0 hibridas, miestas
const DEADHEAD = 1.0; // tušti km iki paėmimo vietos ~ tiek pat kiek kelionė
const DAYS = ["Pr","An","Tr","Kt","Pn","Še","Se"];
const STATUS = {requested:"Laukia patvirtinimo",confirmed:"Patvirtinta",picked_up:"Vaikas paimtas",delivered:"Nuvežta",rejected:"Atmesta",cancelled:"Atšaukta"};
const KIND = {home:"Namai",kindergarten:"Darželis",school:"Mokykla",activity:"Būrelis",other:"Kita"};

const users = {
  rasa:{id:"rasa",name:"Rasa",contract:"S-2026-01"},
  tomas:{id:"tomas",name:"Tomas",contract:"S-2026-02"},
  egle:{id:"egle",name:"Eglė",contract:"S-2026-03"}
};

function seed(){
  const places = [
    {id:"p1",owner:"rasa",label:"Rasos namai",kind:"home",address:"Žirmūnų g., Vilnius",lat:54.7085,lng:25.2985},
    {id:"p2",owner:"tomas",label:"Tomo namai",kind:"home",address:"Pašilaičiai, Vilnius",lat:54.7330,lng:25.2190},
    {id:"p3",owner:"rasa",label:"Darželis Antakalnyje",kind:"kindergarten",address:"Antakalnio g., Vilnius",lat:54.7020,lng:25.3110},
    {id:"p4",owner:"rasa",label:"Mokykla Naujamiestyje",kind:"school",address:"Naugarduko g., Vilnius",lat:54.6800,lng:25.2680},
    {id:"p5",owner:"tomas",label:"Krepšinis (Šeškinė)",kind:"activity",address:"Šeškinės g., Vilnius",lat:54.7120,lng:25.2410},
    {id:"p6",owner:"rasa",label:"Baseinas (Lazdynai)",kind:"activity",address:"Erfurto g., Vilnius",lat:54.6720,lng:25.2090},
    {id:"p7",owner:"egle",label:"Eglės namai",kind:"home",address:"Fabijoniškės, Vilnius",lat:54.7280,lng:25.2460},
    {id:"p8",owner:"egle",label:"Mokykla Šeškinėje",kind:"school",address:"Šeškinė, Vilnius",lat:54.7180,lng:25.2480},
    {id:"p9",owner:"egle",label:"Dailės studija (Senamiestis)",kind:"activity",address:"Pilies g., Vilnius",lat:54.6840,lng:25.2900}
  ];
  const children = [
    {id:"c1",name:"Ugnė",age:5,booster:"Kėdutė",notes:"Alergija riešutams. Perduoti tik auklėtojai.",guardians:["rasa","tomas"]},
    {id:"c2",name:"Jonas",age:9,booster:"Paaukštinimas",notes:"Krepšinio aprangą pasiima pats.",guardians:["rasa","tomas"]},
    {id:"c3",name:"Matas",age:8,booster:"Paaukštinimas",notes:"",guardians:["egle"]}
  ];
  const pricing = {base_fee:5,per_km:0.9,min_price:10,included_wait_min:5,per_wait_min:0.3,extra_child_fee:3,peak_pct:10,cancel_hours:12,late_cancel_pct:50,target:3000};
  const st = {places,children,pricing,trips:[],seq:1};
  const today = startOfDay(new Date());
  const plan = [
    // [dienų poslinkis, laikas, vaikas, iš, į, užsakė, moka, statusas, laukimas]
    [0,"07:45","c1","p1","p3","rasa","rasa","delivered",0],
    [0,"15:30","c2","p4","p5","tomas","tomas","confirmed",0],
    [0,"16:10","c3","p8","p9","egle","egle","confirmed",10],
    [0,"16:15","c1","p3","p2","tomas","tomas","requested",0],
    [1,"07:45","c1","p1","p3","rasa","rasa","confirmed",0],
    [1,"14:00","c2","p4","p6","rasa","rasa","requested",15],
    [2,"15:30","c2","p4","p5","tomas","tomas","confirmed",0],
    [2,"16:10","c3","p8","p9","egle","egle","requested",10],
    [3,"07:45","c1","p1","p3","rasa","rasa","confirmed",0],
    [-1,"15:30","c2","p4","p5","tomas","tomas","delivered",0],
    [-1,"16:10","c3","p8","p9","egle","egle","delivered",10],
    [-2,"07:45","c1","p1","p3","rasa","rasa","delivered",0],
    [-2,"14:00","c2","p4","p6","rasa","rasa","delivered",15],
    [-3,"15:30","c2","p4","p5","tomas","tomas","cancelled",0]
  ];
  for(const [d,t,c,f,to,by,payer,status,wait] of plan){
    const dt = new Date(today); dt.setDate(dt.getDate()+d); const [h,m]=t.split(":"); dt.setHours(+h,+m,0,0);
    addTrip(st,{child:c,from:f,to,at:dt.toISOString(),by,payer,status,wait,extra:0,note:""});
  }
  return st;
}

function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function km(a,b){const R=6371,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return Math.max(1,Math.round(2*R*Math.asin(Math.sqrt(h))*1.35*10)/10)}
function minutes(k){return Math.max(5,Math.round(k/22*60))}
const r2 = n=>Math.round(n*100)/100;
const eur = n=>n.toLocaleString("lt-LT",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
function isPeak(iso){const d=new Date(iso),h=d.getHours()+d.getMinutes()/60,wd=d.getDay();return wd>=1&&wd<=5&&((h>=7&&h<9)||(h>=15&&h<18))}

function quote(p,{k,wait=0,extra=0,peak=false}){
  const lines=[["Paėmimo mokestis",p.base_fee],[`Atstumas ${k.toFixed(1)} km × ${eur(p.per_km)}`,r2(k*p.per_km)]];
  const pw=Math.max(0,wait-p.included_wait_min); if(pw>0) lines.push([`Laukimas ${pw} min`,r2(pw*p.per_wait_min)]);
  if(extra>0) lines.push([`Papildomi vaikai (${extra})`,r2(extra*p.extra_child_fee)]);
  let s=lines.reduce((a,l)=>a+l[1],0);
  if(peak&&p.peak_pct>0){const x=r2(s*p.peak_pct/100);lines.push([`Piko valandos +${p.peak_pct}%`,x]);s+=x}
  if(s<p.min_price){lines.push(["Iki minimalios kainos",r2(p.min_price-s)]);s=p.min_price}
  return {total:r2(s),lines};
}

function addTrip(st,t){
  const f=st.places.find(p=>p.id===t.from), to=st.places.find(p=>p.id===t.to);
  const k=km(f,to), q=quote(st.pricing,{k,wait:t.wait,extra:t.extra,peak:isPeak(t.at)});
  st.trips.push({id:"t"+(st.seq++),...t,km:k,min:minutes(k),price:q.total,fromLabel:f.label,toLabel:to.label});
}

const KEY="vezimas-demo-v1";
let S; try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S||!S.trips) S=seed();
let role="rasa", tab=null;
try{role=localStorage.getItem(KEY+"-role")||"rasa"}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+"-role",role)}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const child=id=>S.children.find(c=>c.id===id);
const fmtDay=d=>{const t=startOfDay(new Date()),x=startOfDay(d),diff=Math.round((x-t)/864e5);
  const base=d.toLocaleDateString("lt-LT",{weekday:"long",month:"long",day:"numeric"});
  return diff===0?"Šiandien, "+base:diff===1?"Rytoj, "+base:diff===-1?"Vakar, "+base:base[0].toUpperCase()+base.slice(1)};
const fmtTime=d=>d.toLocaleTimeString("lt-LT",{hour:"2-digit",minute:"2-digit"});
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400)}

const TABS={
  parent:[["trips","Mano kelionės"],["book","Užsakyti kelionę"],["kids","Vaikai ir adresai"]],
  owner:[["day","Kalendorius"],["clients","Klientai ir sąskaitos"],["income","Pajamos ir kainos"]]
};
function isOwner(){return role==="owner"}

function render(){
  $("#roleSel").value=role;
  const tabs=TABS[isOwner()?"owner":"parent"];
  if(!tabs.find(t=>t[0]===tab)) tab=tabs[0][0];
  $("#tabs").innerHTML=tabs.map(([k,l])=>`<button role="tab" type="button" data-tab="${k}" aria-selected="${k===tab}">${l}</button>`).join("");
  const v=$("#view");
  ({trips:vTrips,book:vBook,kids:vKids,day:vDay,clients:vClients,income:vIncome})[tab](v);
}

function tripRow(t,{owner=false,conflict=false}={}){
  const d=new Date(t.at), c=child(t.child);
  const by=users[t.by]?.name||t.by, payer=users[t.payer]?.name||t.payer;
  let actions="";
  if(owner){
    if(t.status==="requested") actions=`<button class="btn ok" data-act="confirmed" data-id="${t.id}">Patvirtinti</button><button class="btn bad" data-act="rejected" data-id="${t.id}">Atmesti</button>`;
    else if(t.status==="confirmed") actions=`<button class="btn primary" data-act="picked_up" data-id="${t.id}">Vaikas paimtas</button>`;
    else if(t.status==="picked_up") actions=`<button class="btn ok" data-act="delivered" data-id="${t.id}">Nuvežtas</button>`;
  } else if((t.status==="requested"||t.status==="confirmed")&&d>new Date()){
    const late=(d-new Date())/36e5<S.pricing.cancel_hours;
    actions=`<button class="btn" data-act="cancelled" data-id="${t.id}">Atšaukti${late?` (mokestis ${S.pricing.late_cancel_pct}%)`:""}</button>`;
  }
  return `<div class="trip">
    <div class="time">${fmtTime(d)}<small>${t.min} min</small></div>
    <div class="body">
      <div class="spread"><span class="row"><b>${esc(c.name)}</b><span class="pill s-${t.status}">${STATUS[t.status]}</span>${t.series?'<span class="tag">kartojasi</span>':""}</span><span class="price">${eur(t.price)}</span></div>
      <div class="route">${esc(t.fromLabel)} <span class="arrow">→</span> ${esc(t.toLabel)}</div>
      <div class="small muted">${t.km.toFixed(1)} km · užsakė ${esc(by)} · moka ${esc(payer)}${t.wait?` · laukimas ${t.wait} min`:""}${t.extra?` · +${t.extra} vaik.`:""}</div>
      ${t.note?`<div class="small">Pastaba: ${esc(t.note)}</div>`:""}
      ${conflict?`<div class="warnbox">Persidengia su kita kelione. Patikrinkite, ar spėsite.</div>`:""}
      ${actions?`<div class="row">${actions}</div>`:""}
    </div></div>`;
}

function groupByDay(list,opts){
  const g={};list.forEach(t=>{const k=startOfDay(new Date(t.at)).toISOString();(g[k]=g[k]||[]).push(t)});
  return Object.keys(g).sort().map(k=>`<div class="daygroup card"><h3>${fmtDay(new Date(k))}</h3><div>${g[k].sort((a,b)=>a.at<b.at?-1:1).map(t=>tripRow(t,{...opts,conflict:opts.owner&&hasConflict(t)})).join("")}</div></div>`).join("");
}
function hasConflict(t){
  if(!["requested","confirmed"].includes(t.status))return false;
  const s=new Date(t.at).getTime(), e=s+(t.min+10)*6e4;
  return S.trips.some(o=>o.id!==t.id&&["requested","confirmed","picked_up"].includes(o.status)&&(()=>{const os=new Date(o.at).getTime(),oe=os+(o.min+10)*6e4;return s<oe&&os<e})());
}

function myChildren(){return S.children.filter(c=>c.guardians.includes(role))}
function myTrips(){const ids=myChildren().map(c=>c.id);return S.trips.filter(t=>ids.includes(t.child))}

function vTrips(v){
  const now=startOfDay(new Date());
  const up=myTrips().filter(t=>new Date(t.at)>=now), past=myTrips().filter(t=>new Date(t.at)<now).sort((a,b)=>a.at<b.at?1:-1).slice(0,6);
  const shared=myChildren().some(c=>c.guardians.length>1);
  v.innerHTML=`<div class="spread"><h2>Sveiki, ${esc(users[role].name)}</h2><button class="btn primary" data-go="book">+ Nauja kelionė</button></div>
  ${shared?`<p class="small muted" style="margin:0">Matote visas savo vaikų keliones, taip pat tas, kurias užsakė kitas tėvas. Kiekviena kelionė apmokama to, kas ją užsakė.</p>`:""}
  ${up.length?groupByDay(up,{}):`<div class="card empty">Artimiausių kelionių nėra. Užsakykite pirmą.</div>`}
  <div class="card"><h3>Ankstesnės kelionės</h3><div>${past.map(t=>tripRow(t)).join("")||'<div class="empty">Dar nebuvo.</div>'}</div></div>`;
}

function vBook(v){
  const kids=myChildren(), pl=S.places.filter(p=>p.owner===role||kids.some(k=>k.guardians.includes(p.owner)));
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  const opt=pl.map(p=>`<option value="${p.id}">${esc(p.label)} (${KIND[p.kind]})</option>`).join("");
  v.innerHTML=`<div class="grid2">
  <form class="card" id="bookForm">
    <h2>Užsakyti kelionę</h2>
    <div class="field"><label for="bChild">Vaikas</label><select id="bChild">${kids.map(c=>`<option value="${c.id}">${esc(c.name)}, ${c.age} m.</option>`).join("")}</select></div>
    <div class="two">
      <div class="field"><label for="bFrom">Iš kur paimti</label><select id="bFrom">${opt}</select></div>
      <div class="field"><label for="bTo">Kur nuvežti</label><select id="bTo">${opt}</select></div>
    </div>
    <div class="two">
      <div class="field"><label for="bDate">Data</label><input type="date" id="bDate" value="${tomorrow.toISOString().slice(0,10)}"></div>
      <div class="field"><label for="bTime">Paėmimo laikas</label><input type="time" id="bTime" value="15:30"></div>
    </div>
    <div class="field"><span class="lbl">Kartoti kas savaitę (nebūtina)</span>
      <div class="days">${DAYS.map((d,i)=>`<label><input type="checkbox" name="wd" value="${i+1}" id="wd${i+1}"><span>${d}</span></label>`).join("")}</div>
      <span class="small muted">Pažymėjus dienas, kelionės bus sukurtos 4 savaitėms į priekį.</span></div>
    <div class="two">
      <div class="field"><label for="bWait">Kiek reikės palaukti, min</label><input type="number" id="bWait" min="0" max="120" step="5" value="0"></div>
      <div class="field"><label for="bExtra">Papildomi vaikai (pvz. draugas)</label><input type="number" id="bExtra" min="0" max="3" value="0"></div>
    </div>
    <div class="field"><label for="bNote">Pastaba vairuotojui</label><textarea id="bNote" rows="2" placeholder="Pvz. paimti iš sporto salės durų"></textarea></div>
    <button class="btn primary" type="submit">Pateikti užsakymą</button>
  </form>
  <div class="card" id="quoteBox" aria-live="polite"></div></div>`;
  if(pl.length>1) $("#bTo").selectedIndex=1;
  const upd=()=>{
    const f=S.places.find(p=>p.id===$("#bFrom").value), t=S.places.find(p=>p.id===$("#bTo").value);
    const box=$("#quoteBox");
    if(!f||!t||f.id===t.id){box.innerHTML=`<h2>Kaina</h2><p class="muted">Pasirinkite skirtingas paėmimo ir nuvežimo vietas.</p>`;return}
    const k=km(f,t), at=new Date($("#bDate").value+"T"+$("#bTime").value);
    const q=quote(S.pricing,{k,wait:+$("#bWait").value||0,extra:+$("#bExtra").value||0,peak:isPeak(at)});
    const wds=[...document.querySelectorAll('input[name=wd]:checked')].length;
    box.innerHTML=`<h2>Kaina</h2>
      <div class="route">${esc(f.label)} <span class="arrow">→</span> ${esc(t.label)}</div>
      <div class="small muted">Apie ${k.toFixed(1)} km ir ${minutes(k)} min kelio</div>
      <div class="quote">${q.lines.map(l=>`<div class="line"><span>${l[0]}</span><span>${eur(l[1])}</span></div>`).join("")}
      <div class="line total"><span>Viena kelionė</span><span class="price">${eur(q.total)}</span></div>
      ${wds?`<div class="line"><span>${wds} k./sav. × 4 sav.</span><span>${eur(q.total*wds*4)}</span></div>`:""}</div>
      <p class="small muted" style="margin:0">Kaina fiksuojama pateikus užsakymą. Nemokamai atšaukti galima iki ${S.pricing.cancel_hours} val. prieš kelionę, vėliau taikomas ${S.pricing.late_cancel_pct}% mokestis.</p>`;
  };
  v.querySelectorAll("select,input").forEach(el=>el.addEventListener("input",upd));upd();
  $("#bookForm").addEventListener("submit",e=>{
    e.preventDefault();
    const from=$("#bFrom").value,to=$("#bTo").value;
    if(from===to){toast("Paėmimo ir nuvežimo vietos turi skirtis");return}
    const base={child:$("#bChild").value,from,to,by:role,payer:role,status:"requested",wait:+$("#bWait").value||0,extra:+$("#bExtra").value||0,note:$("#bNote").value.trim()};
    const wds=[...document.querySelectorAll('input[name=wd]:checked')].map(x=>+x.value);
    const first=new Date($("#bDate").value+"T"+$("#bTime").value);
    if(isNaN(first)){toast("Įveskite datą ir laiką");return}
    let n=0;
    if(!wds.length){addTrip(S,{...base,at:first.toISOString()});n=1}
    else{const sid="s"+Date.now();for(let i=0;i<28;i++){const d=new Date(first);d.setDate(d.getDate()+i);const wd=d.getDay()||7;if(wds.includes(wd)){addTrip(S,{...base,series:sid,at:d.toISOString()});n++}}}
    save();tab="trips";render();toast(n>1?`Pateikta ${n} kelionių. Laukia patvirtinimo.`:"Užsakymas pateiktas. Laukia patvirtinimo.");
  });
}

  v.innerHTML=`<div class="grid2"><div class="card"><h2>Vaikai</h2>
    ${kids.map(c=>`<div class="child"><div class="spread"><b>${esc(c.name)}, ${c.age} m.</b><span class="tag">${esc(c.booster)}</span></div>
      <div class="small muted">Globėjai: ${c.guardians.map(g=>esc(users[g].name)).join(", ")}</div>
      ${c.notes?`<div class="small">${esc(c.notes)}</div>`:""}</div>`).join("")}
    <p class="small muted" style="margin:0">Vaikus ir globėjus įrašo savininkas pagal sutartį.</p></div>
    <div class="card"><h2>Mano adresai</h2>
    <div>${pl.map(p=>`<div class="child"><div class="spread"><b>${esc(p.label)}</b><span class="tag">${KIND[p.kind]}</span></div><div class="small muted">${esc(p.address)}</div></div>`).join("")||'<div class="empty">Adresų dar nėra.</div>'}</div>
    <form id="placeForm">

    </form></div></div>`;
  $("#placeForm").addEventListener("submit",e=>{e.preventDefault();

    save();render();toast("Adresas pridėtas")});
}

function vDay(v){
  const now=startOfDay(new Date());
  const list=S.trips.filter(t=>new Date(t.at)>=now&&!["rejected","cancelled"].includes(t.status));
  const pending=list.filter(t=>t.status==="requested").length;
  const todays=list.filter(t=>startOfDay(new Date(t.at)).getTime()===now.getTime());
  v.innerHTML=`<div class="stats">
    <div class="stat"><span class="small muted">Laukia patvirtinimo</span><b>${pending}</b></div>
    <div class="stat"><span class="small muted">Šiandien kelionių</span><b>${todays.length}</b></div>
    <div class="stat"><span class="small muted">Šiandien uždirbsite</span><b>${eur(todays.reduce((a,t)=>a+t.price,0))}</b></div>
    <div class="stat"><span class="small muted">Šiandien km su vaikais</span><b>${todays.reduce((a,t)=>a+t.km,0).toFixed(1)}</b></div></div>
    ${groupByDay(list,{owner:true})||'<div class="card empty">Artimiausių kelionių nėra.</div>'}`;
}

function monthTrips(){const n=new Date(),m=n.getMonth(),y=n.getFullYear();
  return S.trips.filter(t=>{const d=new Date(t.at);return d.getMonth()===m&&d.getFullYear()===y})}
function billable(t){return ["confirmed","picked_up","delivered"].includes(t.status)}

function vClients(v){
  const mt=monthTrips(), month=new Date().toLocaleDateString("lt-LT",{year:"numeric",month:"long"});
  const rows=Object.values(users).map(u=>{const ts=mt.filter(t=>t.payer===u.id&&billable(t));
    const done=ts.filter(t=>t.status==="delivered");
    return {u,n:ts.length,done:done.length,sum:ts.reduce((a,t)=>a+t.price,0),doneSum:done.reduce((a,t)=>a+t.price,0)}});
  v.innerHTML=`<div class="card"><div class="spread"><h2>Sąskaitos už ${month}</h2><span class="small muted">Skaičiuojama pagal tai, kas moka už kelionę</span></div>
    <div class="scroll"><table><thead><tr><th>Klientas</th><th>Sutartis</th><th class="num">Kelionės</th><th class="num">Įvykdyta</th><th class="num">Įvykdyta, €</th><th class="num">Iš viso mėn., €</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.u.name)}</td><td>${r.u.contract}</td><td class="num">${r.n}</td><td class="num">${r.done}</td><td class="num">${eur(r.doneSum)}</td><td class="num"><b>${eur(r.sum)}</b></td></tr>`).join("")}</tbody></table></div>
    <p class="small muted" style="margin:0">Tikroje versijoje iš čia bus galima atsisiųsti sąskaitą faktūrą kiekvienam klientui.</p></div>
    <div class="card"><h2>Vaikai ir globėjai</h2>${S.children.map(c=>`<div class="child"><div class="spread"><b>${esc(c.name)}, ${c.age} m.</b><span class="tag">${esc(c.booster)}</span></div><div class="small muted">Globėjai: ${c.guardians.map(g=>esc(users[g].name)).join(", ")}</div>${c.notes?`<div class="small">${esc(c.notes)}</div>`:""}</div>`).join("")}</div>`;
}

function vIncome(v){
  const p=S.pricing, mt=monthTrips().filter(billable);
  const rev=mt.reduce((a,t)=>a+t.price,0), kms=mt.reduce((a,t)=>a+t.km,0)*(1+DEADHEAD);
  const fuel=kms*FUEL_L_100/100*FUEL_PRICE, left=rev-fuel, pct=Math.min(100,left/p.target*100);
  const fields=[["base_fee","Paėmimo mokestis, €"],["per_km","Kaina už km, €"],["min_price","Minimali kelionės kaina, €"],["included_wait_min","Nemokamas laukimas, min"],["per_wait_min","Laukimo minutė, €"],["extra_child_fee","Papildomas vaikas, €"],["peak_pct","Piko priemoka (7–9 ir 15–18 val.), %"],["cancel_hours","Nemokamas atšaukimas iki, val."],["late_cancel_pct","Vėlyvo atšaukimo mokestis, %"],["target","Mėnesio tikslas, €"]];
  v.innerHTML=`<div class="grid2"><div class="card"><h2>Šis mėnuo</h2>
    <div class="stats"><div class="stat"><span class="small muted">Pajamos</span><b>${eur(rev)}</b></div>
    <div class="stat"><span class="small muted">Kuras (apytiksliai)</span><b>${eur(fuel)}</b></div>
    <div class="stat"><span class="small muted">Liko po kuro</span><b>${eur(left)}</b></div></div>
    <div class="spread small"><span>Tikslas ${eur(p.target)}</span><span>${pct.toFixed(0)}%</span></div><div class="bar"><i style="width:${Math.max(0,pct)}%"></i></div>
    <p class="small muted" style="margin:0">Kuras skaičiuojamas ${FUEL_L_100} l/100 km po ${FUEL_PRICE.toFixed(2)} €/l, pridedant tuščius km iki paėmimo vietos. Mokesčiai, draudimas ir automobilio nusidėvėjimas bus įtraukti pagal kainodaros skaičiavimą.</p></div>
    <form class="card" id="priceForm"><h2>Kainos</h2>
    <div class="two">${fields.map(([k,l])=>`<div class="field"><label for="pr_${k}">${l}</label><input type="number" step="0.05" min="0" id="pr_${k}" value="${p[k]}"></div>`).join("")}</div>
    <button class="btn primary" type="submit">Išsaugoti kainas</button>
    <span class="small muted">Naujos kainos taikomos naujiems užsakymams. Jau pateiktų kaina nesikeičia.</span></form></div>`;
  $("#priceForm").addEventListener("submit",e=>{e.preventDefault();fields.forEach(([k])=>{const x=parseFloat($("#pr_"+k).value);if(!isNaN(x))p[k]=x});save();render();toast("Kainos išsaugotos")});
}

document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;render();return}
  const go=e.target.closest("[data-go]");if(go){tab=go.dataset.go;render();return}
  const a=e.target.closest("[data-act]");
  if(a){const t=S.trips.find(x=>x.id===a.dataset.id);if(!t)return;
    if(a.dataset.act==="cancelled"&&a.dataset.sure!=="1"){a.dataset.sure="1";a.textContent="Tikrai atšaukti?";a.classList.add("bad");return}
    t.status=a.dataset.act;save();render();
    toast({confirmed:"Patvirtinta. Tėvams išsiųstas pranešimas.",rejected:"Atmesta. Tėvams išsiųstas pranešimas.",picked_up:"Tėvams pranešta, kad vaikas paimtas.",delivered:"Tėvams pranešta, kad vaikas nuvežtas.",cancelled:"Kelionė atšaukta."}[t.status])}
});
$("#roleSel").addEventListener("change",e=>{role=e.target.value;tab=null;save();render()});
$("#resetBtn").addEventListener("click",e=>{const b=e.currentTarget;if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tikrai atkurti?";return}
  b.dataset.sure="";b.textContent="Atkurti pavyzdžius";S=seed();save();render();toast("Pavyzdžiai atkurti")});
render();
})();
</script>
