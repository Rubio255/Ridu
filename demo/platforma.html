<title>Ridu platforma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column under the brand header; bottom tab bar per role. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e8eeec; --fg:#14211f; --muted:#5b6b68; --line:#d5dedb;
  --brand:#0f4c45; --brand-fg:#ffffff; --accent:#f2b705; --accent-fg:#1e1a00;
  --ok:#1f7a4d; --ok-bg:#dcf2e6; --warn:#9a6300; --warn-bg:#fdf0cf; --bad:#b3261e; --bad-bg:#fbe1de; --info:#1d5b9a; --info-bg:#dde9f7;
  --shadow:0 10px 30px rgba(15,76,69,.16);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --surface-2:#1f2d2b; --fg:#e6efed; --muted:#9db0ac; --line:#2c3d3a;
  --brand:#5fc2b4; --brand-fg:#062420; --accent:#f5c53a; --accent-fg:#1e1a00;
  --ok:#6fd49c; --ok-bg:#163526; --warn:#f0c062; --warn-bg:#3a2e10; --bad:#f2958c; --bad-bg:#3d1916; --info:#8dbcf0; --info-bg:#172a40;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1f2d2b; --fg:#e6efed; --muted:#9db0ac; --line:#2c3d3a;
  --brand:#5fc2b4; --brand-fg:#062420; --accent:#f5c53a; --accent-fg:#1e1a00;
  --ok:#6fd49c; --ok-bg:#163526; --warn:#f0c062; --warn-bg:#3a2e10; --bad:#f2958c; --bad-bg:#3d1916; --info:#8dbcf0; --info-bg:#172a40;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-fg)}
header .wrap{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;padding-block:10px}
header .wrap > .seg{order:3;flex:1 0 100%;margin-left:0}
header .wrap > .seg button{flex:1;padding:7px 8px;font-size:.86rem}
.logo{display:flex;gap:10px;align-items:center}
.logo svg{width:32px;height:32px;display:block}
.logo h1{font-size:1.15rem}
.langbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;border-radius:10px;padding:5px 8px;font-size:.78rem;font-weight:700;letter-spacing:.04em;flex:none;transition:transform .2s var(--spring,ease)}
.langbtn.dark{border-color:var(--line);background:var(--surface-2);color:var(--fg)}
.langbtn:active{transform:scale(.92)}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:inherit;padding:5px 9px;border-radius:8px;font-size:.82rem;font-weight:600;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--brand-fg);color:var(--brand);opacity:1}
.note{background:var(--accent);color:var(--accent-fg);font-size:.8rem}
.note .wrap{padding-block:5px}
main .wrap{padding-block:16px 110px;display:grid;gap:14px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.ico{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.ico svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--brand);color:var(--brand-fg);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.tag{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--info-bg);color:var(--info)}
.tag .ico{width:15px;height:15px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.9rem}
label.f input,label.f select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-weight:500;width:100%}
.fieldset{display:grid;gap:6px}
.fieldset > span{font-weight:600;font-size:.9rem}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* swipe deck */
.deck{position:relative;height:440px;touch-action:pan-y}
.sw{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;user-select:none;transition:transform .25s ease}
.sw.back{transform:scale(.95) translateY(14px);filter:saturate(.8)}
.sw.dragging{transition:none}
.sw .top{position:relative;height:170px;display:flex;align-items:flex-end;padding:14px 16px;color:#fff}
.sw .top .av{position:absolute;right:16px;top:16px;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5)}
.sw .top h3{font-size:1.5rem;color:#fff}
.sw .top .sub{opacity:.9;font-size:.9rem}
.sw .body{padding:14px 16px;display:grid;gap:10px;align-content:start;flex:1;min-height:0;overflow:auto}
.facts{display:grid;gap:6px}
.facts div{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.facts .ico{color:var(--muted);width:18px;height:18px;margin-top:2px}
.fit{font-family:var(--display);font-weight:700;font-size:.95rem;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:4px 10px;position:absolute;left:16px;top:16px}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;border-radius:10px;font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.06em;opacity:0;transform:rotate(-12deg);background:var(--surface)}
.stamp.yes{left:18px;color:var(--ok);top:120px}
.stamp.no{right:18px;color:var(--bad);transform:rotate(12deg);top:120px}
.price{font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.actions{display:flex;justify-content:center;gap:18px;align-items:center}
.round{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.round .ico{width:28px;height:28px}
.round.no{color:var(--bad)} .round.yes{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.round.sm{width:44px;height:44px;box-shadow:none;color:var(--muted)} .round.sm .ico{width:20px;height:20px}
.empty{text-align:center;display:grid;gap:10px;place-items:center;padding:40px 16px;border:1px dashed var(--line);border-radius:20px;height:440px;align-content:center}
.empty .ico{width:40px;height:40px;color:var(--muted)}

/* list */
.list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.li .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;flex:none}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block}
.li .grow b span{display:inline}
.li .grow > span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* steps */
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-bottom:14px;position:relative}
.step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:.85rem}
.step.done .dot{background:var(--ok);color:#fff}
.step.now .dot{background:var(--accent);color:var(--accent-fg)}
.dot .ico{width:16px;height:16px}
.chat{display:grid;gap:6px;max-height:220px;overflow:auto;padding:4px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--surface-2);font-size:.92rem}
.msg.me{justify-self:end;background:var(--brand);color:var(--brand-fg)}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.bottom .wrap{display:flex;justify-content:space-around}
nav.bottom button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 6px;font-size:.74rem;font-weight:600;color:var(--muted);position:relative;flex:1}
nav.bottom button[aria-current="page"]{color:var(--brand)}
nav.bottom .badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--accent);color:var(--accent-fg);border-radius:999px;font-size:.68rem;padding:0 6px;font-weight:700}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(6,30,27,.72);display:grid;place-items:center;z-index:20;padding:20px}
.ov .card{max-width:380px;width:100%;text-align:center;justify-items:center;animation:pop .35s ease}
.pair{display:flex;align-items:center}
.pair .av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.5rem;border:3px solid var(--surface)}
.pair .av + .av{margin-left:-14px}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.doc{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.doc:first-of-type{border-top:0;padding-top:0}
.doc .grow{min-width:0}
.doc b{display:block;font-size:.93rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion: reduce){.sw,.ov .card{transition:none;animation:none}}
.offer{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface);max-width:92%}
.offer.me{justify-self:end;border-color:var(--brand)}
.offer.done{background:var(--ok-bg);border-color:transparent}
.offer.old{opacity:.55}
.offer .kv{display:flex;gap:14px;flex-wrap:wrap;font-size:.92rem}
.offer .kv b{font-family:var(--display);font-size:1.1rem}
.inline{display:grid;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ext{color:var(--info);font-weight:700;text-decoration:none;display:inline-flex;gap:4px;align-items:center;font-size:.88rem}
.ext .ico{width:15px;height:15px}
.pc{font-variant-numeric:tabular-nums;font-weight:700}
.pcout:empty{display:none}
.card > *{min-width:0}
.lvb{background:var(--info-bg);border:0}
.lv{display:grid;gap:12px;justify-items:center;text-align:center}
.lv-cam{position:relative;width:190px;height:240px}
.lv-cam .face{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#e9c9a8 0 22%,transparent 23%),radial-gradient(ellipse at 50% 92%,#2a8f7f 0 40%,transparent 41%),linear-gradient(#cfd8d6,#9fb2ae);overflow:hidden}
.lv-cam svg{position:absolute;inset:0;width:100%;height:100%}
.lv-cam ellipse{fill:none;stroke-width:6}
.lv-cam .bg{stroke:var(--line)} .lv-cam .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.lv-step{min-height:2.6em;font-weight:700}
.lv .two,.lv .chk,.lv .err{justify-self:stretch}
.lv ul{text-align:left;margin:0;padding-left:18px}
.lvlist{display:grid;gap:6px;margin:0;padding-left:18px}
.slogan{margin:4px 0 -4px;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.1;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--brand) 0%,#2a8f7f 45%,var(--accent) 60%,var(--brand) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sl 6s ease-in-out infinite}
@keyframes sl{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.cal{border:1px solid var(--glass-line);border-radius:16px;padding:10px;display:grid;gap:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between}.cal-h b{font-family:var(--display);font-size:1.02rem}
.cal-h .round.sm{width:36px;height:36px}.cal-h .flip .ico{transform:scaleX(-1)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cw{font-size:.75rem;font-weight:700;color:var(--muted);padding:2px 0}.cw.we{color:var(--bad)}
.cd{position:relative;border:0;background:none;border-radius:10px;aspect-ratio:1;max-height:44px;font-weight:600;font-variant-numeric:tabular-nums;transition:transform .2s var(--spring),background .2s}
.cd:hover:not(:disabled):not([aria-pressed="true"]){background:var(--surface-2)}
.cd.we{color:var(--bad)}.cd:disabled{opacity:.3;cursor:default}
.cd.today{box-shadow:inset 0 0 0 2px var(--line)}
.cd.hol{color:var(--bad);background:color-mix(in srgb,var(--bad-bg) 70%,transparent)}
.cd.hol::after,.cal-l .hd{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.cd[aria-pressed="true"]{background:linear-gradient(135deg,var(--brand),#2a8f7f);color:var(--brand-fg);animation:pop .3s var(--spring)}
.cal-l{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:.8rem;color:var(--muted)}
.cal-l li{display:flex;gap:8px;align-items:center}.cal-l .hd{position:static;margin:0;flex:none}
.faq{display:grid;gap:10px}
.faq details{gap:0;padding:0;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:700}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .35s var(--spring);color:var(--brand)}
.faq details[open] summary .ico{transform:rotate(45deg)}
.faq .ans{display:grid;gap:8px;padding:0 16px 14px;color:var(--fg);font-size:.93rem}
.faq details[open] .ans{animation:rise .4s var(--ease)}
.cal-s:empty{display:none}.sum:empty{display:none}.sum{display:flex;gap:6px;align-items:flex-start;margin-top:10px}.cal-s{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pcout{font-weight:500}
.vrow{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.vrow:first-of-type{border-top:0;padding-top:0}
.err{color:var(--bad);font-size:.85rem}
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;border:0;padding:0;display:grid;place-items:center;color:#fff;font-size:.72rem;font-weight:700;background:var(--surface-2)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .lbl{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:rgba(0,0,0,.45);text-align:left}
.ph .ico{width:26px;height:26px;opacity:.9}
.ph .st{position:absolute;top:5px;right:5px}
.ph.empty{border:1px dashed var(--line);color:var(--muted)}
.ph.empty .lbl{background:none;color:var(--muted)}
.strip{display:flex;gap:6px;overflow-x:auto}
.strip .ph{flex:0 0 96px}
.lb{max-width:min(92vw,900px);width:100%;display:grid;gap:10px;justify-items:center}
.lb .ph{width:100%;font-size:1rem}

/* ===== Gyvas sluoksnis: judantis fonas, stiklas, mikro-animacijos ===== */
:root{
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-line:rgba(255,255,255,.75);
  --glass-shadow:0 8px 32px rgba(15,76,69,.14), inset 0 1px 0 rgba(255,255,255,.7);
  --blob1:rgba(42,143,127,.55); --blob2:rgba(242,183,5,.45); --blob3:rgba(63,143,214,.35); --base:#e6f1ee;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glass:rgba(22,33,32,.55); --glass-strong:rgba(22,33,32,.78); --glass-line:rgba(255,255,255,.12);
  --glass-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  --blob1:rgba(42,143,127,.45); --blob2:rgba(245,197,58,.22); --blob3:rgba(63,143,214,.28); --base:#0b1312}}
:root[data-theme="dark"]{
  --glass:rgba(22,33,32,.55); --glass-strong:rgba(22,33,32,.78); --glass-line:rgba(255,255,255,.12);
  --glass-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  --blob1:rgba(42,143,127,.45); --blob2:rgba(245,197,58,.22); --blob3:rgba(63,143,214,.28); --base:#0b1312}
body{background:var(--base)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform}
.bg i:nth-child(1){width:420px;height:420px;background:var(--blob1);left:-120px;top:60px;animation:drift1 22s ease-in-out infinite alternate}
.bg i:nth-child(2){width:360px;height:360px;background:var(--blob2);right:-120px;top:300px;animation:drift2 26s ease-in-out infinite alternate}
.bg i:nth-child(3){width:380px;height:380px;background:var(--blob3);left:20%;bottom:-160px;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(160px,220px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-180px,-160px) scale(.9)}}
@keyframes drift3{to{transform:translate(120px,-240px) scale(1.1)}}
.glass,.card,.li,.sw,.offer,.empty,.round,nav.bottom,.chatform input,label.f input,label.f select,.chip{
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-color:var(--glass-line)}
.card,.li,.offer,.empty{box-shadow:var(--glass-shadow)}
.sw{background:var(--glass-strong)}
.card{border-radius:20px}
header{background:color-mix(in srgb, var(--brand) 78%, transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4)}
body::before{background:color-mix(in srgb, var(--brand) 78%, transparent)}
.note{background:color-mix(in srgb, var(--accent) 88%, transparent)}
nav.bottom{border-top:1px solid var(--glass-line);background:var(--glass-strong)}
.seg{background:rgba(255,255,255,.16)}
.seg button{transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--spring)}
.seg button:active{transform:scale(.94)}
.logo circle{transform-origin:46px 19px;animation:dot 3.2s var(--spring) infinite}

function newClientCheck(o){
  const l = S.live[o.driver]; if(!l || l.review || l.due || l.last?.startsWith(TODAY)) return;
  l.due = reqOf(o.req).type==='child' && reqOf(o.req).repeat ? 'child_route' : 'new_client';
}
function simulateReply(o){
  if(persona(o)) return;
  const cv = convOf(o.id), q = reqOf(o.req);
  cv.typing = true; setTimeout(refresh, 400);
  setTimeout(() => {
    cv.typing = false;
    const open = lastOpen(cv); if(!open || cv.agreed) return;
    const replier = open.by==='client' ? 'driver' : 'client';
    const target = replier==='driver' ? o.price : open.price;
    if(open.price >= target*0.9 || cv.msgs.filter(m=>m.kind==='offer').length > 2){
      open.state='accepted'; cv.agreed={price:open.price, time:open.time, days:open.days}; burst(); newClientCheck(o);
      cv.msgs.push({by:replier, t:'Tinka, sutinku.'});
    } else {
      open.state='old';
      const mid = Math.round(((open.price + target)/2)*2)/2;
      cv.msgs.push({kind:'offer', by:replier, price:mid, time:open.time, days:open.days, state:'open'});
      cv.msgs.push({by:replier, t:'Gal susitinkame per vidurį?'});
    }
    refresh();
  }, 2500);
}

function bindSwipe(el, done){
  let x0=null, dx=0;
  const yes=el.querySelector('.stamp.yes'), no=el.querySelector('.stamp.no');
  el.addEventListener('pointerdown', e => { if(e.button>0) return; x0=e.clientX; dx=0; el.setPointerCapture(e.pointerId); el.classList.add('dragging'); });
  el.addEventListener('pointermove', e => { if(x0===null) return; dx=e.clientX-x0; el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; yes.style.opacity=Math.max(0,Math.min(1,dx/100)); no.style.opacity=Math.max(0,Math.min(1,-dx/100)); });
  const end = () => { if(x0===null) return; x0=null; el.classList.remove('dragging');
    if(Math.abs(dx)>100) done(Math.sign(dx)); else { el.style.transform=''; yes.style.opacity=0; no.style.opacity=0; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

    const price=Number(ovl.querySelector('#rt-price').value)||0;
    S.routes.unshift({id:nid('r'), driver:ME_DRIVER, from, to, days:f.days.slice(), time:ovl.querySelector('#rt-time').value||'07:30', seats:Number(ovl.querySelector('#rt-seats').value), price, child:!!drivers[ME_DRIVER].child, note:ovl.querySelector('#rt-note').value.trim()});

      <div class="phs">${PHOTOS.map(p => `<label class="filebtn" for="ph-${p.k}" style="display:block;cursor:pointer" title="${p.t}">${phTile(S.photos[ME_DRIVER][p.k], p, drivers[ME_DRIVER].g, {status:true})}<input id="ph-${p.k}" type="file" accept="image/jpeg,image/png,image/heic,image/webp" data-ph="${p.k}" aria-label="Įkelti: ${p.t}"></label>`).join('')}</div>

        ${x.how?`<p class="small">Patvirtinta per ${esc(x.how)}${x.at?` · ${x.at}`:''}</p>`:''}

      </div>`; }).join('')}</div>`;
  bindLive(); view.querySelector('#lv-vc2')?.addEventListener('click', ()=>{ videoCall(); render(); });
  view.querySelectorAll('input[data-ph]').forEach(inp => inp.addEventListener('change', () => {
    const file = inp.files?.[0], k = inp.dataset.ph, err = view.querySelector('#ph-err'); if(!file) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const L = Math.max(img.naturalWidth, img.naturalHeight), Sh = Math.min(img.naturalWidth, img.naturalHeight);
      if(L < MIN_LONG || Sh < MIN_SHORT){ URL.revokeObjectURL(url); err.textContent = `Per maža raiška (${img.naturalWidth}×${img.naturalHeight} px). Reikia bent ${MIN_LONG}×${MIN_SHORT} px.`; err.hidden=false; return; }

      let q = S.queue.find(x=>x.me); if(!q){ q={driver:'Rimas', g:0, items:{}, me:true}; S.queue.unshift(q); }
      q.photos = q.photos || {}; q.photos[k] = ph;
      toast('Nuotrauka išsiųsta patikrai'); render();
    };
    img.onerror = () => { URL.revokeObjectURL(url); err.textContent='Nepavyko atidaryti failo. Įkelkite JPG arba PNG.'; err.hidden=false; };
    img.src = url;
  }));
  view.querySelectorAll('form[data-k]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault(); const k=f.dataset.k, val=f.querySelector('input').value.trim(); if(!val){ toast('Įveskite numerį'); return; }
    v[k] = {st:'rev', val}; S.queue.unshift({driver:'Rimas', g:0, items:{[k]:{st:'rev', val}}, me:true});
    toast('Išsiųsta patikrai. Paprastai per 1 darbo dieną'); render();
  }));
}

const LEGAL = {"lt":{"terms":{"t":"Ridu naudojimosi taisyklės","v":"2026-11-25","sections":[{"h":"1. Kas yra Ridu","html":"<p>Ridu yra internetinė paieškos platforma. Ji padeda žmonėms, kuriems reikia nuvežti save, vaiką ar artimąjį (klientams), rasti vairuotojus, turinčius LTSA pavėžėjimo leidimą (vairuotojus), ir susitarti tarpusavyje.</p><p>Platformą valdo MB „Įmonių veiklos analizė“, įmonės kodas 307404233, buveinė Giedraičių g. 39, R53, LT-09302 Vilnius, tel. +370 649 94125, el. paštas info@ridu.lt (toliau – Ridu, mes).</p><p>Ridu neveža keleivių, nenustato kainų, nepriima mokėjimų už keliones ir neskiria vairuotojų. Pavėžėjimo sutartį sudaro klientas ir vairuotojas tiesiogiai. Ridu nėra šios sutarties šalis ir už jos vykdymą neatsako.</p>"},{"h":"2. Kas gali naudotis","html":"<ul><li>Naudotis gali tik pilnamečiai (18 m. ir vyresni) veiksnūs asmenys. Vaikai patys paskyrų nekuria: už juos užsako tėvai ar kiti teisėti atstovai.</li><li>Vienas žmogus gali turėti tik vieną kliento ir vieną vairuotojo paskyrą.</li><li>Registruodamiesi pateikiate tikrus ir savo duomenis ir juos atnaujinate, kai jie pasikeičia.</li><li>Vairuotoju gali būti tik asmuo, kuris turi galiojantį LTSA pavėžėjimo leidimą su jame nurodytu automobiliu, vairuotojo pažymėjimą ir įregistruotą veiklą (pvz. individualią veiklą). Vairuotojas su klientais santykiauja kaip verslininkas.</li></ul>"},{"h":"3. Paskyra ir saugumas","html":"<ul><li>Prisijungimo duomenis saugokite ir niekam jų neperduokite. Už veiksmus savo paskyroje atsakote jūs.</li><li>Jei manote, kad paskyra pasiekta be jūsų žinios, nedelsdami pakeiskite prisijungimą ir praneškite mums.</li><li>Ridu niekada neprašys jūsų slaptažodžio, patvirtinimo kodo ar banko duomenų žinute ar telefonu.</li></ul>"},{"h":"4. Kaip veikia paieška ir susitarimas","html":"<ol><li>Klientas paskelbia užklausą. Kiti naudotojai mato tik pašto kodą, laiką ir keleivių skaičių, bet ne tikslų adresą ir ne vardą.</li><li>Vairuotojai pasisiūlo su kaina. Vairuotojas taip pat gali paskelbti savo pastovų maršrutą.</li><li>Kai klientas sutinka kontaktuoti, atsiveria pokalbis. Tikslų adresą klientas pasako pats, kai nori.</li><li>Dėl kainos, laiko, mokėjimo ir kitų sąlygų šalys susitaria pačios ir sudaro sutartį. Pro plane galima naudotis sutarties šablonu.</li></ol><p>Pasiūlymų tvarka. Užklausos ir pasiūlymai rikiuojami pagal atstumą tarp pašto kodų, laiką ir paskelbimo datą. Pro plano naudotojų užklausos ir pasiūlymai gali būti rodomi aukščiau. Tokie įrašai pažymimi žyma „Iškelta“. Ridu nevertina ir nerikiuoja vairuotojų pagal tai, kiek kelionių jie priima ar atsisako.</p>"},{"h":"5. Ką reiškia ženklelis „Patikimas ir patikrintas vairuotojas“","html":"<p>Ženklelį gauna vairuotojas, kurio LTSA pavėžėjimo leidimą ir su juo susietą automobilį patikrinome pagal viešus LTSA duomenis, o nuotraukas peržiūrėjome. Patikra daroma registruojantis ir vėliau periodiškai.</p><p>Ženklelis nėra garantija, kad kelionė praeis be problemų. Prieš sudarydami sutartį pasikalbėkite su vairuotoju, o vaiko atveju susitikite.</p>"},{"h":"6. Kliento teisės ir pareigos","html":"<p>Klientas turi teisę:</p><ul><li>nemokamai skelbti užklausas pagal savo planą, rinktis vairuotoją ar atsisakyti visų pasiūlymų;</li><li>bet kada nutraukti pokalbį ir užblokuoti naudotoją;</li><li>pranešti apie pažeidimą ir gauti atsakymą.</li></ul><p>Klientas privalo:</p><ul><li>nurodyti teisingą informaciją apie kelionę ir keleivius;</li><li>užsakydamas kitam suaugusiajam, gauti jo sutikimą;</li><li>užsakydamas vaikui, būti jo tėvu, motina ar kitu teisėtu atstovu arba turėti jų sutikimą;</li><li>vykdyti su vairuotoju sudarytą sutartį ir sumokėti sutartą kainą tiesiogiai vairuotojui.</li></ul>"},{"h":"7. Vairuotojo teisės ir pareigos","html":"<p>Vairuotojas turi teisę:</p><ul><li>pats spręsti, ar, kada ir kiek vežti, kokią kainą siūlyti ir kurias užklausas praleisti;</li><li>tuo pat metu dirbti per kitas platformas ar savarankiškai;</li><li>gauti paaiškinimą, jei jo profilis apribojamas, ir šį sprendimą apskųsti.</li></ul><p>Vairuotojas privalo:</p><ul><li>vežti tik turėdamas galiojantį LTSA pavėžėjimo leidimą ir tik jame nurodytu automobiliu, o leidimui pasibaigus ar pasikeitus automobiliui tą pačią dieną atnaujinti duomenis Ridu;</li><li>turėti galiojantį privalomąjį civilinės atsakomybės draudimą, tinkamą keleivių vežimui už atlygį, ir tvarkingą automobilį su galiojančia technine apžiūra;</li><li>vežti vaikus tik tinkamose saugos kėdutėse ar paaukštinimuose pagal Kelių eismo taisykles;</li><li>laikytis Kelių eismo taisyklių ir darbo bei poilsio režimo, nevairuoti pavargęs ar apsvaigęs;</li><li>savarankiškai deklaruoti pajamas ir mokėti mokesčius;</li><li>klientams, kurie yra vartotojai, suteikti visą įstatymų reikalaujamą informaciją: savo vardą, pavardę, veiklos pažymos numerį, kontaktus, kainą ir sąlygas;</li><li>naudoti tik savo nuotraukas ir tikras automobilio nuotraukas;</li><li>atlikti tapatybės ir gyvumo patikrą, kai Ridu jos paprašo (registruojantis, periodiškai, prieš pirmą kelionę su nauju klientu, atsitiktinai ar pastebėjus rizikos ženklą). Po 2 nesėkmingų bandymų profilis paslepiamas, kol administratorius peržiūri atvejį. Vairuotojas gali prašyti patvirtinti tapatybę vaizdo skambučiu ir apskųsti sprendimą.</li></ul><p>Vairuotojas yra savarankiškas vežėjas. Jis nėra Ridu darbuotojas ar atstovas ir negali veikti Ridu vardu.</p>"},{"h":"8. Vaikų kelionės","html":"<ul><li>Prieš pirmą vaiko kelionę klientas ir vairuotojas susitinka.</li><li>Vaikas perduodamas tik sutartyje nurodytam suaugusiajam ar įstaigai, nebent tėvai raštu leido paleisti vaiką vieną.</li><li>Klientas nurodo vaiko ūgį ir amžių, kad būtų parinkta tinkama kėdutė.</li><li>Ridu nesprendžia tėvų ginčų. Jei vaiką užsako vienas iš tėvų, jis atsako už tai, kad turi teisę tai daryti.</li></ul>"},{"h":"9. Draudžiama","html":"<p>Platformoje draudžiama:</p><ul><li>apsimesti kitu asmeniu, naudoti svetimas ar suklastotas nuotraukas, leidimus ar dokumentus;</li><li>vežti be galiojančio leidimo ar kitu automobiliu nei nurodytas leidime;</li><li>prašyti išankstinio mokėjimo prieš pirmą susitikimą ar kelionę, siųsti mokėjimo nuorodas, prašyti kodų ar banko duomenų;</li><li>skelbti netikras užklausas ar pasiūlymus, rinkti kitų naudotojų duomenis, juos kopijuoti ar naudoti reklamai;</li><li>kurti kelias paskyras, naudotis užblokuoto asmens paskyra ar perleisti paskyrą kitam;</li><li>grasinti, įžeidinėti, priekabiauti, diskriminuoti ar elgtis smurtiškai;</li><li>siūlyti ar prašyti neteisėtų paslaugų, pavyzdžiui, vežti draudžiamus daiktus;</li><li>naudoti robotus, automatinį duomenų rinkimą ar bandyti pažeisti sistemos saugumą;</li><li>rašyti netikrus atsiliepimus.</li></ul><p>Daugiau patarimų rasite skiltyje „Saugumas ir draudžiamas elgesys“.</p>"},{"h":"10. Pranešimai apie pažeidimus","html":"<p>Apie neteisėtą turinį ar elgesį praneškite mygtuku „Pranešti“ pokalbyje ar profilyje arba el. paštu info@ridu.lt. Nurodykite, kas ir kodėl yra pažeidimas, ir kur jį rasti.</p><p>Pranešimus peržiūrime nedelsdami, o skubius (susijusius su vaikų ar žmonių saugumu) – pirmiausia. Pranešusiam asmeniui pranešame, ką nusprendėme.</p><p>Jei yra grėsmė žmogaus gyvybei ar saugumui, skambinkite 112. Apie tokius atvejus taip pat informuojame teisėsaugą.</p>"},{"h":"11. Ką Ridu gali daryti dėl pažeidimų","html":"<p>Pagal pažeidimo sunkumą galime:</p><ul><li>įspėti;</li><li>paslėpti ar pašalinti užklausą, pasiūlymą, nuotrauką ar žinutę;</li><li>laikinai apriboti paskyrą ar jos matomumą;</li><li>sustabdyti paskyrą, kol išsiaiškinsime aplinkybes;</li><li>panaikinti paskyrą ir neleisti kurti naujos.</li></ul><p>Kiekvieną sprendimą paaiškiname: kas nuspręsta, kodėl, kuo remtasi ir kaip jį apskųsti. Išimtis – kai teisėsauga prašo neinformuoti.</p><p>Vairuotojo paskyrą visam laikui panaikiname įspėję prieš 30 dienų. Iš karto galime veikti, jei to reikalauja teisės aktai, jei yra grėsmė žmonių saugumui, sukčiavimas, suklastoti dokumentai, negaliojantis leidimas ar pakartotiniai pažeidimai.</p><p>Apie galimai neteisėtą veiklą, pavyzdžiui, suklastotus dokumentus ar sukčiavimą, galime pranešti LTSA, policijai ar kitoms institucijoms.</p>"},{"h":"12. Mokami planai","html":"<ul><li>Planai Plus ir Pro yra mėnesio prenumerata. Kaina nurodoma prieš užsakant, su PVM, jei jis taikomas.</li><li>Prenumerata pratęsiama automatiškai kas mėnesį, kol ją atšauksite. Atšaukti galite bet kada skiltyje „Planai“, ir ji baigsis apmokėto laikotarpio pabaigoje.</li><li>Klientas vartotojas per 14 dienų nuo užsakymo gali atsisakyti plano mygtuku „Atsisakyti sutarties“ be priežasties. Jei paprašėte, kad planas veiktų iš karto, grąžiname sumą, proporcingą nepanaudotam laikui.</li><li>Kainas galime keisti įspėję prieš 30 dienų. Jei nesutinkate, galite atšaukti prenumeratą.</li><li>Plano mokestis yra mokestis Ridu už platformos funkcijas. Tai nėra mokestis už keliones ir nesuteikia teisės į keliones.</li></ul>"},{"h":"13. Atsakomybė","html":"<p>Ridu atsako už platformos veikimą ir už tai, kad laikytųsi šių taisyklių ir teisės aktų.</p><p>Ridu neatsako už:</p><ul><li>vežimą, jo kokybę, vėlavimą, kelionės metu padarytą žalą ar sužalojimą: už tai atsako vežėjas ir jo draudikas;</li><li>sutartis tarp kliento ir vairuotojo, jų vykdymą ir mokėjimus;</li><li>naudotojų pateiktą informaciją, kurios neteisėtumo nežinojome; sužinoję tokią informaciją nedelsiant pašaliname;</li><li>trumpus platformos veikimo sutrikimus dėl priežiūros ar nuo mūsų nepriklausančių aplinkybių.</li></ul><p>Jei Ridu atsako už žalą, atsakomybė ribojama suma, kurią per paskutinius 12 mėnesių sumokėjote Ridu, bet ne mažiau kaip 100 €. Šis ribojimas netaikomas, jei žala padaryta tyčia ar dėl didelio neatsargumo, jei sužalota gyvybė ar sveikata, ir kitais atvejais, kai įstatymas neleidžia riboti atsakomybės.</p><p>Šios taisyklės neriboja teisių, kurias vartotojams suteikia įstatymai.</p>"},{"h":"14. Vairuotojo atsakomybė Ridu","html":"<p>Jei trečiasis asmuo ar institucija pareiškia Ridu reikalavimą dėl to, kad vairuotojas pažeidė šias taisykles ar įstatymus (pavyzdžiui, vežė be leidimo ar draudimo), vairuotojas atlygina Ridu dėl to patirtus nuostolius ir pagrįstas teisines išlaidas.</p>"},{"h":"15. Turinys ir nuotraukos","html":"<p>Įkeltos nuotraukos ir tekstai lieka jūsų. Įkeldami suteikiate Ridu teisę juos rodyti kitiems naudotojams platformoje, kol turite paskyrą. Įkelkite tik tai, ką turite teisę skelbti.</p>"},{"h":"16. Skundai ir ginčai","html":"<ul><li>Skundą dėl Ridu sprendimo ar paslaugos galite pateikti per 6 mėnesius mygtuku „Pateikti skundą“ arba el. paštu info@ridu.lt. Atsakome per 14 dienų.</li><li>Klientas vartotojas, jei nesutariame, gali kreiptis į Valstybinę vartotojų teisių apsaugos tarnybą (vvtat.lrv.lt).</li><li>Ginčus su vairuotoju dėl kelionės sprendžiate tiesiogiai su juo. Ridu gali padėti susisiekti ir pateikti pokalbio istoriją, jei to prašo institucija ar teismas.</li><li>Taikoma Lietuvos Respublikos teisė. Ginčai sprendžiami Lietuvos teismuose. Vartotojai išsaugo visas savo gyvenamosios šalies įstatymų suteiktas apsaugas.</li></ul>"},{"h":"17. Taisyklių keitimas","html":"<p>Apie pakeitimus pranešame programėlėje ir el. paštu ne vėliau kaip prieš 15 dienų. Jei pakeitimai jums nepriimtini, galite nutraukti naudojimąsi ir ištrinti paskyrą. Skubiai keisti galime tik tada, kai to reikalauja įstatymas ar saugumas.</p>"},{"h":"18. Paskyros ištrynimas","html":"<p>Paskyrą galite ištrinti bet kada nustatymuose. Kai kuriuos duomenis saugome ilgiau, jei to reikia pagal įstatymą ar ginčui spręsti (žr. Privatumo politiką).</p>"},{"h":"19. Kalba","html":"<p>Taisyklės pateikiamos lietuvių ir anglų kalbomis. Jei tarp jų yra skirtumų, vadovaujamasi lietuviška versija.</p>"}]},"privacy":{"t":"Ridu privatumo politika","v":"2026-11-25","sections":[{"h":"1. Kas tvarko jūsų duomenis","html":"<p>Duomenų valdytojas: MB „Įmonių veiklos analizė“, įmonės kodas 307404233, buveinė Giedraičių g. 39, R53, LT-09302 Vilnius, tel. +370 649 94125, el. paštas info@ridu.lt. Klausimais apie duomenis rašykite info@ridu.lt.</p>"},{"h":"2. Kokius duomenis renkame","html":"<p>Visų naudotojų:</p><ul><li>vardą, el. paštą, telefono numerį, prisijungimo ir saugumo duomenis (pvz. prisijungimo laiką, įrenginio tipą, IP adresą);</li><li>žinutes, pasiūlymus ir susitarimus pokalbiuose;</li><li>pranešimus apie pažeidimus ir skundus;</li><li>plano ir mokėjimo už planą informaciją (banko kortelės duomenų nesaugome, juos tvarko mokėjimų paslaugų teikėjas).</li></ul><p>Klientų:</p><ul><li>kelionių adresus, iš kurių nustatome pašto kodą, laiką ir dienas;</li><li>keleivių skaičių, tipą (vaikas, suaugęs, senjoras), vaiko amžių ar ūgį, jei reikia kėdutės, ir pastabas vairuotojui.</li></ul><p>Vairuotojų:</p><ul><li>tapatybės ir gyvumo patikros rezultatą ir laiką (žr. 4 skyrių „Tapatybės ir gyvumo patikra“);</li><li>vardą, pavardę, veiklos pažymos numerį, LTSA leidimo numerį, automobilio valstybinį numerį ir patikros rezultatą;</li><li>savo ir automobilio nuotraukas.</li></ul><p>Mes nerenkame sveikatos duomenų ir nesaugome dokumentų kopijų, selfių ar biometrinių duomenų. Pastabose prašome nerašyti daugiau, nei reikia kelionei.</p>"},{"h":"3. Kam ir kuo remdamiesi naudojame","html":"<table><thead><tr><th>Tikslas</th><th>Teisinis pagrindas</th></tr></thead><tbody><tr><td>Paskyra, užklausos, pasiūlymai, pokalbiai</td><td>Sutarties vykdymas (BDAR 6 str. 1 d. b p.)</td></tr><tr><td>Vairuotojų LTSA leidimo ir nuotraukų patikra</td><td>Teisėtas interesas užtikrinti saugumą ir išvengti sukčiavimo (f p.)</td></tr><tr><td>Vairuotojo tapatybės ir gyvumo patikra per Didit (biometriniai duomenys)</td><td>Aiškus sutikimas (BDAR 9 str. 2 d. a p.); jo nedavus galima rinktis vaizdo skambutį su Ridu</td></tr><tr><td>Sukčiavimo, pažeidimų prevencija, pranešimų nagrinėjimas</td><td>Teisėtas interesas (f p.) ir teisinė prievolė pagal Skaitmeninių paslaugų aktą (c p.)</td></tr><tr><td>Mokami planai, sąskaitos, apskaita</td><td>Sutarties vykdymas ir teisinė prievolė (b ir c p.)</td></tr><tr><td>Atsakymai institucijoms (pvz. teisėsaugai, VMI)</td><td>Teisinė prievolė (c p.)</td></tr><tr><td>Naujienos el. paštu</td><td>Jūsų sutikimas (a p.), jį galite atšaukti bet kada</td></tr></tbody></table><p>Automatizuotų sprendimų, kurie jums turėtų teisinių pasekmių, nepriimame. Paskyrų apribojimus visada peržiūri žmogus.</p>"},{"h":"4. Kas mato jūsų duomenis","html":"<ul><li>Kiti naudotojai mato tik tiek, kiek reikia susitarti. Kol klientas nesutinka kontaktuoti, vairuotojas mato tik pašto kodą, laiką ir keleivių skaičių. Tikslų adresą vairuotojas mato tik kai klientas juo pasidalina pokalbyje.</li><li>Klientai mato vairuotojo vardą, patvirtintas nuotraukas ir patikros ženklelį. Leidimo numerio klientams nerodome.</li><li>Paslaugų teikėjai, kurie mums padeda: duomenų saugojimas ir serveriai (Supabase, Vercel), vairuotojų tapatybės ir gyvumo patikra (Didit), el. laiškų siuntimas, mokėjimai už planus. Jie duomenis tvarko tik mūsų nurodymu pagal sutartis.</li><li>Institucijos, jei to reikalauja įstatymas (pvz. teisėsauga, LTSA, VMI).</li></ul><p>Duomenis saugome Europos Sąjungoje. Jei paslaugų teikėjas duomenis perduoda už ES ribų, taikomos Europos Komisijos patvirtintos apsaugos priemonės (pvz. standartinės sutarčių sąlygos).</p>"},{"h":"4a. Tapatybės ir gyvumo patikra","html":"<p>Vairuotojo tapatybę tikriname per Didit (didit.me). Registruojantis vairuotojas nufotografuoja asmens dokumentą ir save. Vėliau, pavyzdžiui kas 7 dienas, prieš pirmą kelionę su nauju klientu, atsitiktinai ar pastebėjus rizikos ženklą, Didit trumpai patikrina, ar prie telefono yra tas pats gyvas žmogus.</p><p>Vaizdą ir dokumentą tvarko Didit kaip mūsų duomenų tvarkytojas. Ridu jų negauna ir nesaugo. Mes išsaugome tik rezultatą (patvirtinta ar ne) ir laiką.</p><p>Veido atvaizdo palyginimas yra biometrinių duomenų tvarkymas, todėl prieš patikrą prašome jūsų aiškaus sutikimo. Sutikimą galite atšaukti. Jei nesutinkate, tapatybę galima patvirtinti vaizdo skambučiu su Ridu.</p><p>Po 2 nesėkmingų bandymų profilis paslepiamas, kol administratorius peržiūri atvejį. Sprendimą visada priima žmogus.</p>"},{"h":"5. Kiek laiko saugome","html":"<ul><li>Paskyros duomenis – kol turite paskyrą.</li><li>Užklausas ir pokalbius – 12 mėnesių po paskutinės žinutės, kad būtų galima išspręsti ginčus.</li><li>Tikslius adresus – kol galioja užklausa, vėliau lieka tik pašto kodas.</li><li>Tapatybės ir gyvumo patikros rezultatus ir laiką – kol galioja vairuotojo paskyra, o nesėkmingus – 3 metus.</li><li>Duomenis apie pažeidimus, užblokuotas paskyras ir sukčiavimą – 3 metus.</li><li>Apskaitos dokumentus – 10 metų, kaip reikalauja įstatymas.</li><li>Ištrynus paskyrą duomenys ištrinami per 30 dienų, išskyrus tuos, kuriuos privalome saugoti ilgiau.</li></ul>"},{"h":"6. Vaikų duomenys","html":"<p>Vaikai paskyrų nekuria. Vaiko duomenis pateikia tėvai ar kiti teisėti atstovai ir tik tiek, kiek reikia saugiai kelionei: amžių ar ūgį kėdutei, vardą perdavimui. Vaiko duomenys vairuotojui rodomi tik po kliento sutikimo kontaktuoti.</p>"},{"h":"7. Jūsų teisės","html":"<p>Jūs galite:</p><ul><li>gauti savo duomenų kopiją;</li><li>ištaisyti netikslius duomenis;</li><li>ištrinti duomenis ar paskyrą;</li><li>apriboti duomenų tvarkymą ar jam prieštarauti;</li><li>gauti duomenis perkeliamu formatu;</li><li>atšaukti sutikimą.</li></ul><p>Rašykite info@ridu.lt. Atsakome per 1 mėnesį. Jei manote, kad pažeidėme jūsų teises, galite kreiptis į Valstybinę duomenų apsaugos inspekciją (vdai.lrv.lt).</p>"},{"h":"8. Saugumas","html":"<p>Naudojame šifruotą ryšį, prieigos ribojimą duomenų bazėje, dviejų veiksnių prisijungimą vairuotojams ir administravimui. Darbuotojai mato tik tai, ko reikia jų darbui.</p>"},{"h":"9. Slapukai","html":"<p>Naudojame tik būtinus slapukus prisijungimui ir saugumui. Statistikos ar reklamos slapukus naudotume tik gavę jūsų sutikimą.</p>"},{"h":"10. Pakeitimai","html":"<p>Apie esminius šios politikos pakeitimus pranešime programėlėje.</p>"},{"h":"11. Kalba","html":"<p>Politika pateikiama lietuvių ir anglų kalbomis. Jei tarp jų yra skirtumų, vadovaujamasi lietuviška versija.</p>"}]},"safety":{"t":"Saugumas ir draudžiamas elgesys","v":"2026-11-25","sections":[{"h":"Kaip apsisaugoti nuo apgaulės","html":"<ul><li>Nemokėkite iš anksto nepažįstamam žmogui prieš pirmą susitikimą ar kelionę.</li><li>Nespauskite mokėjimo nuorodų, gautų žinutėmis. Ridu neima mokesčio už keliones.</li><li>Niekam nesakykite prisijungimo kodo, slaptažodžio ar banko duomenų. Ridu jų niekada neprašo.</li><li>Bendraukite Ridu pokalbyje, kol susitariate. Tada lieka susirašinėjimo istorija, jei kiltų ginčas.</li><li>Patikrinkite, ar automobilis ir vairuotojas atitinka nuotraukas. Jei ne, nesėskite ir praneškite mums.</li><li>Prieš pirmą vaiko kelionę susitikite su vairuotoju.</li><li>Sutartį sudarykite raštu. Joje įrašykite vairuotojo vardą, pavardę ir veiklos pažymos numerį.</li></ul>"},{"h":"Kas draudžiama","html":"<ul><li>Apsimesti kitu, naudoti svetimas nuotraukas ar suklastotus dokumentus.</li><li>Vežti be galiojančio LTSA leidimo ar kitu automobiliu.</li><li>Prašyti išankstinio mokėjimo, kodų ar banko duomenų.</li><li>Skelbti netikras užklausas, pasiūlymus ar atsiliepimus.</li><li>Kurti kelias paskyras ar naudotis užblokuoto asmens paskyra.</li><li>Grasinti, įžeidinėti, priekabiauti ar diskriminuoti.</li><li>Rinkti kitų naudotojų duomenis ar naudoti juos kitiems tikslams.</li></ul>"},{"h":"Kas nutinka pažeidus","html":"<p>Pagal pažeidimą įspėjame, paslepiame turinį, apribojame ar panaikiname paskyrą. Sukčiavimo ir suklastotų dokumentų atvejais paskyrą sustabdome iš karto ir galime pranešti policijai ar LTSA. Kiekvieną sprendimą paaiškiname, o jį galite apskųsti.</p>"},{"h":"Kaip pranešti","html":"<p>Spauskite „Pranešti“ pokalbyje ar profilyje. Jei kyla grėsmė žmogaus gyvybei ar saugumui, skambinkite 112.</p>"}]}},"en":{"terms":{"t":"Ridu Terms of Use","v":"2026-11-25","sections":[{"h":"1. What Ridu is","html":"<p>Ridu is an online search platform. It helps people who need a ride for themselves, a child or a relative (clients) find drivers who hold an LTSA ride-hailing permit (drivers) and come to an agreement with them.</p><p>The platform is operated by MB „Įmonių veiklos analizė“, company code 307404233, registered office Giedraičių g. 39, R53, LT-09302 Vilnius, Lithuania, phone +370 649 94125, email info@ridu.lt (Ridu, we).</p><p>Ridu does not carry passengers, set prices, accept payments for rides or assign drivers. The ride contract is concluded directly between the client and the driver. Ridu is not a party to that contract and is not responsible for its performance.</p>"},{"h":"2. Who may use Ridu","html":"<ul><li>Only adults (18 or older) with full legal capacity may use Ridu. Children do not create accounts: parents or other legal guardians book for them.</li><li>One person may have only one client account and one driver account.</li><li>When registering, you provide true data about yourself and keep it up to date.</li><li>Only a person who holds a valid LTSA ride-hailing permit naming the vehicle, a driving licence and a registered business activity (for example, self-employment) may be a driver. Drivers deal with clients as traders.</li></ul>"},{"h":"3. Account and security","html":"<ul><li>Keep your login details safe and do not share them. You are responsible for actions in your account.</li><li>If you think someone accessed your account without your knowledge, change your login at once and tell us.</li><li>Ridu will never ask for your password, verification code or bank details by message or phone.</li></ul>"},{"h":"4. How search and agreement work","html":"<ol><li>The client posts a request. Other users see only the postal code, time and number of passengers, not the exact address or name.</li><li>Drivers respond with a price. A driver may also publish a regular route.</li><li>When the client agrees to be contacted, a chat opens. The client shares the exact address when they choose.</li><li>The parties agree on price, time, payment and other terms themselves and conclude a contract. A contract template is available on the Pro plan.</li></ol><p>Order of offers. Requests and offers are ordered by distance between postal codes, time and date posted. Requests and offers of Pro plan users may be shown higher. Such entries are marked “Boosted”. Ridu does not rate or rank drivers by how many rides they accept or decline.</p>"},{"h":"5. What the “Trusted and verified driver” badge means","html":"<p>The badge is given to a driver whose LTSA ride-hailing permit and linked vehicle we checked against public LTSA data and whose photos we reviewed. The check is made at registration and periodically afterwards.</p><p>The badge does not guarantee that a ride will go without problems. Talk to the driver before concluding a contract, and meet them in the case of a child.</p>"},{"h":"6. Client rights and obligations","html":"<p>The client has the right to:</p><ul><li>post requests free of charge within their plan, choose a driver or decline all offers;</li><li>end a chat and block a user at any time;</li><li>report a violation and receive a response.</li></ul><p>The client must:</p><ul><li>give correct information about the ride and passengers;</li><li>when booking for another adult, obtain their consent;</li><li>when booking for a child, be the child’s parent or other legal guardian or have their consent;</li><li>perform the contract concluded with the driver and pay the agreed price directly to the driver.</li></ul>"},{"h":"7. Driver rights and obligations","html":"<p>The driver has the right to:</p><ul><li>decide whether, when and how much to drive, what price to offer and which requests to skip;</li><li>work through other platforms or independently at the same time;</li><li>receive an explanation if their profile is restricted and appeal the decision.</li></ul><p>The driver must:</p><ul><li>carry passengers only with a valid LTSA ride-hailing permit and only in the vehicle named in it, and update their data on Ridu the same day the permit expires or the vehicle changes;</li><li>hold valid compulsory motor third-party liability insurance suitable for carrying passengers for payment, and keep the vehicle roadworthy with a valid technical inspection;</li><li>carry children only in suitable child seats or boosters as required by the Road Traffic Rules;</li><li>follow the Road Traffic Rules and rest requirements, and never drive tired or impaired;</li><li>declare income and pay taxes themselves;</li><li>give clients who are consumers all information required by law: name, surname, business certificate number, contact details, price and terms;</li><li>use only their own photos and real photos of the vehicle;</li><li>complete an identity and liveness check when Ridu asks (at registration, periodically, before the first ride with a new client, at random or when there is a risk signal). After 2 failed attempts the profile is hidden until an administrator reviews the case. The driver may ask to confirm identity by video call and may appeal the decision.</li></ul><p>The driver is an independent carrier. The driver is not an employee or representative of Ridu and may not act on Ridu’s behalf.</p>"},{"h":"8. Rides for children","html":"<ul><li>Before a child’s first ride, the client and the driver meet.</li><li>A child is handed over only to the adult or institution named in the contract, unless the parents allowed in writing that the child may leave alone.</li><li>The client states the child’s height and age so that a suitable seat is used.</li><li>Ridu does not resolve disputes between parents. A parent who books for a child is responsible for having the right to do so.</li></ul>"},{"h":"9. Prohibited conduct","html":"<p>On the platform it is prohibited to:</p><ul><li>impersonate another person or use someone else’s or forged photos, permits or documents;</li><li>carry passengers without a valid permit or in a vehicle other than the one named in the permit;</li><li>ask for advance payment before the first meeting or ride, send payment links, or ask for codes or bank details;</li><li>post fake requests or offers, collect other users’ data, copy it or use it for advertising;</li><li>create several accounts, use a blocked person’s account or transfer an account to someone else;</li><li>threaten, insult, harass, discriminate or behave violently;</li><li>offer or request illegal services, such as carrying prohibited items;</li><li>use bots or automated data collection, or attempt to breach system security;</li><li>write fake reviews.</li></ul><p>More tips are in “Safety and prohibited conduct”.</p>"},{"h":"10. Reporting violations","html":"<p>Report illegal content or conduct with the “Report” button in the chat or profile, or by email at info@ridu.lt. Say what the violation is, why, and where to find it.</p><p>We review reports without delay, urgent ones (concerning the safety of children or people) first. We tell the person who reported what we decided.</p><p>If someone’s life or safety is at risk, call 112. We also inform law enforcement of such cases.</p>"},{"h":"11. What Ridu may do about violations","html":"<p>Depending on how serious the violation is, we may:</p><ul><li>give a warning;</li><li>hide or remove a request, offer, photo or message;</li><li>temporarily restrict an account or its visibility;</li><li>suspend an account while we clarify the circumstances;</li><li>close an account and refuse a new one.</li></ul><p>We explain every decision: what was decided, why, on what basis and how to appeal. The exception is where law enforcement asks us not to inform.</p><p>We close a driver account permanently with 30 days’ notice. We may act at once where the law requires it, where people’s safety is at risk, or in cases of fraud, forged documents, an invalid permit or repeated violations.</p><p>We may report possibly illegal activity, such as forged documents or fraud, to LTSA, the police or other authorities.</p>"},{"h":"12. Paid plans","html":"<ul><li>Plus and Pro are monthly subscriptions. The price is shown before ordering, including VAT where it applies.</li><li>The subscription renews automatically each month until you cancel it. You may cancel at any time in “Plans”, and it ends at the end of the paid period.</li><li>A client who is a consumer may withdraw from the plan within 14 days of ordering without giving a reason, using the “Withdraw from contract” button. If you asked for the plan to start at once, we refund the amount for the unused time.</li><li>We may change prices with 30 days’ notice. If you disagree, you may cancel the subscription.</li><li>The plan fee is a fee to Ridu for platform features. It is not a fee for rides and gives no right to rides.</li></ul>"},{"h":"13. Liability","html":"<p>Ridu is responsible for the operation of the platform and for complying with these terms and the law.</p><p>Ridu is not responsible for:</p><ul><li>the ride, its quality, delays, or damage or injury during the ride: the carrier and their insurer are responsible for that;</li><li>contracts between client and driver, their performance and payments;</li><li>information posted by users whose illegality we were not aware of; once we become aware of such information, we remove it without delay;</li><li>short platform outages due to maintenance or circumstances beyond our control.</li></ul><p>Where Ridu is liable for damage, liability is limited to the amount you paid Ridu in the last 12 months, but not less than 100 €. This limit does not apply to damage caused intentionally or by gross negligence, to harm to life or health, or in other cases where the law does not allow liability to be limited.</p><p>These terms do not limit the rights that the law gives consumers.</p>"},{"h":"14. Driver’s liability to Ridu","html":"<p>If a third party or authority brings a claim against Ridu because a driver breached these terms or the law (for example, drove without a permit or insurance), the driver compensates Ridu for the resulting losses and reasonable legal costs.</p>"},{"h":"15. Content and photos","html":"<p>Photos and texts you upload remain yours. By uploading them, you allow Ridu to show them to other users on the platform for as long as you have an account. Upload only what you have the right to publish.</p>"},{"h":"16. Complaints and disputes","html":"<ul><li>You may submit a complaint about a Ridu decision or service within 6 months using the “Submit a complaint” button or by email at info@ridu.lt. We reply within 14 days.</li><li>A client who is a consumer may, if we cannot agree, apply to the State Consumer Rights Protection Authority of Lithuania (vvtat.lrv.lt).</li><li>Disputes with a driver about a ride are settled directly with the driver. Ridu may help to get in touch and provide the chat history if an authority or court asks for it.</li><li>Lithuanian law applies. Disputes are settled in Lithuanian courts. Consumers keep all protections given by the laws of their country of residence.</li></ul>"},{"h":"17. Changes to the terms","html":"<p>We announce changes in the app and by email at least 15 days in advance. If you do not accept the changes, you may stop using Ridu and delete your account. We may change the terms urgently only where the law or safety requires it.</p>"},{"h":"18. Deleting your account","html":"<p>You may delete your account at any time in settings. We keep some data longer where the law or a dispute requires it (see the Privacy Policy).</p>"},{"h":"19. Language","html":"<p>These terms are available in Lithuanian and English. If the versions differ, the Lithuanian version prevails.</p>"}]},"privacy":{"t":"Ridu Privacy Policy","v":"2026-11-25","sections":[{"h":"1. Who processes your data","html":"<p>Data controller: MB „Įmonių veiklos analizė“, company code 307404233, registered office Giedraičių g. 39, R53, LT-09302 Vilnius, Lithuania, phone +370 649 94125, email info@ridu.lt. For questions about your data, write to info@ridu.lt.</p>"},{"h":"2. What data we collect","html":"<p>From all users:</p><ul><li>name, email, phone number, login and security data (such as login time, device type, IP address);</li><li>messages, offers and agreements in chats;</li><li>reports of violations and complaints;</li><li>plan and plan payment information (we do not store card details; the payment service provider handles them).</li></ul><p>From clients:</p><ul><li>ride addresses, from which we derive the postal code, time and days;</li><li>number and type of passengers (child, adult, senior), the child’s age or height if a seat is needed, and notes for the driver.</li></ul><p>From drivers:</p><ul><li>the result and time of the identity and liveness check (see section “Identity and liveness check”);</li><li>name, surname, business certificate number, LTSA permit number, vehicle registration number and the result of the check;</li><li>photos of themselves and the vehicle.</li></ul><p>We do not collect health data and do not store copies of documents, selfies or biometric data. Please write no more in notes than the ride needs.</p>"},{"h":"3. Why and on what basis we use it","html":"<table><thead><tr><th>Purpose</th><th>Legal basis</th></tr></thead><tbody><tr><td>Account, requests, offers, chats</td><td>Performance of a contract (GDPR Art. 6(1)(b))</td></tr><tr><td>Checking drivers’ LTSA permits and photos</td><td>Legitimate interest in safety and fraud prevention (Art. 6(1)(f))</td></tr><tr><td>Driver identity and liveness check via Didit (biometric data)</td><td>Explicit consent (GDPR Art. 9(2)(a)); without it, a video call with Ridu is available instead</td></tr><tr><td>Preventing fraud and violations, handling reports</td><td>Legitimate interest (f) and legal obligation under the Digital Services Act (c)</td></tr><tr><td>Paid plans, invoices, accounting</td><td>Performance of a contract and legal obligation (b and c)</td></tr><tr><td>Responding to authorities (e.g. law enforcement, tax authority)</td><td>Legal obligation (c)</td></tr><tr><td>News by email</td><td>Your consent (a), which you may withdraw at any time</td></tr></tbody></table><p>We do not make automated decisions with legal effects on you. A person always reviews account restrictions.</p>"},{"h":"4. Who sees your data","html":"<ul><li>Other users see only what is needed to agree. Until the client agrees to be contacted, the driver sees only the postal code, time and number of passengers. The driver sees the exact address only when the client shares it in the chat.</li><li>Clients see the driver’s first name, approved photos and the verification badge. We do not show the permit number to clients.</li><li>Service providers who help us: data storage and servers (Supabase, Vercel), driver identity and liveness checks (Didit), email delivery, plan payments. They process data only on our instructions under contracts.</li><li>Authorities, where the law requires (e.g. law enforcement, LTSA, the tax authority).</li></ul><p>We store data in the European Union. If a service provider transfers data outside the EU, safeguards approved by the European Commission apply (e.g. standard contractual clauses).</p>"},{"h":"4a. Identity and liveness check","html":"<p>We verify a driver’s identity through Didit (didit.me). At registration, the driver takes a photo of an identity document and of themselves. Later, for example every 7 days, before the first ride with a new client, at random or when we see a risk signal, Didit briefly checks that the same live person is at the phone.</p><p>Didit processes the image and the document as our data processor. Ridu does not receive or store them. We keep only the result (confirmed or not) and the time.</p><p>Comparing facial images is processing of biometric data, so we ask for your explicit consent before the check. You may withdraw consent. If you do not consent, your identity can be confirmed by a video call with Ridu.</p><p>After 2 failed attempts the profile is hidden until an administrator reviews the case. A person always makes the decision.</p>"},{"h":"5. How long we keep it","html":"<ul><li>Account data: for as long as you have an account.</li><li>Requests and chats: 12 months after the last message, so that disputes can be resolved.</li><li>Exact addresses: while the request is active; afterwards only the postal code remains.</li><li>Identity and liveness check results and times: while the driver account exists; failed ones for 3 years.</li><li>Data on violations, blocked accounts and fraud: 3 years.</li><li>Accounting documents: 10 years, as the law requires.</li><li>After you delete your account, data is deleted within 30 days, except data we must keep longer.</li></ul>"},{"h":"6. Children’s data","html":"<p>Children do not create accounts. A child’s data is provided by parents or other legal guardians, and only as much as a safe ride needs: age or height for the seat, first name for the handover. A child’s data is shown to the driver only after the client agrees to be contacted.</p>"},{"h":"7. Your rights","html":"<p>You may:</p><ul><li>get a copy of your data;</li><li>correct inaccurate data;</li><li>delete data or your account;</li><li>restrict or object to processing;</li><li>receive data in a portable format;</li><li>withdraw consent.</li></ul><p>Write to info@ridu.lt. We reply within 1 month. If you think we have breached your rights, you may complain to the State Data Protection Inspectorate of Lithuania (vdai.lrv.lt).</p>"},{"h":"8. Security","html":"<p>We use encrypted connections, access restrictions in the database, and two-factor login for drivers and administration. Staff see only what their work requires.</p>"},{"h":"9. Cookies","html":"<p>We use only cookies necessary for login and security. We would use statistics or advertising cookies only with your consent.</p>"},{"h":"10. Changes","html":"<p>We will announce material changes to this policy in the app.</p>"},{"h":"11. Language","html":"<p>This policy is available in Lithuanian and English. If the versions differ, the Lithuanian version prevails.</p>"}]},"safety":{"t":"Safety and prohibited conduct","v":"2026-11-25","sections":[{"h":"How to protect yourself from fraud","html":"<ul><li>Do not pay a stranger in advance before the first meeting or ride.</li><li>Do not click payment links received in messages. Ridu charges no fee for rides.</li><li>Never share your login code, password or bank details. Ridu never asks for them.</li><li>Keep talking in the Ridu chat until you agree. That way the conversation history stays if a dispute arises.</li><li>Check that the vehicle and driver match the photos. If they do not, do not get in and report it to us.</li><li>Meet the driver before a child’s first ride.</li><li>Make the contract in writing. Include the driver’s name, surname and business certificate number.</li></ul>"},{"h":"What is prohibited","html":"<ul><li>Impersonating someone, using someone else’s photos or forged documents.</li><li>Carrying passengers without a valid LTSA permit or in another vehicle.</li><li>Asking for advance payment, codes or bank details.</li><li>Posting fake requests, offers or reviews.</li><li>Creating several accounts or using a blocked person’s account.</li><li>Threatening, insulting, harassing or discriminating.</li><li>Collecting other users’ data or using it for other purposes.</li></ul>"},{"h":"What happens after a violation","html":"<p>Depending on the violation, we warn, hide content, restrict or close the account. In cases of fraud or forged documents we suspend the account at once and may inform the police or LTSA. We explain every decision, and you may appeal it.</p>"},{"h":"How to report","html":"<p>Tap “Report” in the chat or profile. If someone’s life or safety is at risk, call 112.</p>"}]}}};

/* ---------- i18n: LT -> EN ----------
   EN: tikslus lietuviškas tekstas -> anglų. EN_RX: dinaminiai tekstai.
   DOM vertėjas verčia tekstinius mazgus ir placeholder/aria-label/title po kiekvieno piešimo.
   Elementai su [data-noi18n] (pvz. teisinių dokumentų turinys) praleidžiami. */
const LT_ARR = {DAYS:[...DAYS], MON_N:[...MON_N], MON_G:[...MON_G], WDAY:[...WDAY], PTYPE:{...PTYPE}};
const EN_ARR = {DAYS:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
  MON_N:['January','February','March','April','May','June','July','August','September','October','November','December'],
  WDAY:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], PTYPE:{child:'Child', adult:'Adult', senior:'Senior'}};
EN_ARR.MON_G = EN_ARR.MON_N;
const I18N_ATTR = ['placeholder','aria-label','title'];
const MISS = new Set();
function trText(s){
  const k = s.replace(/\s+/g,' ').trim(); if(!k || !/[A-Za-zĄČĘĖĮŠŲŪŽąčęėįšųūž]/.test(k)) return null;
  let v = EN[k];
  if(v === undefined) for(const [re, f] of EN_RX){ if(re.test(k)){ v = k.replace(re, f); break; } }
  if(v === undefined && k.includes(' · ')){ let any=false; v = k.split(' · ').map(x => { const t=trText(x); if(t!==null){ any=true; return t; } return x; }).join(' · '); if(!any) v = undefined; }
  if(v === undefined){ MISS.add(k); return null; }
  return s.replace(/^(\s*)[\s\S]*?(\s*)$/, (m,a,b) => a + v + b);
}
const L = s => (LANG==='en' && s) ? (trText(s) ?? s) : s;
const skipNode = el => !el || el.closest('[data-noi18n],script,style,textarea');
function translate(root){
  if(LANG!=='en' || !root) return;
  const els = root.nodeType===1 ? [root, ...root.querySelectorAll('*')] : [];
  if(root.nodeType===3){ const p=root.parentElement; if(!skipNode(p)){ const v=trText(root.data); if(v!==null){ root.__lt ??= root.data; root.data=v; } } return; }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode(); n; n=w.nextNode()){ if(skipNode(n.parentElement)) continue; const v=trText(n.data); if(v!==null){ n.__lt ??= n.data; n.data=v; } }
  els.forEach(el => { if(skipNode(el)) return; I18N_ATTR.forEach(a => { const o=el.getAttribute(a); if(!o) return; const v=trText(o); if(v!==null){ if(!el.hasAttribute('data-lt-'+a)) el.setAttribute('data-lt-'+a, o); el.setAttribute(a, v); } }); });
}
function untranslate(){
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode(); n; n=w.nextNode()) if(n.__lt !== undefined){ n.data = n.__lt; delete n.__lt; }
  document.querySelectorAll('*').forEach(el => I18N_ATTR.forEach(a => { const o=el.getAttribute('data-lt-'+a); if(o!==null){ el.setAttribute(a,o); el.removeAttribute('data-lt-'+a); } }));
}
const obs = new MutationObserver(ms => { if(LANG!=='en') return; obs.disconnect();
  ms.forEach(m => { if(m.type==='characterData') translate(m.target); else m.addedNodes.forEach(translate); });
  obs.observe(document.body, {childList:true, subtree:true, characterData:true}); });
function setLang(l, save=true){
  LANG = l; if(save) try { localStorage.setItem('ridu-lang', l); } catch(e) {}
  const A = l==='en' ? EN_ARR : LT_ARR;
  DAYS.splice(0,7,...A.DAYS); MON_N.splice(0,12,...A.MON_N); MON_G.splice(0,12,...A.MON_G); WDAY.splice(0,7,...A.WDAY); Object.assign(PTYPE, A.PTYPE);
  document.documentElement.lang = l;
  const b = document.getElementById('lang'); b.textContent = l==='en' ? 'LT' : 'EN'; b.setAttribute('aria-label', l==='en' ? 'Lietuvių' : 'English'); b.title = b.getAttribute('aria-label');
  untranslate(); obs.disconnect();
  if(l==='en'){ translate(document.body); obs.observe(document.body, {childList:true, subtree:true, characterData:true}); }
}
document.getElementById('lang').addEventListener('click', () => { setLang(LANG==='en' ? 'lt' : 'en'); render(); });

"Registruodamasis vairuotojas patvirtina tapatybę dokumentu ir selfiu. Vėliau trumpai gyvumo patikrai jo prašome bent kas 7 dienas, prieš pirmą kelionę su nauju klientu ir atsitiktinai.": "At sign-up, drivers confirm their identity with an ID document and a selfie. After that, we ask for a short liveness check at least every 7 days, before the first trip with a new client, and at random.",
"Pasiūlyme matote, kada tapatybė patvirtinta paskutinį kartą. Jei patikra nepavyksta, profilis paslepiamas.": "The offer shows when identity was last confirmed. If a check fails, the profile is hidden.",
"Tikriname LTSA leidimo autentiškumą, su juo susietą automobilį ir jūsų tapatybę. Saugome tik numerį, patikros rezultatą ir datą. Dokumentų kopijų ir patikros vaizdo nesaugome.": "We check that your LTSA permit is genuine, the car linked to it, and your identity. We keep only the number, the check result and date. We do not keep document copies or check images.",
"Kas yra gyvumo patikra ir kada jos prašoma?": "What is the liveness check and when is it requested?",
"Tai apie 10 s trunkanti patikra telefono kamera: pažiūrite į kamerą, pasukate galvą ir mirktelite. Taip klientai žino, kad vairuoja tas pats žmogus.": "It is a check of about 10 s with your phone camera: look at the camera, turn your head and blink. This way clients know the same person is driving.",
"Prašome kas 7 dienas, prieš pirmą kelionę su nauju klientu, atsitiktinai maždaug 1 iš 10 darbo dienų ir prisijungus nauju įrenginiu, pakeitus nuotrauką ar automobilį arba po ilgesnės pertraukos.": "We ask every 7 days, before the first trip with a new client, at random on about 1 in 10 working days, and after signing in on a new device, changing your photo or car, or a longer break.",
"Kas, jei patikra nepavyksta?": "What if the check fails?",

"Dažniausi klausimai": "Frequently asked questions",
"Kaip veikia Ridu ir kodėl tai saugu.": "How Ridu works and why it's safe.",
"Ko reikia, kad galėtumėte vežti su Ridu.": "What you need to drive with Ridu.",
"LTSA svetainė": "LTSA website",
"Kodėl verta rinktis Ridu?": "Why choose Ridu?",
"Vairuotojai patikrinti, o jų veidą ir automobilį matote nuotraukose dar prieš susisiekdami.": "Drivers are verified, and you see their face and car in photos before you get in touch.",
"Kainą siūlo vairuotojai, o jūs pasirenkate. Komisinio nėra: mokate tik vairuotojui tiek, kiek susitarėte.": "Drivers offer a price and you choose. There's no commission: you pay the driver only what you agreed.",
"Pastoviam vežimui randate vieną žmogų, kuris veža kasdien tuo pačiu laiku.": "For regular trips you find one person who drives at the same time every day.",
"Kaip tikrinami vairuotojai?": "How are drivers checked?",
"Kiekvieno vairuotojo pavėžėjimo leidimą ir su juo susietą automobilį tikriname pagal Lietuvos transporto saugos administracijos (LTSA) duomenis.": "We check every driver's passenger transport permit and the car linked to it against Lithuanian Transport Safety Administration (LTSA) data.",
"Nuotraukas peržiūrime prieš jas parodant klientams. Tik praėję patikrą vairuotojai gauna ženklelį „Patikimas ir patikrintas vairuotojas“.": "We review photos before clients see them. Only drivers who pass the check get the “Trusted and verified driver” badge.",
"Kas yra LTSA pavėžėjimo leidimas ir kodėl jis svarbus?": "What is an LTSA permit and why does it matter?",
"Vežti keleivius už atlygį lengvuoju automobiliu galima tik turint LTSA išduotą leidimą. Jame nurodytas ir automobilis.": "Carrying passengers for payment in a car is only allowed with a permit issued by LTSA. The permit also names the car.",
"Leidimas reiškia, kad vežimas legalus, o vairuotojas ir automobilis žinomi valstybei.": "The permit means the transport is legal and the driver and car are known to the state.",
"Ar vairuotojas mato mano adresą ir telefoną?": "Can the driver see my address and phone number?",
"Ne. Vairuotojai mato tik pašto kodą. Vardą ir telefoną mato tik tada, kai sutinkate kontaktuoti, o tikslų adresą, kai juo pasidalinate pokalbyje.": "No. Drivers see only the postcode. They see your name and phone once you agree to be contacted, and the exact address once you share it in the chat.",
"Kas sudaro sutartį ir kaip mokama?": "Who makes the agreement and how is payment made?",
"Sutartį sudarote jūs ir vairuotojas. Ridu yra paieškos platforma ir nėra sutarties šalis.": "The agreement is between you and the driver. Ridu is a search platform and is not a party to it.",
"Už keliones mokate tiesiogiai vairuotojui taip, kaip susitarsite. Pro plane rasite paruoštą sutarties šabloną.": "You pay the driver directly, however you agree. The Pro plan includes a ready agreement template.",
"Kam reikalingas pažintinis susitikimas?": "Why is there an intro meeting?",
"Prieš pirmą vaiko kelionę susitinkate su vairuotoju. Vaikas pamato, kas jį veš, o jūs aptariate, kam ir kur vaiką perduoti.": "Before a child's first trip you meet the driver. The child sees who will drive them, and you agree who the child is handed over to and where.",
"Kaip veikia pastovus vežimas ir šventės?": "How do regular trips and holidays work?",
"Pasirenkate dienas, laiką ir laikotarpį. Švenčių dienomis kelionės praleidžiamos, jei taip pažymite.": "You choose the days, time and period. Trips on public holidays are skipped if you tick that option.",
"Kiek kainuoja Ridu?": "How much does Ridu cost?",
"Kaip apsisaugoti nuo apgaulės?": "How do I protect myself from scams?",
"Nemokėkite iš anksto prieš pirmą susitikimą ir nespauskite mokėjimo nuorodų žinutėse. Ridu neima mokesčio už keliones ir niekada neprašo kodų ar banko duomenų.": "Don't pay in advance before the first meeting and don't click payment links in messages. Ridu doesn't charge for trips and never asks for codes or bank details.",
"Patikrinkite, ar vairuotojas ir automobilis atitinka nuotraukas. Įtartiną elgesį praneškite mygtuku „Pranešti“ pokalbyje.": "Check that the driver and car match the photos. Report anything suspicious with the “Report” button in the chat.",
"Ką daryti, jei vairuotojas netinka?": "What if the driver isn't right for me?",
"Galite bet kada ieškoti kito vairuotojo. Pagal sutartį ją galima nutraukti įspėjus prieš 30 d., o dėl esminio pažeidimo – iš karto. Apie netinkamą elgesį parašykite mums info@ridu.lt, peržiūrėsime vairuotojo profilį.": "You can look for another driver at any time. Under the agreement you can end it with 30 days' notice, or immediately for a serious breach. Tell us about inappropriate behaviour at info@ridu.lt and we'll review the driver's profile.",

/* Administravimas pasiekiamas tik atskiru adresu (#admin), viešame perjungiklyje jo nėra */
function route(){
  const admin = location.hash === '#admin';
  document.querySelector('.seg').hidden = admin;
  if(admin){ S.role='owner'; S.open=null; }
  else if(S.role==='owner'){ S.role='client'; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.role==='client')); }
  render();
}
window.addEventListener('hashchange', route);
setLang(LANG, false);
route();
