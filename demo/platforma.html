<title>Ridu platforma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column under the brand header; bottom tab bar per role. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e8eeec; --fg:#14211f; --muted:#5b6b68; --line:#d5dedb;
  --brand:#0f4c45; --brand-fg:#ffffff; --accent:#f2b705; --accent-fg:#1e1a00;
  --ok:#1f7a4d; --ok-bg:#dcf2e6; --warn:#9a6300; --warn-bg:#fdf0cf; --bad:#b3261e; --bad-bg:#fbe1de; --info:#1d5b9a; --info-bg:#dde9f7;
  --shadow:0 10px 30px rgba(15,76,69,.16);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --surface-2:#1f2d2b; --fg:#e6efed; --muted:#9db0ac; --line:#2c3d3a;
  --brand:#5fc2b4; --brand-fg:#062420; --accent:#f5c53a; --accent-fg:#1e1a00;
  --ok:#6fd49c; --ok-bg:#163526; --warn:#f0c062; --warn-bg:#3a2e10; --bad:#f2958c; --bad-bg:#3d1916; --info:#8dbcf0; --info-bg:#172a40;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1f2d2b; --fg:#e6efed; --muted:#9db0ac; --line:#2c3d3a;
  --brand:#5fc2b4; --brand-fg:#062420; --accent:#f5c53a; --accent-fg:#1e1a00;
  --ok:#6fd49c; --ok-bg:#163526; --warn:#f0c062; --warn-bg:#3a2e10; --bad:#f2958c; --bad-bg:#3d1916; --info:#8dbcf0; --info-bg:#172a40;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-fg)}
header .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:10px}
.logo{display:flex;gap:10px;align-items:center}
.logo svg{width:32px;height:32px;display:block}
.logo h1{font-size:1.15rem}
.seg{display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:inherit;padding:5px 9px;border-radius:8px;font-size:.82rem;font-weight:600;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--brand-fg);color:var(--brand);opacity:1}
.note{background:var(--accent);color:var(--accent-fg);font-size:.8rem}
.note .wrap{padding-block:5px}
main .wrap{padding-block:16px 110px;display:grid;gap:14px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.ico{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
.ico svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--brand);color:var(--brand-fg);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.tag{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.info{background:var(--info-bg);color:var(--info)}
.tag .ico{width:15px;height:15px}
label.f{display:grid;gap:6px;font-weight:600;font-size:.9rem}
label.f input,label.f select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-weight:500;width:100%}
.fieldset{display:grid;gap:6px}
.fieldset > span{font-weight:600;font-size:.9rem}
.check{display:flex;gap:10px;align-items:center;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* swipe deck */
.deck{position:relative;height:440px;touch-action:pan-y}
.sw{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;user-select:none;transition:transform .25s ease}
.sw.back{transform:scale(.95) translateY(14px);filter:saturate(.8)}
.sw.dragging{transition:none}
.sw .top{position:relative;height:170px;display:flex;align-items:flex-end;padding:14px 16px;color:#fff}
.sw .top .av{position:absolute;right:16px;top:16px;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5)}
.sw .top h3{font-size:1.5rem;color:#fff}
.sw .top .sub{opacity:.9;font-size:.9rem}
.sw .body{padding:14px 16px;display:grid;gap:10px;align-content:start;flex:1;min-height:0;overflow:auto}
.facts{display:grid;gap:6px}
.facts div{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.facts .ico{color:var(--muted);width:18px;height:18px;margin-top:2px}
.fit{font-family:var(--display);font-weight:700;font-size:.95rem;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:4px 10px;position:absolute;left:16px;top:16px}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;border-radius:10px;font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.06em;opacity:0;transform:rotate(-12deg);background:var(--surface)}
.stamp.yes{left:18px;color:var(--ok);top:120px}
.stamp.no{right:18px;color:var(--bad);transform:rotate(12deg);top:120px}
.price{font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.actions{display:flex;justify-content:center;gap:18px;align-items:center}
.round{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.round .ico{width:28px;height:28px}
.round.no{color:var(--bad)} .round.yes{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.round.sm{width:44px;height:44px;box-shadow:none;color:var(--muted)} .round.sm .ico{width:20px;height:20px}
.empty{text-align:center;display:grid;gap:10px;place-items:center;padding:40px 16px;border:1px dashed var(--line);border-radius:20px;height:440px;align-content:center}
.empty .ico{width:40px;height:40px;color:var(--muted)}

/* list */
.list{display:grid;gap:10px}
.li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.li .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;flex:none}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block}
.li .grow span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* steps */
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-bottom:14px;position:relative}
.step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-weight:700;font-size:.85rem}
.step.done .dot{background:var(--ok);color:#fff}
.step.now .dot{background:var(--accent);color:var(--accent-fg)}
.dot .ico{width:16px;height:16px}
.chat{display:grid;gap:6px;max-height:220px;overflow:auto;padding:4px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--surface-2);font-size:.92rem}
.msg.me{justify-self:end;background:var(--brand);color:var(--brand-fg)}
.chatform{display:flex;gap:8px}
.chatform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.bottom .wrap{display:flex;justify-content:space-around}
nav.bottom button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:8px 6px;font-size:.74rem;font-weight:600;color:var(--muted);position:relative;flex:1}
nav.bottom button[aria-current="page"]{color:var(--brand)}
nav.bottom .badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--accent);color:var(--accent-fg);border-radius:999px;font-size:.68rem;padding:0 6px;font-weight:700}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(6,30,27,.72);display:grid;place-items:center;z-index:20;padding:20px}
.ov .card{max-width:380px;width:100%;text-align:center;justify-items:center;animation:pop .35s ease}
.pair{display:flex;align-items:center}
.pair .av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.5rem;border:3px solid var(--surface)}
.pair .av + .av{margin-left:-14px}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.doc{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.doc:first-of-type{border-top:0;padding-top:0}
.doc .grow{min-width:0}
.doc b{display:block;font-size:.93rem}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion: reduce){.sw,.ov .card{transition:none;animation:none}}
.offer{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface);max-width:92%}
.offer.me{justify-self:end;border-color:var(--brand)}
.offer.done{background:var(--ok-bg);border-color:transparent}
.offer.old{opacity:.55}
.offer .kv{display:flex;gap:14px;flex-wrap:wrap;font-size:.92rem}
.offer .kv b{font-family:var(--display);font-size:1.1rem}
.inline{display:grid;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ext{color:var(--info);font-weight:700;text-decoration:none;display:inline-flex;gap:4px;align-items:center;font-size:.88rem}
.ext .ico{width:15px;height:15px}
.pc{font-variant-numeric:tabular-nums;font-weight:700}
.vrow{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.vrow:first-of-type{border-top:0;padding-top:0}
.err{color:var(--bad);font-size:.85rem}
</style>

<header>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0f4c45" stroke="rgba(255,255,255,.35)"/><path d="M23 48 V31 C23 23 29 19 37 19 H40" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="19" r="6" fill="#f2b705"/></svg>

</header>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const reqOf = id => S.reqs.find(q=>q.id===id);
const offOf = id => S.offers.find(o=>o.id===id);
const convOf = id => S.conv[id] ??= {msgs:[], agreed:null, meetDone:false, confirmed:false};
const av = (letter, g, size=46) => `<span class="av" style="background:${grad(g)};width:${size}px;height:${size}px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;flex:none">${esc(letter)}</span>`;

const persona = o => reqOf(o.req).mine && o.driver===ME_DRIVER; // abi pusės valdomos demonstracijoje
const lastOpen = cv => [...cv.msgs].reverse().find(m => m.kind==='offer' && m.state==='open');

/* ---------- navigacija ---------- */
const TABS = {
  client:[['reqs','Užklausos','search'],['convs','Pokalbiai','msg']],
  driver:[['pool','Užklausos','search'],['sent','Pasiūlymai','send'],['convs','Pokalbiai','msg'],['check','Patikra','shield']],
  owner:[['verify','Patikra','shield']]
};
function badge(k){
  if(S.role==='client' && k==='reqs') return S.offers.filter(o=>reqOf(o.req).mine && o.status==='new').length;
  if(S.role==='client' && k==='convs') return clientConvs().filter(o=>{const m=lastOpen(convOf(o.id)); return m && m.by==='driver';}).length;
  if(S.role==='driver' && k==='convs') return driverConvs().filter(o=>{const m=lastOpen(convOf(o.id)); return m && m.by==='client';}).length;
  if(S.role==='owner' && k==='verify') return S.queue.reduce((n,p)=>n+Object.values(p.items).filter(i=>i.st==='rev').length,0);
  return 0;
}
function renderNav(){
  nav.innerHTML = TABS[S.role].map(([k,l,i]) => { const n=badge(k); return `<button data-tab="${k}" ${S.tab[S.role]===k?'aria-current="page"':''}>${ic(i)}<span>${l}</span>${n?`<span class="badge">${n}</span>`:''}</button>`; }).join('');
}
nav.addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; S.tab[S.role]=b.dataset.tab; S.open=null; S.newReq=false; render(); });
document.querySelector('.seg').addEventListener('click', e => {
  const b=e.target.closest('button'); if(!b) return; S.role=b.dataset.role; S.open=null; S.newReq=false;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render();
});
function render(){
  renderNav(); window.scrollTo({top:0});
  if(S.open?.kind==='conv') return renderConv(S.open.id);
  if(S.open?.kind==='req') return renderReq(S.open.id);
  const t = S.tab[S.role];
  if(S.role==='client') return t==='reqs' ? (S.newReq ? renderReqForm() : renderMyReqs()) : renderConvList();
  if(S.role==='driver') return t==='pool' ? renderPool() : t==='sent' ? renderSent() : t==='convs' ? renderConvList() : renderDriverCheck();
  return renderOwner();
}

}

  view.querySelector('#propose')?.addEventListener('click', showForm);
  view.querySelector('[data-counter]')?.addEventListener('click', showForm);
  view.querySelector('#co-cancel')?.addEventListener('click', ()=>{ form.hidden=true; });
  const coDays = open ? open.days.slice() : q.days.slice();
  view.querySelector('#co-days')?.addEventListener('click', e => { const b=e.target.closest('.chip'); if(!b) return; const v=Number(b.dataset.v), i=coDays.indexOf(v); i>=0?coDays.splice(i,1):coDays.push(v); coDays.sort((a,b)=>a-b); b.setAttribute('aria-pressed', i<0); });
  view.querySelector('#co-send')?.addEventListener('click', () => {
    const price = Number(view.querySelector('#co-price').value), time = view.querySelector('#co-time').value;
    if(!(price>0) || !time || (q.repeat && !coDays.length)){ toast('Įveskite kainą, laiką ir dienas'); return; }
    cv.msgs.forEach(m => { if(m.kind==='offer' && m.state==='open') m.state='old'; });
    cv.msgs.push({kind:'offer', by:me, price, time, days:coDays.slice(), state:'open'});
    render(); simulateReply(o);
  });
  view.querySelector('[data-accept]')?.addEventListener('click', () => {
    open.state='accepted'; cv.agreed={price:open.price, time:open.time, days:open.days};
    cv.msgs.push({by:me, t:'Sutinku su šiuo variantu.'}); toast('Susitarta'); render();
  });
  view.querySelector('#met')?.addEventListener('click', ()=>{ cv.meetDone=true; render(); });
  view.querySelector('#confirm')?.addEventListener('click', ()=>{ cv.confirmed=true; toast(q.repeat?'Abonementas patvirtintas':'Kelionė užsakyta'); render(); });
  const chat = view.querySelector('#chat'); chat.lastElementChild?.scrollIntoView({block:'nearest'});
}
/* Kita pusė atsako pati, jei jos nevaldome demonstracijoje */
function simulateReply(o){
  if(persona(o)) return;
  const cv = convOf(o.id), q = reqOf(o.req);
  setTimeout(() => {
    const open = lastOpen(cv); if(!open || cv.agreed) return;
    const replier = open.by==='client' ? 'driver' : 'client';
    const target = replier==='driver' ? o.price : open.price;
    if(open.price >= target*0.9 || cv.msgs.filter(m=>m.kind==='offer').length > 2){
      open.state='accepted'; cv.agreed={price:open.price, time:open.time, days:open.days};
      cv.msgs.push({by:replier, t:'Tinka, sutinku.'});
    } else {
      open.state='old';
      const mid = Math.round(((open.price + target)/2)*2)/2;
      cv.msgs.push({kind:'offer', by:replier, price:mid, time:open.time, days:open.days, state:'open'});
      cv.msgs.push({by:replier, t:'Gal susitinkame per vidurį?'});
    }
    refresh();
  }, 2500);
}

/* ---------- VAIRUOTOJAS: užklausų kaladė ---------- */
const driverOk = () => Object.values(S.verify[ME_DRIVER]).every(v=>v.st==='ok'||v.st==='warn');
function poolItems(){
  const me = drivers[ME_DRIVER];
  return S.reqs.filter(q => !S.skipped.includes(q.id) && !S.offers.some(o=>o.req===q.id && o.driver===ME_DRIVER)
    && me.zones.some(z => q.from.startsWith(z) || q.to.startsWith(z)) && (q.type!=='child' || me.child));
}
function poolCard(q, back){
  return `<article class="sw ${back?'back':''}" data-id="${q.id}" ${back?'aria-hidden="true"':''}>
    <div class="top" style="background:${grad(q.g)}">
      <span class="fit">${q.repeat?'Kartojasi':'Vienkartinė'}</span>
      <div class="av">${ic(q.type==='child'?'users':'car')}</div>
      <div><h3><span class="pc">${q.from}</span> → <span class="pc">${q.to}</span></h3><div class="sub">apie ${q.km} km</div></div>
    </div>
    <span class="stamp yes">SIŪLAUSI</span><span class="stamp no">PRALEISTI</span>
    <div class="body">
      <div class="facts">
        <div>${ic('clock')}<span>${when(q)}</span></div>
        <div>${ic('users')}<span>${paxTxt(q)}</span></div>
        ${q.note?`<div>${ic('msg')}<span>${esc(q.note)}</span></div>`:''}
      </div>
      <p class="muted small">Kliento vardą ir adresą matysite, kai klientas sutiks kontaktuoti.</p>
    </div>
  </article>`;
}
function renderPool(){
  if(!driverOk()){ view.innerHTML = `<div class="empty">${ic('lock')}<h3>Užbaikite patikrą</h3><p class="muted">Užklausas matysite, kai patvirtinsime jūsų duomenis.</p><button class="btn" id="goc">Į patikrą</button></div>`; view.querySelector('#goc').addEventListener('click',()=>{S.tab.driver='check'; render();}); return; }
  const items = poolItems();
  const head = `<div><h2>Užklausos jūsų zonoje</h2><p class="muted small">Zona: ${drivers[ME_DRIVER].zones.map(z=>z+'xxx').join(', ')}</p></div>`;
  if(!items.length){
    view.innerHTML = head + `<div class="empty">${ic('search')}<h3>Naujų užklausų nėra</h3><p class="muted">Pranešime, kai atsiras naujų. Klientas gali paskelbti užklausą ir dabar: perjunkite į „Klientas“.</p>${S.history.length?`<button class="btn ghost" id="undo">${ic('undo')} Grąžinti paskutinę</button>`:''}</div>`;
    view.querySelector('#undo')?.addEventListener('click', undo); return;
  }
  view.innerHTML = head + `<div class="deck" id="deck" style="height:400px">${items[1]?poolCard(items[1],true):''}${poolCard(items[0],false)}</div>
    <div class="actions">
      <button class="round sm" id="undo" aria-label="Grąžinti paskutinę" ${S.history.length?'':'disabled'}>${ic('undo')}</button>
      <button class="round no" id="no" aria-label="Praleisti">${ic('x')}</button>
      <button class="round yes" id="yes" aria-label="Siūlytis">${ic('send')}</button>
      <span style="width:44px"></span>
    </div>
    <p class="muted small" style="text-align:center">Braukite į dešinę, kad pasisiūlytumėte, į kairę, kad praleistumėte.</p>`;
  const top = view.querySelector('.sw:not(.back)'), q = items[0];
  bindSwipe(top, dir => dir>0 ? offerForm(q, top) : skip(q, top));
  view.querySelector('#no').addEventListener('click', ()=>skip(q, top));
  view.querySelector('#yes').addEventListener('click', ()=>offerForm(q, top));
  view.querySelector('#undo').addEventListener('click', undo);
}
function bindSwipe(el, done){
  let x0=null, dx=0;
  const yes=el.querySelector('.stamp.yes'), no=el.querySelector('.stamp.no');
  el.addEventListener('pointerdown', e => { if(e.button>0) return; x0=e.clientX; dx=0; el.setPointerCapture(e.pointerId); el.classList.add('dragging'); });
  el.addEventListener('pointermove', e => { if(x0===null) return; dx=e.clientX-x0; el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; yes.style.opacity=Math.max(0,Math.min(1,dx/100)); no.style.opacity=Math.max(0,Math.min(1,-dx/100)); });
  const end = () => { if(x0===null) return; x0=null; el.classList.remove('dragging');
    if(Math.abs(dx)>100) done(Math.sign(dx)); else { el.style.transform=''; yes.style.opacity=0; no.style.opacity=0; } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
document.addEventListener('keydown', e => {
  if(ovl.innerHTML){ if(e.key==='Escape') closeOv(); return; }
  if(!document.getElementById('deck') || e.target.matches('input,select,textarea')) return;
  if(e.key==='ArrowRight') document.getElementById('yes')?.click();
  if(e.key==='ArrowLeft') document.getElementById('no')?.click();
});
function fly(el, dir){ el.style.transform=`translateX(${dir*600}px) rotate(${dir*25}deg)`; el.querySelector(dir>0?'.stamp.yes':'.stamp.no').style.opacity=1; }
function skip(q, el){ fly(el,-1); S.skipped.push(q.id); S.history.push(q.id); setTimeout(render, 230); }
function undo(){ const id=S.history.pop(); if(!id) return; S.skipped=S.skipped.filter(x=>x!==id); render(); }
let ovReturn = null;
function closeOv(){ ovl.innerHTML=''; if(ovReturn){ const r=ovReturn; ovReturn=null; r(); } }
function offerForm(q, el){
  fly(el, 1);
  ovReturn = () => render();
  ovl.innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-labelledby="of-t"><form class="card" id="of" style="text-align:left;justify-items:stretch">
    <h2 id="of-t">Jūsų pasiūlymas</h2>
    <p class="muted small"><span class="pc">${q.from}</span> → <span class="pc">${q.to}</span> · ${when(q)} · ${paxTxt(q)}</p>
    <div class="two"><label class="f" for="of-price">Kaina už kelionę, €<input id="of-price" type="number" min="3" step="0.1" value="${Math.round((8.5 + q.km*0.25)*2)/2}"></label>
      <label class="f" for="of-time">Laikas<input id="of-time" type="time" value="${q.time}"></label></div>
    <p class="small muted" id="of-net"></p>
    <label class="f" for="of-note">Žinutė klientui (nebūtina)<input id="of-note" maxlength="100" placeholder="Pvz. galiu ir 15 min. anksčiau"></label>
    <div class="two"><button type="button" class="btn ghost" id="of-x">Atšaukti</button><button class="btn" type="submit">${ic('send')} Siųsti</button></div>
  </form></div>`;
  const price = ovl.querySelector('#of-price'), net = ovl.querySelector('#of-net');
  const upd = () => { net.textContent = `Klientas matys ${eur(Number(price.value)||0)}. Jūs gausite ${eur((Number(price.value)||0)*(1-COMMISSION))}.`; };
  upd(); price.addEventListener('input', upd); price.focus();
  ovl.querySelector('#of-x').addEventListener('click', closeOv);
  ovl.querySelector('#of').addEventListener('submit', e => {
    e.preventDefault();
    const o = {id:nid('o'), req:q.id, driver:ME_DRIVER, price:Number(price.value)||9, time:ovl.querySelector('#of-time').value||q.time, note:ovl.querySelector('#of-note').value.trim(), status:'new'};
    S.offers.push(o); ovReturn=null; ovl.innerHTML='';
    toast(q.mine ? 'Pasiūlymas išsiųstas. Perjunkite į „Klientas“, kad pamatytumėte' : 'Pasiūlymas išsiųstas klientui');
    if(!q.mine) setTimeout(() => { if(o.status!=='new') return; if(q.willContact){ startConv(o); cv_note(o); toast(`${q.client} sutiko kontaktuoti`); } else o.status='declined'; refresh(); }, 3500);
    render();
  });
}
function cv_note(o){ const q=reqOf(o.req); convOf(o.id).msgs.push({by:'client', t:`Sveiki, aš ${q.client}. Ar tikrai tinka ${q.time}?`}); }
function renderSent(){
  const list = myDriverOffers();
  const ST = {new:'<span class="tag warn">Laukia kliento</span>', contact:'<span class="tag ok">Pokalbis atvertas</span>', declined:'<span class="tag bad">Klientas pasirinko kitą</span>'};
  view.innerHTML = `<h2>Mano pasiūlymai</h2>${list.length ? `<div class="list">${list.map(o => { const q=reqOf(o.req);
    return `<button class="li" ${o.status==='contact'?`data-c="${o.id}"`:'disabled'}>${ic('send')}<span class="grow"><b><span class="pc">${q.from}</span> → <span class="pc">${q.to}</span> · ${eur(o.price)}</b><span>${when(q)} · ${paxTxt(q)}</span></span>${ST[o.status]}</button>`; }).join('')}</div>`
    : `<div class="empty" style="height:auto">${ic('send')}<h3>Dar nesiūlėte</h3><p class="muted">Peržiūrėkite užklausas ir pasisiūlykite.</p></div>`}`;
  view.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click', ()=>{ S.open={kind:'conv', id:b.dataset.c}; render(); }));
}

/* ---------- VAIRUOTOJAS: patikra be dokumentų kėlimo ---------- */
const VTAG = {ok:`<span class="tag ok">${ic('check')} Patvirtinta</span>`, warn:`<span class="tag warn">${ic('clock')} Baigiasi</span>`, rev:`<span class="tag info">${ic('clock')} Tikrinama</span>`, none:`<span class="tag bad">Trūksta</span>`, bad:`<span class="tag bad">Netiko</span>`};
function renderDriverCheck(){
  const v = S.verify[ME_DRIVER];
  const warn = Object.values(v).find(x=>x.st==='warn');
  view.innerHTML = `<h2>Patikra</h2>
    <div class="card" style="background:${driverOk()?'var(--ok-bg)':'var(--warn-bg)'};border:0"><div class="row">${ic('shield')}<b>${driverOk()?'Profilis matomas klientams':'Profilis paslėptas, kol vyksta patikra'}</b></div>
      ${warn?`<p class="small">${esc(warn.note)}. Pratęskite, kitaip profilis bus paslėptas.</p>`:''}</div>
    <p class="muted small">Dokumentų kelti nereikia. Įveskite numerius, o mes juos patikriname registruose. Saugome tik numerį, galiojimo datą ir patikros žymą.</p>
    <div class="card">${CHECKS.map(c => { const x = v[c.k] || {st:'none'};
      return `<div class="vrow"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><b>${c.t}</b><p class="muted small">${c.hint}</p></div>${VTAG[x.st]}</div>
        ${x.val?`<p class="small">${esc(x.val)}${x.until?` · galioja iki ${x.until}`:''}${x.at?` · patikrinta ${x.at}`:''}</p>`:''}
        ${x.how?`<p class="small">Patvirtinta per ${esc(x.how)}${x.at?` · ${x.at}`:''}</p>`:''}
        ${c.k!=='id' && x.st!=='rev' ? `<details><summary class="small" style="cursor:pointer;font-weight:700">${x.val?'Atnaujinti':'Įvesti'}</summary><form class="chatform" data-k="${c.k}" style="margin-top:8px"><input aria-label="${c.t}" placeholder="${c.ph}" id="v-${c.k}"><button class="btn">Siųsti</button></form></details>` : ''}
      </div>`; }).join('')}</div>`;
  view.querySelectorAll('form[data-k]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault(); const k=f.dataset.k, val=f.querySelector('input').value.trim(); if(!val){ toast('Įveskite numerį'); return; }
    v[k] = {st:'rev', val}; S.queue.unshift({driver:'Rimas', g:0, items:{[k]:{st:'rev', val}}, me:true});
    toast('Išsiųsta patikrai. Paprastai per 1 darbo dieną'); render();
  }));
}

/* ---------- MB: rankinės patikros įrankis ---------- */
function renderOwner(){
  view.innerHTML = `<h2>Vairuotojų patikra</h2>
    <p class="muted small">Tapatybė patvirtinama automatiškai per Smart-ID ar banką. Kitus punktus tikrinate patys pagal nuorodas: viešo API šiems registrams neradome. Išsaugomas tik numeris, galiojimo data ir kas bei kada patikrino.</p>
    ${S.queue.length ? S.queue.map((p,pi) => `<div class="card">
      <div class="row">${av(p.driver[0], p.g)}<div><h3>${esc(p.driver)}</h3><p class="muted small">${Object.values(p.items).filter(i=>i.st==='ok').length} iš ${Object.keys(p.items).length} patvirtinta</p></div></div>
      ${CHECKS.filter(c=>p.items[c.k]).map(c => { const it=p.items[c.k];
        return `<div class="vrow"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><b>${c.t}</b>
            <p class="small">${it.val?`<span class="pc">${esc(it.val)}</span>`:''}${it.how?`Per ${esc(it.how)}`:''}</p></div>${VTAG[it.st]}</div>
          ${it.st==='rev' ? `<div class="row">${c.url?`<a class="ext" href="${c.url}" target="_blank" rel="noopener">${ic('ext')} ${c.src.split(' (')[0]}</a>`:''}${c.url2?`<a class="ext" href="${c.url2}" target="_blank" rel="noopener">${ic('ext')} LDGB</a>`:''}</div>
            <div class="row" style="flex-wrap:nowrap">${c.until?`<label class="f" for="u-${pi}-${c.k}" style="flex:1">Galioja iki<input id="u-${pi}-${c.k}" type="date" value="2027-11-30"></label>`:'<span style="flex:1"></span>'}
              <button class="round sm" style="color:var(--bad)" data-a="bad" data-p="${pi}" data-k="${c.k}" aria-label="Netinka: ${c.t}">${ic('x')}</button>
              <button class="round sm" style="color:var(--ok)" data-a="ok" data-p="${pi}" data-k="${c.k}" aria-label="Patvirtinti: ${c.t}">${ic('check')}</button></div>
            ${c.k==='rep'?'<p class="muted small">Atidarykite patikrą, įveskite kodą ir pažymėkite rezultatą. Pačios pažymos nesaugome.</p>':''}` :
            it.until?`<p class="muted small">Galioja iki ${it.until} · patikrino MB ${TODAY}</p>`:''}
        </div>`; }).join('')}
      ${Object.values(p.items).every(i=>i.st==='ok') ? `<span class="tag ok" style="justify-self:start">${ic('shield')} Viskas patvirtinta</span>` : ''}
    </div>`).join('') : `<div class="empty" style="height:auto">${ic('shield')}<h3>Nieko netikrinti</h3></div>`}
    <div class="card"><h3>Netrukus baigsis</h3><div class="row between small"><span>Rimas · draudimas (LKN 512)</span><span class="tag warn">2026-12-14</span></div>
      <p class="muted small">Likus 30 d. vairuotojui siunčiamas priminimas. Pasibaigus profilis paslepiamas automatiškai.</p></div>`;
  view.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
    const p = S.queue[Number(b.dataset.p)], k = b.dataset.k, it = p.items[k];
    it.st = b.dataset.a; it.at = TODAY;
    const u = view.querySelector(`#u-${b.dataset.p}-${k}`); if(u) it.until = u.value;
    if(p.me){ const v=S.verify[ME_DRIVER][k]; Object.assign(v, {st:it.st, until:it.until, at:TODAY, note:''}); }
    if(Object.values(p.items).every(i=>i.st==='ok')) toast(`${p.driver}: viskas patvirtinta`);
    render();
  }));
}

render();
</script>
